[graph]
all-features = true
# What Fennec ships on. The TLS verifier's Android parts, and what only they pull in, aren't.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "aarch64-unknown-linux-gnu",
    "x86_64-unknown-linux-gnu",
    "x86_64-pc-windows-gnullvm",
    "x86_64-pc-windows-gnu",
]

[advisories]
# No ignored advisories. Each entry added here says why it's safe and when it goes.
ignore = []

[licenses]
# Apache-2.0 with the LLVM exception only loosens Apache-2.0's terms.
# Zlib is as permissive as MIT, and so are ISC, which `ring` and `rustls-webpki` use, BSD-3-Clause,
# which `subtle` uses, and CDLA-Permissive-2.0, which `webpki-root-certs` uses. That one's only a
# dependency of the TLS verifier on wasm, where Fennec doesn't build the verifier.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "ISC",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
# Fennec's own crates aren't published, so their license is checked by review, not here.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# Dependencies' own dependencies pull in older copies of these. Remove each once they catch up.
skip = [
    { crate = "getrandom@0.2.17", reason = "ring, through rustls" },
    { crate = "windows-sys@0.52.0", reason = "ring, through rustls" },
    { crate = "windows-sys@0.59.0", reason = "corosensei's Windows stacks, through fennec-parked" },
    { crate = "io-lifetimes@2.0.4", reason = "fs-set-times, through cap-std: its latest, 0.20.3, still asks for 2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
