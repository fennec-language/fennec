name: Release

# Pushing a tag like v0.1.0 builds `fennec` and the launcher for each platform, attests where each
# archive came from, and publishes them with checksums as a GitHub release. A pull request that changes
# what goes in an archive builds them too, and tries each one with no toolchain around, but only
# a tag publishes. Each night, and when it's started by hand, it also installs each archive
# through the launcher and uses it for everything a person would, so a release can't quietly
# stop working between tags. Started by hand on a tag that's been signed, it puts the launcher up
# at https://dl.fennec-lang.dev, once Chris approves: see the `upload` job.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/windows.sh
      - .cargo/config.toml
      - THIRD-PARTY.md
      - .github/scripts/musl-runtime.sh
      - .github/scripts/release-build.sh
      - .github/scripts/release-env.sh
      - .github/scripts/release-container.sh
      - .github/scripts/pack.sh
      - crates/fennec/src/aot.rs
      - crates/llvm/src/build.rs
  workflow_dispatch:
  # Each night, unless a run on main's commit already passed (`release-passed.sh`).
  schedule:
    - cron: "11 5 * * *"

permissions:
  contents: read

jobs:
  # A night whose commit a release run already passed on, which is most nights main didn't move,
  # builds nothing: every job after this one waits on it. A tag, a pull request and a run by hand
  # always build.
  needed:
    name: Anything to build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      build: ${{ steps.passed.outputs.passed != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - id: passed
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: echo "passed=$(.github/scripts/release-passed.sh)" >> "$GITHUB_OUTPUT"

  # What a release build on Linux links a program with to make one that runs on its own: the
  # runtime libraries built for musl, and musl's start-up files and C library. Built on Ubuntu,
  # since AlmaLinux has no C compiler for musl, and nothing here depends on the machine's glibc.
  musl:
    name: Runtime for musl (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    needs: needed
    if: needs.needed.outputs.build == 'true'
    runs-on: ${{ matrix.os }}
    # Ubuntu's, pinned, with its compilers pinned, so a rebuild before signing has the same ones
    # (`rebuild-release.sh`). A pin Ubuntu no longer has fails here, and is moved on.
    container: "ubuntu:24.04@sha256:562111b88caa79c71391c0c4d3c2114a7d5c35915c20561fd893cb1e07929e6b"
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      # Git first, so the checkout is one; what's built with comes after, from the checkout.
      - name: Install git
        run: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install what it's built with
        shell: bash
        run: |
          .github/scripts/release-container.sh ubuntu
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build it
        shell: bash
        run: |
          source .github/scripts/release-env.sh "$(uname -m)-unknown-linux-musl"
          .github/scripts/musl-runtime.sh musl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: musl-${{ matrix.target }}
          retention-days: 1
          path: musl

  build:
    name: Build (${{ matrix.platform.target }}${{ matrix.copy == 'rebuild' && ', again' || '' }})
    needs: musl
    strategy:
      fail-fast: false
      matrix:
        # Each platform is built twice, the second time from a checkout somewhere else, on
        # another machine, and `reproducible` holds that both made the same archive.
        copy: [release, rebuild]
        platform:
          # Linux's are built and tried on AlmaLinux 8, so they run with glibc 2.28 and later: RHEL
          # 8 and later, Debian 10 and later, Ubuntu 20.04 and later. Built on the runner's own
          # Ubuntu, `fennec` needed glibc 2.39, and the runtime 2.38 to link a program.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, container: "almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, container: "almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b" }
          # Each Mac is built with the Xcode `release-env.sh` pins, and fails if its image hasn't
          # it. The Arm Mac's is the signing Mac's, 27.2, so a rebuild before signing checks it
          # too (`rebuild-release.sh`); GitHub's `xcode-27` image has it.
          - { os: xcode-27, target: aarch64-apple-darwin }
          # On an Intel Mac, so its archive is tried on the machine it's for.
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          # Programs link with LLD and MinGW-w64's libraries there: see `.github/scripts/windows.sh`.
          - { os: windows-latest, target: x86_64-pc-windows-gnullvm }
    runs-on: ${{ matrix.platform.os }}
    container: ${{ matrix.platform.container }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: ${{ matrix.copy == 'rebuild' && 'second-copy' || '.' }}
    steps:
      # A container has none of the runner's tools. Git first, so the checkout is one; what's
      # built with comes after, from the checkout, at the versions it pins.
      - name: Install git in the container
        if: matrix.platform.container
        # Before the checkout, so not in the second copy's folder, which isn't there yet.
        working-directory: .
        run: dnf install -y -q git
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ matrix.copy == 'rebuild' && 'second-copy' || '' }}
      - name: Install what it's built with in the container
        if: matrix.platform.container
        run: |
          .github/scripts/release-container.sh alma
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Use Rust's gnullvm toolchain and llvm-mingw
        if: runner.os == 'Windows'
        shell: bash
        run: .github/scripts/windows.sh toolchain
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: runner.os == 'Linux'
        with:
          name: musl-${{ matrix.platform.target }}
          path: ${{ matrix.copy == 'rebuild' && 'second-copy/musl' || 'musl' }}
      # The same commit builds the same bytes wherever it's checked out and whenever, here and
      # in a rebuild before signing, which runs this same script (`rebuild-release.sh`).
      - name: Build and pack the archives
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: .github/scripts/release-build.sh "$TARGET"
      # What a user gets: the archive's own tools, with Rust's toolchain, llvm-mingw and Visual
      # Studio out of reach and a Fennec home with nothing in it. On macOS and Linux, `cc` is still
      # the system's, which links; on Windows, the archive's own LLD links.
      - name: Try the archive with no toolchain around
        if: matrix.copy == 'release'
        shell: bash
        run: |
          reach="$(printf '%s' "$PATH" | tr ':' '\n' | grep -viE 'cargo|rustup|mingw|visual studio' | paste -sd: -)"
          fennec="$PWD/$PACKAGED/fennec"
          source="$PWD/examples"
          cd "$RUNNER_TEMP"
          try() {
            echo "--- $*" >&2
            env PATH="$reach" RUSTUP_HOME="$RUNNER_TEMP/no-rustup" CARGO_HOME="$RUNNER_TEMP/no-cargo" \
              FENNEC_HOME="$RUNNER_TEMP/fennec-home" "$@"
          }
          # What each program printed is read by an assignment, which fails the step when the
          # program does: inside `[ "$( )" = … ]`, or piped to `sort`, its exit was lost.
          try "$fennec" build "$source/hello.fen" -o hello
          printed=$(try ./hello)
          [ "$printed" = "$(cat "$source/hello.out")" ]
          try "$fennec" build --release "$source/hello.fen" -o hello_release
          printed=$(try ./hello_release)
          [ "$printed" = "$(cat "$source/hello.out")" ]
          try "$fennec" build "$source/parallel_loops.fen" -o threads
          printed=$(try ./threads)
          [ "$(sort <<< "$printed")" = "$(sort "$source/parallel_loops.out")" ]
          try "$fennec" build --release "$source/parallel_loops.fen" -o threads_release
          printed=$(try ./threads_release)
          [ "$(sort <<< "$printed")" = "$(sort "$source/parallel_loops.out")" ]
          # On Linux, a release build asks for no loader, so it runs with nothing from the machine.
          if [ "$RUNNER_OS" = Linux ]; then
            for program in hello_release threads_release; do
              ! grep -q 'ld-linux' "$program" || { echo "$program asks for the system's loader"; exit 1; }
            done
            [ "$(env -i ./hello_release)" = "$(cat "$source/hello.out")" ]
            try "$fennec" notices hello_release | grep -q 'Rich Felker'
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v') && matrix.copy == 'release'
        with:
          subject-path: |
            ${{ env.ARCHIVE }}
            ${{ env.LAUNCHER_ARCHIVE }}
      # A tag run keeps its archives and manifest 14 days, since its `upload` job uploads them only
      # once Chris approves it, which may be days later. Other runs keep them 1 day.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.copy }}-${{ matrix.platform.target }}
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 14 || 1 }}
          path: |
            ${{ matrix.copy == 'rebuild' && 'second-copy/' || '' }}${{ env.ARCHIVE }}
            ${{ matrix.copy == 'rebuild' && 'second-copy/' || '' }}${{ env.LAUNCHER_ARCHIVE }}

  # The manifests, the toolchain's and the launcher's, are what get signed, offline, by hand: see
  # docs/releases.md. Until they're signed, the launcher won't install the release. A pull request writes one too, so a change to the
  # archives' names fails there rather than at a release.
  manifest:
    name: Write the release's manifest
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The launcher installs a release by its tag's version, and kits pin that version, so the
      # `fennec` inside has to say the same one: `Cargo.toml`'s.
      - name: The tag names the version the toolchain is built as
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          built="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          [ "${GITHUB_REF_NAME#v}" = "$built" ] || { echo "::error::the tag is $GITHUB_REF_NAME, but Cargo.toml builds Fennec $built"; exit 1; }
      - name: Install the toolchain `rust-toolchain.toml` names
        run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      # Named as the archives are, by the version they build as.
      - run: |
          version="$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"$/\1/p' Cargo.toml)"
          mkdir manifest
          cargo run --release --locked -q -p fennec-dist -- manifest toolchain "$version" dist/fennec-v* > "manifest/fennec-v$version.manifest"
          cargo run --release --locked -q -p fennec-dist -- manifest launcher "$version" dist/fennec-launcher-v* > "manifest/fennec-launcher-v$version.manifest"
          cat manifest/*
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 14 || 1 }}
          path: manifest

  # A dry run of a release, as a person gets one: the launcher's archive unpacked, and the
  # toolchain's installed through it into an empty Fennec home, then every example and example kit built, run and tested from that
  # install, and a kit with a dependency built into a program that runs on its own. Nothing it
  # runs can reach this checkout or Rust's toolchain. Nobody signs it: see
  # `.github/scripts/release-dry-run.sh`.
  dry-run:
    name: Installed and used (${{ matrix.target }})
    if: github.event_name != 'pull_request'
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, target: aarch64-apple-darwin }
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: windows-latest, target: x86_64-pc-windows-gnullvm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The launcher is built for the archive's platform, which on Windows is LLVM's GNU target.
      - name: Use Rust's gnullvm toolchain and llvm-mingw
        if: runner.os == 'Windows'
        shell: bash
        run: .github/scripts/windows.sh toolchain
      - name: Install the toolchain `rust-toolchain.toml` names
        run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ matrix.target }}
          path: archive
      - name: Install the archive through the launcher and use it
        shell: bash
        run: .github/scripts/release-dry-run.sh archive/fennec-v* archive/fennec-launcher-v* ${{ matrix.target }}

  # Each archive built twice is the same bytes, so anyone can build a release from its tag and
  # check it's the one that was signed. Where one isn't, this says which files differ.
  reproducible:
    name: Built twice, the same
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: first
          pattern: release-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: second
          pattern: rebuild-*
          merge-multiple: true
      - run: |
          differ=0
          for again in second/*; do
            archive="${again#second/}"
            if cmp -s "first/$archive" "$again"; then
              sum=$(sha256sum < "$again")
              echo "the same: $archive ${sum:0:16}"
              continue
            fi
            differ=1
            echo "::error::$archive isn't the same built twice"
            mkdir -p "unpacked/first" "unpacked/second"
            if [ "${archive%.zip}" != "$archive" ]; then
              unzip -q "first/$archive" -d unpacked/first
              unzip -q "$again" -d unpacked/second
            else
              tar xzf "first/$archive" -C unpacked/first
              tar xzf "$again" -C unpacked/second
            fi
            diff -rq unpacked/first unpacked/second || true
            rm -rf unpacked
          done
          exit "$differ"

  # Pushing a tag publishes it. A run started by hand on a tag that's published already doesn't.
  publish:
    name: Publish the release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build, manifest, reproducible, dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest
          path: dist
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --prerelease

  # The launcher goes up to the bucket `fennec self update` reads, https://dl.fennec-lang.dev,
  # only from a run started by hand on a tag, after the person signing has rebuilt it and put the
  # launcher manifest's `.sig` on the release (docs/releases.md). The `release` environment asks
  # Chris first, and holds the bucket's token. The token is tried before anything else, writing
  # nothing. Nothing goes up unless the release keys built into `fennec-dist` signed the manifest,
  # and it's the manifest this run built from the tag, byte for byte, after the run's own
  # built-twice check and dry run passed: see `.github/scripts/release-upload.sh`. Uploading is last.
  upload:
    name: Upload the launcher to dl.fennec-lang.dev
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/tags/v')
    needs: [manifest, reproducible, dry-run]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install rclone, pinned by version and hash
        run: .github/scripts/release-upload.sh install
      - name: The bucket's token lists the bucket, writing nothing
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: .github/scripts/release-upload.sh check
      - name: Install the toolchain `rust-toolchain.toml` names
        run: rustup toolchain install
      # It checks the signatures against the release keys built in, as the launcher does.
      - run: cargo build --release --locked -q -p fennec-dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: built
          pattern: release-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest
          path: built
      - name: Fetch what the signer put on the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir signed
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --dir signed \
            --pattern "fennec-launcher-$GITHUB_REF_NAME.manifest" --pattern "fennec-launcher-$GITHUB_REF_NAME.manifest.sig" || true
          ls -l signed
      - name: Upload the launcher, if it's signed
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
        run: .github/scripts/release-upload.sh upload "${GITHUB_REF_NAME#v}" built signed
