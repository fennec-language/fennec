name: Repeat a test

# One test run many times on one system, by hand, to catch a failure that comes once in a while:
# a flake, which is a bug, often on one system only. The runs are shared out among jobs that run at
# once, each building the test once, so 200 runs of a test that takes three minutes on Windows end
# in well under the four hours a job may take. Each run that fails keeps all it printed, in its
# job's `repeat-<share>` artifact, and the summary page says how many of how many failed. For
# example, a replay test that exited 1 once in a while on Windows:
#
#   gh workflow run "Repeat a test" -f os=windows-latest \
#     -f test=replay::a_task_stopped_in_a_sleep_is_stopped_there_in_its_replay -f times=200
#
# A test run alone, as `--exact`, may not fail the way it does in CI, where it runs beside the rest
# of its binary. With `exact` off, `test` is a filter, as `cargo test` takes one, and each run runs
# every test it matches, at once, as CI does: `-f exact=false -f test=replay::` runs the whole
# replay module each time.
on:
  workflow_dispatch:
    inputs:
      os:
        description: The system to run it on
        type: choice
        options: [windows-latest, ubuntu-latest, ubuntu-24.04-arm, macos-latest]
        default: windows-latest
      package:
        description: The package the test is in
        default: fennec
      target:
        description: Its test target, the name `--test` takes; empty for the package's own unit tests
        default: fennec
      test:
        description: The test's whole name, as `cargo test` names it, or a filter when `exact` is off
        required: true
      exact:
        description: Run that one test alone; off runs every test the name matches, at once, as CI does
        type: boolean
        default: true
      times:
        description: How many times to run it, in all
        default: "200"
      shares:
        description: How many jobs share the runs, at once
        default: "8"

permissions:
  contents: read

jobs:
  plan:
    name: Share out the runs
    runs-on: ubuntu-latest
    outputs:
      shares: ${{ steps.plan.outputs.shares }}
    steps:
      - id: plan
        env:
          TIMES: ${{ inputs.times }}
          SHARES: ${{ inputs.shares }}
        run: |
          for number in "$TIMES" "$SHARES"; do
            case "$number" in '' | 0 | *[!0-9]*) echo "::error::times and shares are whole numbers over 0, not $number"; exit 1 ;; esac
          done
          [ "$SHARES" -le 32 ] || { echo "::error::32 jobs at once at most, not $SHARES"; exit 1; }
          echo "shares=[$(seq -s , 1 "$SHARES")]" >> "$GITHUB_OUTPUT"

  repeat:
    name: Repeat ${{ inputs.test }} on ${{ inputs.os }}, share ${{ matrix.share }}
    needs: plan
    runs-on: ${{ inputs.os }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        share: ${{ fromJSON(needs.plan.outputs.shares) }}
    env:
      FENNEC_EXPECT_LLVM: "1"
      PACKAGE: ${{ inputs.package }}
      TARGET: ${{ inputs.target }}
      TEST: ${{ inputs.test }}
      EXACT: ${{ inputs.exact }}
      TIMES: ${{ inputs.times }}
      SHARES: ${{ inputs.shares }}
      SHARE: ${{ matrix.share }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # As CI's test jobs set up: Fennec links programs with LLD and MinGW-w64's libraries on
      # Windows, and with LLVM's tools from the toolchain's own `llvm-tools` elsewhere.
      - name: Use Rust's gnullvm toolchain and llvm-mingw
        if: runner.os == 'Windows'
        shell: bash
        run: .github/scripts/windows.sh toolchain
      - name: Install LLVM's tools
        if: runner.os != 'Windows'
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: repeat
      - name: Build the runtime libraries
        shell: bash
        run: |
          cargo build --locked -p fennec-runtime
          cargo build --locked -p fennec-runtime --features threads --target-dir target/threads
          cp target/threads/debug/libfennec_runtime.a target/debug/libfennec_runtime_threads.a
      - name: Gather LLVM's tools and what they link
        if: runner.os == 'Windows'
        shell: bash
        run: |
          .github/scripts/windows.sh folder target/debug/llvm
          echo "FENNEC_LLVM_BIN=$(cygpath -w "$PWD/target/debug/llvm/bin")" >> "$GITHUB_ENV"
      - name: Build the test once
        shell: bash
        run: |
          if [ -n "$TARGET" ]; then which=(--test "$TARGET"); else which=(--lib); fi
          cargo test --locked -p "$PACKAGE" "${which[@]}" --no-run
      # On Windows, every program that crashes is caught where it crashed: the debugger, `cdb`, set
      # as the one Windows starts on a crash, writes each thread's stack and a full dump into this
      # share's folder. Windows Error Reporting's own dumps are asked for too, but the runner's
      # image turns its reporting off, so they never came: what's set says so on the log.
      - name: Catch each program that crashes
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumps = Join-Path $env:GITHUB_WORKSPACE "repeat-$env:SHARE\dumps"
          New-Item -ItemType Directory -Force -Path $dumps | Out-Null
          foreach ($key in 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting', 'HKLM:\SOFTWARE\Policies\Microsoft\Windows\Windows Error Reporting') {
            "$key :"; Get-ItemProperty -Path $key -ErrorAction SilentlyContinue | Format-List | Out-String
          }
          Get-Service WerSvc | Format-List Name, Status, StartType | Out-String
          $reporting = 'HKLM:\SOFTWARE\Microsoft\Windows\Windows Error Reporting'
          New-ItemProperty -Path $reporting -Name Disabled -PropertyType DWord -Value 0 -Force | Out-Null
          $local = "$reporting\LocalDumps"
          New-Item -Path $local -Force | Out-Null
          New-ItemProperty -Path $local -Name DumpFolder -PropertyType ExpandString -Value $dumps -Force | Out-Null
          New-ItemProperty -Path $local -Name DumpType -PropertyType DWord -Value 2 -Force | Out-Null
          New-ItemProperty -Path $local -Name DumpCount -PropertyType DWord -Value 10 -Force | Out-Null
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (Test-Path $cdb) {
            $debugger = '"' + $cdb + '" -p %ld -e %ld -g -logo "' + $dumps + '\crash-%ld.txt" -c ".dump /ma /u ' + $dumps + '\crash.dmp; !analyze -v; ~*k 40; q"'
            $aedebug = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion\AeDebug'
            New-ItemProperty -Path $aedebug -Name Debugger -PropertyType String -Value $debugger -Force | Out-Null
            New-ItemProperty -Path $aedebug -Name Auto -PropertyType String -Value '1' -Force | Out-Null
            "cdb is the debugger Windows starts on a crash"
          } else {
            "::warning::there's no cdb at $cdb, so only Windows Error Reporting can keep a dump"
          }
      # This share's runs are those numbered SHARE, SHARE + SHARES and on, up to TIMES, so each
      # run's number is its own across the shares. Each says how long it took, so a share stopped
      # partway still says how far it got. Each run has a temporary folder of its own, and a test
      # that fails keeps its folder there (`FENNEC_KEEP_FAILED`), the programs it built in it, which
      # a failed run keeps beside what it printed.
      - name: Run it, again and again
        shell: bash
        run: |
          if [ -n "$TARGET" ]; then which=(--test "$TARGET"); else which=(--lib); fi
          filter=("$TEST")
          [ "$EXACT" = true ] && filter+=(--exact)
          mkdir -p "repeat-$SHARE"
          ran=0
          failed=0
          for run in $(seq "$SHARE" "$SHARES" "$TIMES"); do
            started=$SECONDS
            said="repeat-$SHARE/run-$run.txt"
            temporary="$RUNNER_TEMP/run-$run"
            mkdir -p "$temporary"
            if [ "$RUNNER_OS" = Windows ]; then temporary=$(cygpath -w "$temporary"); fi
            if ! FENNEC_KEEP_FAILED=1 TMPDIR="$temporary" TMP="$temporary" TEMP="$temporary" \
              cargo test --locked -q -p "$PACKAGE" "${which[@]}" -- "${filter[@]}" > "$said" 2>&1; then
              failed=$((failed + 1))
              echo "::error::run $run of $TIMES failed, after $((SECONDS - started)) s"
              tail -n 40 "$said"
              mv "$RUNNER_TEMP/run-$run" "repeat-$SHARE/run-$run-kept" || true
            elif grep -q "test result: ok. 0 passed" "$said"; then
              # No test of that name ran: every run would say the same, so it stops here.
              echo "::error::no test named $TEST ran"
              cat "$said"
              exit 1
            else
              echo "run $run passed in $((SECONDS - started)) s"
              rm "$said"
              rm -rf "$RUNNER_TEMP/run-$run"
            fi
            ran=$((ran + 1))
            echo "$ran $failed" > "repeat-$SHARE/counts"
          done
          echo "$failed of this share's $ran runs failed"
          [ "$failed" -eq 0 ]
      # Each dump read by the Windows debugger: what it stopped on, and every thread's stack.
      - name: Read each dump's stacks
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $dumps = Join-Path $env:GITHUB_WORKSPACE "repeat-$env:SHARE\dumps"
          foreach ($said in @(Get-ChildItem -Path $dumps -Filter crash-*.txt -ErrorAction SilentlyContinue)) {
            "== $($said.Name), as cdb caught it"
            Get-Content $said.FullName -Tail 120
          }
          $found = @(Get-ChildItem -Path $dumps -Filter *.dmp -ErrorAction SilentlyContinue)
          "$($found.Count) dumps"
          if ($found.Count -eq 0) { exit 0 }
          $cdb = 'C:\Program Files (x86)\Windows Kits\10\Debuggers\x64\cdb.exe'
          if (-not (Test-Path $cdb)) { "::warning::there's no cdb at $cdb, so the dumps are kept unread"; exit 0 }
          foreach ($dump in $found) {
            & $cdb -z $dump.FullName -c '!analyze -v; ~*k 30; q' > "$($dump.FullName).txt" 2>&1
            "== $($dump.Name)"
            Get-Content "$($dump.FullName).txt" -Tail 80
          }
      # `total` adds these up. Kept even when the job is stopped partway, so its runs still count.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: repeat-${{ matrix.share }}
          path: repeat-${{ matrix.share }}
          if-no-files-found: ignore
          retention-days: 14

  total:
    name: How many failed, of how many
    needs: repeat
    if: always()
    runs-on: ubuntu-latest
    env:
      TEST: ${{ inputs.test }}
      OS: ${{ inputs.os }}
      TIMES: ${{ inputs.times }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: repeat-*
          path: shares
      - name: Add up every share's runs
        run: |
          ran=0
          failed=0
          for counts in shares/*/counts; do
            [ -f "$counts" ] || continue
            read -r share_ran share_failed < "$counts"
            ran=$((ran + share_ran))
            failed=$((failed + share_failed))
          done
          {
            echo "## $TEST on $OS"
            echo
            echo "$failed of $ran runs failed, of the $TIMES asked for."
            # A run that failed, or the one going when its share was stopped.
            for kept in shares/*/run-*.txt; do
              if [ -f "$kept" ]; then echo "- kept: \`${kept#shares/}\`"; fi
            done
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$failed of $ran runs failed, of the $TIMES asked for"
          [ "$failed" -eq 0 ] && [ "$ran" -eq "$TIMES" ]
