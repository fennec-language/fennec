name: CI

# Changes land on main as soon as they're merged, after the gate on the machine they're written on
# (see `docs/landing.md`), so this runs after the merge rather than before it. A red run gets a fix
# or a revert.
on:
  push:
    branches: [main]
  # `staging.yml` runs this on the commit it may move main to.
  workflow_call:
  # By hand on any branch, `gh workflow run CI --ref <branch>`, for what only another system shows,
  # like a Windows failure.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels its older run. Pushes to main share a group, which
# keeps one running and only the newest waiting: each run covers every commit before it, and the
# one running finishes, as it's what saves the caches pull requests start from. Anything else,
# like a merge group or a run for `staging.yml`, gets a group of its own, since sharing one would
# drop some that are needed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.ref == 'refs/heads/main' && github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # A pull request or merge group that changes only documentation skips building, testing,
  # benchmarks and sanitizers. It still checks the docs build and the website.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.changes.outputs.docs-only }}
      parked_changed: ${{ steps.changes.outputs.parked-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint and the runner take only `./` for an action in this repository.
      - uses: ./.github/actions/live-merge-group # zizmor: ignore[self-repository]
      - id: changes
        uses: ./.github/actions/docs-only # zizmor: ignore[self-repository]

  lint:
    name: Format, lints and docs
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODE: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - name: Check the Fennec code is formatted
        if: env.CODE == 'true'
        run: cargo run --locked --quiet -p fennec -- fmt --check examples crates/syntax/src/stdlib bench
      # The linter has no off switch, so the examples, which people and AI learn from, pass it.
      - name: Lint the examples
        if: env.CODE == 'true'
        shell: bash
        run: |
          cargo build --locked --quiet -p fennec
          failed=0
          for program in examples/*.fen examples/projects/*/; do
            [ -f "$program" ] || [ -f "$program/kit.toml" ] || continue
            ./target/debug/fennec lint "$program" > /dev/null || failed=1
          done
          exit "$failed"
      # New `unsafe` can't land quietly: every use outside comments, in every Rust file in the
      # repository, is counted by file, and the counts must match the list, which a pull request
      # adding one has to change.
      - name: Count the uses of unsafe
        shell: bash
        run: |
          # One perl reads every file, so the counts aren't split across runs.
          git ls-files -z '*.rs' | perl -e 'my @files = split /\0/, do { local $/; <STDIN> }; my %c;
            for my $file (@files) { open(my $f, "<", $file) or die "$file: $!";
              while (<$f>) { next if m{^\s*//}; $c{$file} += () = /\bunsafe\b/g } }
            printf "%s: %d\n", $_, $c{$_} for grep { $c{$_} } sort keys %c' > unsafe-found.txt
          if ! diff -u <(grep -v '^#' .github/unsafe-allowed.txt) unsafe-found.txt; then
            echo "::error::The uses of unsafe changed: update .github/unsafe-allowed.txt, and say why in the pull request"
            exit 1
          fi
      - run: cargo clippy --all-targets --locked -- -D warnings
        if: env.CODE == 'true'
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }}${{ matrix.part == 'llvm' && ', llvm::' || '' }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # A merge group leaves out macOS. GitHub's macOS runners are short, and a job no runner
    # takes is cancelled after about 15 minutes ("not acquired by Runner"), which knocks the
    # pull request out of the queue. The pull request ran on macOS already, up to date with
    # main as the ruleset requires, and the push to main runs it again.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'merge_group' && '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest"]' || '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "windows-latest"]') }}
        # Windows runs its tests at half the speed of the others, so its `llvm::` tests, a third
        # of the main test binary's and each building a program, take a job of their own.
        part: [main, llvm]
        exclude:
          - os: ubuntu-latest
            part: llvm
          - os: ubuntu-24.04-arm
            part: llvm
          - os: macos-latest
            part: llvm
    runs-on: ${{ matrix.os }}
    # Windows' tests took 20 minutes in one job, and a build with no cache there takes 10 more. A
    # job that runs out of time saves no cache, so the limit leaves room for a cold one. On
    # 2026-11-11 Linux and macOS ran out at 35: their tests took 20 to 30 minutes, and the examples
    # 6 more. The limit is half again what a warm job takes, so one slow runner doesn't fail it.
    timeout-minutes: 50
    # Everything runs through LLVM, so its tests have to run on every platform: with LLVM's tools
    # from the toolchain's own `llvm-tools`, the LLVM rustc uses, a missing tool or runtime
    # library fails them instead of skipping them.
    env:
      FENNEC_EXPECT_LLVM: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Fennec links programs with LLD and MinGW-w64's libraries on Windows, so it's built for them.
      - name: Use Rust's gnullvm toolchain and llvm-mingw
        if: runner.os == 'Windows'
        shell: bash
        run: .github/scripts/windows.sh toolchain
      - name: Install LLVM's tools
        if: runner.os != 'Windows'
        run: rustup component add llvm-tools-preview
      # A failing or stopped run still saves what it built. Otherwise a red main saves nothing, and
      # every run after it builds from nothing: after Windows' key changed, each of its runs did,
      # until they ran out of time.
      # The `llvm::` job builds only the main test binary, so it keeps a cache of its own.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-on-failure: true
          key: ${{ matrix.part == 'llvm' && 'llvm' || '' }}
      # `fennec run` builds through LLVM where it can, linking the runtime library beside
      # `fennec`, so it's built first and the tests take the path users get.
      - name: Build the runtime library
        shell: bash
        run: |
          cargo build --locked -p fennec-runtime
          # The runtime with threads, on its own so Cargo doesn't give the plain one its features
          # too. `fennec build` takes it whenever it's there, so it's built fresh here: one a cache
          # kept from another commit can't read this commit's programs.
          for features in threads; do
            dir="target/$(echo "$features" | tr , -)"
            name="fennec_runtime_$(echo "$features" | tr , _)"
            cargo build --locked -p fennec-runtime --features "$features" --target-dir "$dir"
            cp "$dir/debug/libfennec_runtime.a" "target/debug/lib$name.a"
          done
      # The same `llvm` folder a release puts beside `fennec`: LLVM's tools, LLD and the libraries
      # it links. The tests look for the tools themselves, from a folder deeper than `fennec`'s.
      - name: Gather LLVM's tools and what they link
        if: runner.os == 'Windows'
        shell: bash
        run: |
          .github/scripts/windows.sh folder target/debug/llvm
          echo "FENNEC_LLVM_BIN=$(cygpath -w "$PWD/target/debug/llvm/bin")" >> "$GITHUB_ENV"
      # Every test binary runs even after one fails, so a red run shows every failure, not the
      # first binary's alone; the step still fails if any test did.
      - name: Run cargo test --locked
        if: runner.os != 'Windows'
        run: cargo test --locked --no-fail-fast
      # Between them, Windows' two jobs run every test once: no test outside `fennec`'s main test
      # binary has `llvm::` in its name.
      - name: Run every test but the LLVM ones
        if: runner.os == 'Windows' && matrix.part == 'main'
        run: cargo test --locked --no-fail-fast -- --skip 'llvm::'
      - name: Run the LLVM tests
        if: matrix.part == 'llvm'
        run: cargo test --locked --no-fail-fast -p fennec --test fennec 'llvm::'
      # Every test removes what it makes in the temporary folder, passing or failing, so a run
      # leaves no `fennec-*` folder there.
      - name: Check the tests left nothing in the temporary folder
        if: ${{ !cancelled() }}
        shell: bash
        run: .github/scripts/temp-left.sh
      # Which tests passed. A pull request reads its own results, then the shared ones, and
      # keeps its own apart: GitHub never shows one pull request's cache to another run, so
      # none can plant a false pass. Only a full run on main writes the shared results.
      - name: Restore test results
        if: matrix.part == 'main'
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fennec-home
          key: fennec-tests-${{ github.event.pull_request.number || 'shared' }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            fennec-tests-${{ github.event.pull_request.number || 'shared' }}-${{ runner.os }}-${{ runner.arch }}-
            fennec-tests-shared-${{ runner.os }}-${{ runner.arch }}-
      - name: Run every example and kit through the fennec command
        if: matrix.part == 'main'
        shell: bash
        env:
          FENNEC_HOME: ${{ runner.temp }}/fennec-home
        run: |
          # After a merge, every test runs, which catches any bug in what the cache reuses.
          all=()
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            all=(--all)
          fi
          cargo build --locked --quiet -p fennec
          # Each takes a second or so. The limit names a program that hangs, with the job's own as
          # the backstop, and what it prints goes to a file so nothing left running can hold a pipe.
          fennec() { .github/scripts/within.sh 120 ./target/debug/fennec "$@"; }
          printed="$RUNNER_TEMP/printed.txt"

          # The limit has to work to be any use, on each platform, and stop what it started too:
          # `cat` only ends once nothing is left that could write to it.
          printf 'def main():\n    while True:\n        pass\n' > "$RUNNER_TEMP/forever.fen"
          status=0
          .github/scripts/within.sh 5 ./target/debug/fennec run "$RUNNER_TEMP/forever.fen" | cat || status=$?
          [ "$status" = 124 ] || { echo "::error::the time limit gave $status for a program that never ends"; exit 1; }

          for program in examples/*.fen; do
            fennec run "$program" > "$printed"
            diff --strip-trailing-cr "${program%.fen}.out" "$printed"
            fennec test "${all[@]}" "$program" > /dev/null
          done
          for kit in examples/projects/*/; do
            [ -f "$kit/kit.toml" ] || continue
            fennec run "$kit" > "$printed"
            diff --strip-trailing-cr "${kit%/}.out" "$printed"
            fennec test "${all[@]}" "$kit" > /dev/null
          done
      # The cache is one build's, so a change to the compiler can't be hidden by what an older
      # one compiled: see docs/store.md.
      - name: A changed compiler runs nothing an older one compiled
        if: matrix.part == 'main' && matrix.os == 'ubuntu-latest'
        run: .github/scripts/test-stale-cache.sh
      - name: Save test results
        if: matrix.part == 'main' && github.event_name != 'merge_group'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fennec-home
          key: fennec-tests-${{ github.event.pull_request.number || 'shared' }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  # Native code on an Intel Mac. Linux covers x86-64 and the other Mac covers Arm, but an Arm-only
  # pass can hide what only x86-64 does, like having two return registers, not eight, and macOS
  # has its own way of calling on each. Every program in the repository has to build as native code
  # here, and every LLVM test, the examples' output among them, has to pass. A merge group leaves
  # it out, as it does the other Mac.
  x86-mac:
    name: Native code on x86-64 macOS
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'merge_group'
    runs-on: macos-15-intel
    timeout-minutes: 40
    env:
      FENNEC_EXPECT_LLVM: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM's tools
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the runtime libraries
        run: |
          cargo build --locked -p fennec-runtime
          for features in threads; do
            dir="target/$(echo "$features" | tr , -)"
            name="fennec_runtime_$(echo "$features" | tr , _)"
            cargo build --locked -p fennec-runtime --features "$features" --target-dir "$dir"
            cp "$dir/debug/libfennec_runtime.a" "target/debug/lib$name.a"
          done
      - run: cargo test --locked -p fennec --test fennec 'llvm::'

  # `std.postgres` against a real server, which only Linux runners can host.
  postgres:
    name: Postgres against a real server
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fennec
          POSTGRES_PASSWORD: fennec-test
          POSTGRES_DB: fennec
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U fennec"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 30
    env:
      FENNEC_EXPECT_LLVM: 1
      # A password for this throwaway container, and nothing else.
      FENNEC_TEST_POSTGRES: postgres://fennec:fennec-test@127.0.0.1:55432/fennec
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM's tools
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the runtime libraries
        run: |
          cargo build --locked -p fennec-runtime
          for features in threads; do
            dir="target/$(echo "$features" | tr , -)"
            name="fennec_runtime_$(echo "$features" | tr , _)"
            cargo build --locked -p fennec-runtime --features "$features" --target-dir "$dir"
            cp "$dir/debug/libfennec_runtime.a" "target/debug/lib$name.a"
          done
      - run: cargo test --locked -p fennec --test fennec 'llvm::postgres_'

  # Only a report, of tests `test` runs too, so a merge group leaves it out. The pull request
  # and the push to main each have it.
  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `tee` would hide a failing test without `pipefail`, which `shell: bash` turns on. The
      # tests that mostly link programs, rather than run the compiler, are the test jobs' to run.
      - name: Measure coverage
        shell: bash
        run: |
          cargo llvm-cov --locked --summary-only -- --skip llvm:: --skip executables:: --skip parallel:: --skip replay:: --skip live:: | tee coverage.txt
      - name: Show coverage on the run's summary page
        run: |
          {
            echo '## Coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deny:
    name: Licenses, advisories and sources
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  site:
    name: Website builds
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build runs fennec-reference, which writes the language page from the examples.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run build --prefix site

  workflows:
    name: Workflow lints and security audit
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: zizmor@1.31.1
      - name: zizmor
        run: zizmor --offline --min-severity low .github/workflows
      - name: The landing hook and helper, on a throwaway repository
        run: .github/scripts/test-landing.sh
      - name: Opening a pull request, on a throwaway repository
        run: .github/scripts/test-open-pr.sh
      - name: Giving up on a command that won't stop, as the gate must when Rosetta is wedged
        run: .github/scripts/test-within.sh
      - name: Sweeping old build files, on worktrees made for it
        run: .github/scripts/test-sweep-builds.sh
      # The installer runs as `sh` on machines Fennec has never seen, so it keeps to POSIX sh.
      - name: shellcheck the installer
        run: shellcheck --shell=sh site/public/install.sh

  bench:
    name: Benchmarks
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Each kernel is built through LLVM, with LLVM's tools and the runtime library.
      - name: Install LLVM's tools
        run: rustup component add llvm-tools-preview
      - name: Build fennec, its runtime and the benchmark suite
        run: cargo build --release --locked -p fennec -p fennec-runtime -p fennec-bench
      # The previous commit is the base of a pull request or merge group, or the commit before
      # a push to main. Both versions run on this machine, so their times compare fairly.
      # A merge group leaves it out: slowdowns against it are only warnings, which the pull request
      # and the push to main show. Wrong output and the enforced floors still fail it.
      - name: Build the previous commit's fennec
        if: github.event_name != 'merge_group'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git worktree add --detach ../previous "$BASE"
            cargo build --release --locked -p fennec -p fennec-runtime --manifest-path ../previous/Cargo.toml --target-dir target/previous
          fi
      # Each kernel's LLVM release build has its work counted in instructions and compared with
      # its pinned target. The runner's virtual CPU usually hides the counters perf reads, so
      # Valgrind counts by simulating instead.
      - name: Install tools that count instructions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind linux-tools-common "linux-tools-$(uname -r)" || echo "some aren't available"
          sudo sysctl -w kernel.perf_event_paranoid=1 || true
      - name: Measure each kernel against its target and the previous commit
        run: |
          previous=()
          if [ -x target/previous/release/fennec ]; then
            previous=(--previous target/previous/release/fennec)
          fi
          # Report only: slowdowns against the previous commit show as warnings, not failures,
          # until the instruction count proves stable on no-op pull requests. Wrong output, or a
          # kernel below an enforced floor, still fails the job.
          ./target/release/fennec-bench --report-only "${previous[@]}"

  # Limits on how long editing, checking, testing and formatting take. A budget that's enforced
  # fails this job; one not met yet shows as a warning. See crates/bench/src/budgets.rs.
  budgets:
    name: Instant-feedback budgets
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # The tests of the kit it times run through LLVM. It runs them in a folder of its own, outside
      # this repository's toolchain file, so it's told where this toolchain's tools are.
      - name: Install LLVM's tools, and musl's C compiler
        run: |
          rustup component add llvm-tools-preview
          echo "FENNEC_LLVM_BIN=$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin" >> "$GITHUB_ENV"
          sudo apt-get install -y -qq musl-tools
      - run: cargo build --release --locked -p fennec -p fennec-runtime -p fennec-bench
      # The `musl` folder a release has beside `fennec`, so builds here link as an installed
      # Fennec's do: on their own, with LLD, rather than through the system's `cc` and its linker.
      - name: Build the runtime libraries for musl
        run: .github/scripts/musl-runtime.sh target/release/musl
      # An edit's verdict and edit to run are held to counts of instructions, which don't depend
      # on which machine this lands on. Their times are shown too, and warn.
      - name: Install what counts instructions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
      - run: ./target/release/fennec-bench budgets

  # Programs built through LLVM, with their code and the runtime library instrumented by
  # AddressSanitizer, so touching memory they don't own stops them. Every example LLVM takes runs,
  # both ways it builds, and must print its `.out`. Then a fixed fuzzing run compares random
  # programs built both ways. Leaks aren't checked: the runtime leaves freeing at exit
  # to the system.
  asan:
    name: AddressSanitizer on LLVM-built programs
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NIGHTLY: nightly-2026-10-15
      FENNEC_SANITIZE: address
      ASAN_OPTIONS: detect_leaks=0:exitcode=86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM's tools, and the nightly compiler AddressSanitizer needs
        run: |
          rustup component add llvm-tools-preview
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build fennec, and its runtime library with AddressSanitizer
        run: |
          cargo build --release --locked -p fennec -p fennec-fuzz
          # `sanitize`: the system's allocator and freed blocks given back, so ASan sees each one.
          RUSTFLAGS=-Zsanitizer=address cargo "+$NIGHTLY" build --release --locked -p fennec-runtime \
            --features sanitize -Zbuild-std --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/libfennec_runtime.a target/release/
          # The runtime with threads too, so random programs that launch tasks, and lock and roll
          # back across threads, run under the sanitizer.
          RUSTFLAGS=-Zsanitizer=address cargo "+$NIGHTLY" build --release --locked -p fennec-runtime \
            --features threads,sanitize -Zbuild-std --target x86_64-unknown-linux-gnu --target-dir target/threads
          cp target/threads/x86_64-unknown-linux-gnu/release/libfennec_runtime.a \
            target/release/libfennec_runtime_threads.a
      - name: Run every example LLVM takes
        run: |
          built=0
          failed=0
          for program in examples/*.fen; do
            for how in dev release; do
              release=()
              [ "$how" = release ] && release=(--release)
              if ! .github/scripts/within.sh 300 ./target/release/fennec build "${release[@]}" "$program" -o checked > /dev/null 2> built.txt; then
                # Anything but a failed tool or link is the backend saying what it doesn't take yet.
                grep -qE "linking failed|failed on|couldn't run|once trimmed|panicked|didn't finish" built.txt || continue
                echo "::error::$program didn't build in $how"; cat built.txt; failed=1; continue
              fi
              if ! nm checked | grep -q __asan_report_load; then
                echo "::error::$program built in $how without AddressSanitizer"; failed=1; continue
              fi
              built=$((built + 1))
              ran=0
              .github/scripts/within.sh 120 ./checked > printed.txt 2> said.txt || ran=$?
              if [ "$ran" = 124 ]; then
                echo "::error::$program built in $how didn't finish"; cat said.txt; failed=1
              elif grep -q AddressSanitizer said.txt; then
                echo "::error::$program built in $how touched memory it doesn't own"; cat said.txt; failed=1
              elif ! cmp -s printed.txt "${program%.fen}.out"; then
                echo "::error::$program built in $how printed something different"; cat said.txt; failed=1
              fi
            done
          done
          echo "$built builds ran under AddressSanitizer"
          [ "$built" -ge 40 ] || { echo "::error::only $built builds ran"; failed=1; }
          exit "$failed"
      - name: Fuzz programs built through LLVM
        run: FENNEC="$PWD/target/release/fennec" ./target/release/fennec-fuzz run llvm --seed 1 --inputs 150 --seconds 300 --found found
      # Random programs, trees of enums holding strings and lists among them, built checking
      # proofs, each compared with the reference evaluator.
      - name: Fuzz random programs
        env:
          FENNEC_CHECK_PROOFS: 1
          # As the workers' job has it, since a task's stack isn't the thread's.
          ASAN_OPTIONS: detect_leaks=0:exitcode=86:detect_stack_use_after_return=0
        run: |
          [ -f target/release/libfennec_runtime_threads.a ] || { echo "::error::no threads runtime"; exit 1; }
          FENNEC="$PWD/target/release/fennec" ./target/release/fennec-fuzz run programs --seed 1 --seconds 300 --stuck 60 --found found
      - name: Keep what fuzzing found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asan-fuzz-found
          path: found
          if-no-files-found: ignore

  # The LLVM tests with every program they build instrumented by AddressSanitizer, so touching
  # memory a program doesn't own stops its test. Native blocks, the ones generated code makes
  # and frees itself outside the runtime's table, go through the system's allocator here, which
  # the sanitizer watches, so one used after it's freed, or freed twice, is caught. The runtime
  # library isn't instrumented here, since the tests build their own; the `asan` job covers it.
  llvm-asan:
    name: LLVM tests under AddressSanitizer
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FENNEC_EXPECT_LLVM: 1
      FENNEC_SANITIZE: address
      ASAN_OPTIONS: detect_leaks=0:exitcode=86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM's tools
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build the runtime libraries
        run: |
          cargo build --locked -p fennec-runtime
          for features in threads; do
            dir="target/$(echo "$features" | tr , -)"
            name="fennec_runtime_$(echo "$features" | tr , _)"
            cargo build --locked -p fennec-runtime --features "$features" --target-dir "$dir"
            cp "$dir/debug/libfennec_runtime.a" "target/debug/lib$name.a"
          done
      - run: cargo test --locked -p fennec --test fennec 'llvm::'

  # Every example and kernel builds with no interpreter in it, and prints what it should, on one
  # thread and on several.
  lean-runtime:
    name: Programs with no interpreter
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM's tools
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build fennec and its runtimes
        run: |
          cargo build --release --locked -p fennec -p fennec-runtime
          cargo build --release --locked -p fennec-runtime --features threads --target-dir target/threads
          cp target/threads/release/libfennec_runtime.a target/release/libfennec_runtime_threads.a
      - name: Build and run every example and kernel
        run: |
          built=0
          failed=0
          for program in examples/*.fen bench/kernels/*.fen; do
            # By path, as an example and a kernel can share a name.
            name=${program%.fen}
            if ! ./target/release/fennec build "$program" -o checked > /dev/null 2> built.txt; then
              # Anything but a failed link is the backend saying what it doesn't take yet.
              grep -qE "linking failed|Undefined symbols|undefined reference" built.txt || continue
              echo "::error::$name didn't link"; cat built.txt; failed=1
              continue
            fi
            built=$((built + 1))
            if [ -f "${program%.fen}.out" ]; then
              timeout 120 ./checked < /dev/null > printed.txt 2> said.txt || true
              if ! cmp -s printed.txt "${program%.fen}.out"; then
                echo "::error::$name printed something different"; cat said.txt; failed=1
              fi
            fi
          done
          echo "$built programs built with no interpreter"
          [ "$built" -ge 90 ] || { echo "::error::only $built built"; failed=1; }
          exit "$failed"
      - name: Run what uses parallel on real threads
        env:
          FENNEC_THREADS_RUNTIME: 1
        run: |
          failed=0
          # What a program should print, its lines sorted: its `.out`, or for one that prints too
          # much to keep, the hash of that in its `.sorted.sha256`.
          wanted() {
            if [ -f "${1%.fen}.out" ]; then LC_ALL=C sort "${1%.fen}.out" | sha256sum; else cat "${1%.fen}.sorted.sha256"; fi
          }
          for program in crates/fennec/tests/fixtures/workers/*.fen examples/parallel_loops.fen examples/parallel_put_back.fen; do
            # A fixture with no pinned output is driven by its own test, which connects to it or stops it.
            case "$program" in crates/*) [ -f "${program%.fen}.out" ] || [ -f "${program%.fen}.sorted.sha256" ] || continue ;; esac
            wanted "$program" > wanted.txt
            ./target/release/fennec build "$program" -o checked > /dev/null
            for threads in 1 4 8; do
              if [ "$(FENNEC_THREADS=$threads timeout 120 ./checked 2> said.txt | LC_ALL=C sort | sha256sum)" != "$(cat wanted.txt)" ]; then
                echo "::error::$program at $threads threads printed something different"; cat said.txt; failed=1
              fi
            done
          done
          exit "$failed"

  # What `parallel` runs on real threads, built with the threads runtime, under AddressSanitizer
  # and ThreadSanitizer, at several thread counts and with every call forced onto the pool. Each
  # has to print what its `.out` says, sorted, as output from bodies comes in call order.
  # On Linux, a release build links its program on its own, with musl's C library in it, once the
  # `musl` folder is beside `fennec`. Examples built that way must print their `.out` in an empty
  # container, with nothing in it but the program.
  static:
    name: Release builds in an empty container
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      FENNEC_EXPECT_LLVM: 1
      FENNEC_EXPECT_STATIC: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl's C compiler and LLVM's tools
        run: |
          sudo apt-get install -y -q musl-tools
          rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build fennec, its runtime library, and the runtime libraries for musl
        run: |
          cargo build --locked -p fennec -p fennec-runtime
          .github/scripts/musl-runtime.sh target/debug/musl --debug
      - name: A release build needs nothing from the machine
        run: cargo test --locked -p fennec --test fennec -- llvm::a_release_build_on_linux_needs_nothing_from_the_machine --exact
      - name: Examples in an empty container
        run: |
          examples="hello game parallel_loops json_ids std_crypto"
          mkdir empty
          for example in $examples; do
            ./target/debug/fennec build --release "examples/$example.fen" -o "empty/$example"
          done
          ./target/debug/fennec notices empty/hello | grep -q 'Rich Felker'
          printf 'FROM scratch\nCOPY . /\n' > empty/Dockerfile
          docker build -q -t fennec-empty empty
          for example in $examples; do
            # `parallel` prints in the order its tasks finish.
            docker run --rm fennec-empty "/$example" | sort > printed.txt
            if ! sort "examples/$example.out" | cmp -s printed.txt -; then
              echo "::error::$example printed something different in an empty container"
              exit 1
            fi
          done

  # The one command that installs a working `fennec` from a checkout, `.github/scripts/install.sh`,
  # tried as someone would: installed, then used from a new kit outside the checkout with Rust's
  # toolchain out of reach, every runtime library from the same source as `fennec`.
  install:
    name: Install from a checkout
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: .github/scripts/install.sh "$RUNNER_TEMP/fennec"
      - name: Use it from a new kit, with nothing but what was installed
        run: |
          reach="$RUNNER_TEMP/fennec:$(printf '%s' "$PATH" | tr ':' '\n' | grep -viE 'cargo|rustup' | paste -sd: -)"
          cd "$RUNNER_TEMP"
          try() {
            env PATH="$reach" RUSTUP_HOME="$RUNNER_TEMP/no-rustup" CARGO_HOME="$RUNNER_TEMP/no-cargo" \
              FENNEC_HOME="$RUNNER_TEMP/fennec-home" "$@"
          }
          try fennec new demo
          cd demo
          [ "$(try fennec run)" = "Hello from demo!" ]
          try fennec test
          try fennec build --release -o "$RUNNER_TEMP/demo-program"
          [ "$("$RUNNER_TEMP/demo-program")" = "Hello from demo!" ]
          # Everything it linked with was built from the same source, so nothing was stale.
          ! try fennec run 2>&1 | grep -q "another build of Fennec"

  worker-sanitizers:
    name: Workers under ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AddressSanitizer
            sanitize: address
            report: AddressSanitizer
            symbol: __asan_report_load
            options: ASAN_OPTIONS=detect_leaks=0:exitcode=86:detect_stack_use_after_return=0
          - name: ThreadSanitizer
            sanitize: thread
            report: ThreadSanitizer
            symbol: __tsan_read
            options: TSAN_OPTIONS=halt_on_error=0:exitcode=86:report_signal_unsafe=0
    env:
      NIGHTLY: nightly-2026-10-15
      FENNEC_THREADS_RUNTIME: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM's tools, and the nightly compiler the sanitizers need
        run: |
          rustup component add llvm-tools-preview
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build fennec, and its threads runtime with the sanitizer
        env:
          SANITIZE: ${{ matrix.sanitize }}
        run: |
          cargo build --release --locked -p fennec
          RUSTFLAGS="-Zsanitizer=$SANITIZE" cargo "+$NIGHTLY" build --release --locked -p fennec-runtime \
            --features threads,sanitize -Zbuild-std --target x86_64-unknown-linux-gnu --target-dir target/threads
          # A `parallel` loop that stays on one thread links the plain runtime, which this also serves as.
          cp target/threads/x86_64-unknown-linux-gnu/release/libfennec_runtime.a \
            target/release/libfennec_runtime_threads.a
          cp target/threads/x86_64-unknown-linux-gnu/release/libfennec_runtime.a target/release/libfennec_runtime.a
      - name: Run every program that uses parallel
        env:
          FENNEC_SANITIZE: ${{ matrix.sanitize }}
          REPORT: ${{ matrix.report }}
          SYMBOL: ${{ matrix.symbol }}
          OPTIONS: ${{ matrix.options }}
        run: |
          failed=0
          runs=0
          export "${OPTIONS?}"
          programs=$(grep -lE 'parallel\(' examples/*.fen | xargs grep -L Net)
          # As in the job above: a program's sorted `.out`, or the hash of it.
          wanted() {
            if [ -f "${1%.fen}.out" ]; then LC_ALL=C sort "${1%.fen}.out" | sha256sum; else cat "${1%.fen}.sorted.sha256"; fi
          }
          for program in $programs crates/fennec/tests/fixtures/workers/*.fen; do
            # As above: a fixture with no pinned output is driven by its own test.
            case "$program" in crates/*) [ -f "${program%.fen}.out" ] || [ -f "${program%.fen}.sorted.sha256" ] || continue ;; esac
            wanted "$program" > wanted.txt
            if ! ./target/release/fennec build "$program" -o checked > /dev/null 2> built.txt; then
              echo "::error::$program didn't build"; cat built.txt; failed=1; continue
            fi
            nm checked | grep -q "$SYMBOL" || { echo "::error::$program built without the sanitizer"; failed=1; }
            for threads in 1 4 8 stress; do
              if [ "$threads" = stress ]; then
                got=$(FENNEC_PARALLEL_STRESS=1 FENNEC_THREADS=4 timeout 120 ./checked 2> said.txt | LC_ALL=C sort | sha256sum)
              else
                got=$(FENNEC_THREADS=$threads timeout 120 ./checked 2> said.txt | LC_ALL=C sort | sha256sum)
              fi
              runs=$((runs + 1))
              if grep -q "$REPORT" said.txt; then
                echo "::error::$program at $threads threads: $REPORT reported"; cat said.txt; failed=1
              elif [ "$got" != "$(cat wanted.txt)" ]; then
                echo "::error::$program at $threads threads printed something different"; cat said.txt; failed=1
              fi
            done
          done
          echo "$runs runs under $REPORT"
          [ "$runs" -ge 40 ] || { echo "::error::only $runs runs"; failed=1; }
          exit "$failed"

  # Parked tasks switch stacks, the one place our own code follows a pointer `unsafe`ly, so
  # their stress tests run under AddressSanitizer, told of each switch, with leaks checked,
  # and under ThreadSanitizer.
  # A merge group runs these only if it changes what they test, which is one crate that uses
  # nothing else in the workspace: nothing another pull request does can break them.
  parked-sanitizers:
    name: Parked tasks under ${{ matrix.name }}
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true'
      && (github.event_name != 'merge_group' || needs.changes.outputs.parked_changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Each sanitizer runs with unwinding, as tests build, and with `panic=abort`, as release
        # builds do.
        include:
          # A local can live on a fake stack on the heap when AddressSanitizer looks for use
          # after return, which the check that a task runs on its own stack would rightly
          # stop on, so that one check is turned off here.
          - name: AddressSanitizer
            flags: -Zsanitizer=address
            features: --features sanitizer
            options: ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=0
            std: std
          - name: AddressSanitizer, panic=abort
            flags: -Zsanitizer=address -Cpanic=abort -Zpanic-abort-tests
            features: --features sanitizer
            options: ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=0
            std: std,panic_abort
          - name: ThreadSanitizer
            flags: -Zsanitizer=thread
            features: ""
            options: TSAN_OPTIONS=halt_on_error=1
            std: std
          - name: ThreadSanitizer, panic=abort
            flags: -Zsanitizer=thread -Cpanic=abort -Zpanic-abort-tests
            features: ""
            options: TSAN_OPTIONS=halt_on_error=1
            std: std,panic_abort
    env:
      NIGHTLY: nightly-2026-10-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the nightly compiler the sanitizers need
        run: rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - name: Run the parked tasks' tests
        env:
          FLAGS: ${{ matrix.flags }}
          FEATURES: ${{ matrix.features }}
          OPTIONS: ${{ matrix.options }}
          STD: ${{ matrix.std }}
        run: |
          # shellcheck disable=SC2086 # `$FEATURES` is two words or none
          env "$OPTIONS" RUSTFLAGS="$FLAGS" RUSTDOCFLAGS="$FLAGS" cargo "+$NIGHTLY" test --locked \
            -Zbuild-std="$STD" --target x86_64-unknown-linux-gnu -p fennec-parked $FEATURES

  # After each push to main, deletes the caches nothing will restore again, so the repository
  # stays under GitHub's 10 GB and its builds keep the caches they start from: see the script.
  prune-caches:
    name: Prune caches
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: .github/scripts/prune-caches.sh
        env:
          GH_TOKEN: ${{ github.token }}

  # Servers run on the `parallel` pool's workers, each with a poll and parked tasks of its own, and
  # hand connections between workers: the runtime's own tests of that and of `parallel`'s pool,
  # under ThreadSanitizer. Network programs aren't in the workers' job above, which needs no clients.
  server-sanitizers:
    name: Servers under ThreadSanitizer
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NIGHTLY: nightly-2026-10-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the nightly compiler the sanitizers need
        run: rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Run the servers' and the pool's tests
        run: |
          env TSAN_OPTIONS=halt_on_error=1:report_signal_unsafe=0 RUSTFLAGS=-Zsanitizer=thread \
            cargo "+$NIGHTLY" test --locked -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p fennec-rt --features threads --lib -- embed::serve embed::parallel

  # One status for branch protection to require, so adding jobs never means changing settings.
  # A job skipped because the change is only documentation counts as passed, and so do the two a
  # merge group can leave out; any other skip, failure or cancellation doesn't.
  ok:
    name: CI passed
    if: always()
    needs: [changes, lint, test, x86-mac, coverage, deny, site, workflows, budgets, bench, worker-sanitizers, server-sanitizers, lean-runtime, static, install, asan, llvm-asan, parked-sanitizers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          PARKED_CHANGED: ${{ needs.changes.outputs.parked_changed }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          failed=0
          while read -r job result; do
            [ "$result" = success ] && continue
            [ "$result" = skipped ] && [ "$DOCS_ONLY" = true ] && continue
            if [ "$result" = skipped ] && [ "$EVENT" = merge_group ]; then
              [ "$job" = coverage ] && continue
              [ "$job" = x86-mac ] && continue
              [ "$job" = parked-sanitizers ] && [ "$PARKED_CHANGED" != true ] && continue
            fi
            # `test` has one result for its whole matrix, so each OS's job is looked at, and so is
            # the Intel Mac's.
            case "$job" in
              test) jobs='(^|/ )Test \\(' ;;
              x86-mac) jobs='(^|/ )Native code on x86-64 macOS$' ;;
              *) jobs='' ;;
            esac
            if [ -n "$jobs" ] && [ "$result" != skipped ]; then
              looked_at=0
              # The one exception, on pull requests only: GitHub's macOS runners are short, and
              # a macOS job no runner ever took (cancelled, with no runner and no steps) is a
              # warning rather than a failure. A macOS job that ran and failed still fails, and
              # so does every other OS and every push to main. The fields are split on `|`,
              # since tabs would run together where the runner is empty.
              while IFS='|' read -r name conclusion runner steps; do
                looked_at=1
                [ "$conclusion" = success ] && continue
                if [ "$EVENT" = pull_request ] && [[ "$name" =~ (macos-latest\)|macOS)$ ]] \
                  && [ "$conclusion" = cancelled ] && [ -z "$runner" ] && [ "$steps" = 0 ]; then
                  echo "::warning::$name never got a runner, so it doesn't count; the push to main runs it again"
                  continue
                fi
                echo "$name finished with: $conclusion"
                failed=1
              done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
                --jq ".jobs[] | select(.name | test(\"$jobs\")) | [.name, (.conclusion // \"unfinished\"), (.runner_name // \"\"), (.steps | length | tostring)] | join(\"|\")")
              # Run through `staging.yml`, a job's name has that job's in front. If this ever found
              # no jobs at all, it can't say they passed.
              [ "$looked_at" = 1 ] || { echo "found no $job jobs to look at"; failed=1; }
              continue
            fi
            echo "$job finished with: $result"
            failed=1
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          exit "$failed"
