[package]
name = "fennec-interp"
description = "Fennec's tree-walking interpreter, the first engine for running Fennec programs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
crossbeam-deque = { workspace = true, optional = true }
fennec-parked = { workspace = true, optional = true }
mio = { workspace = true, optional = true }
fennec-blake3.workspace = true
fennec-re.workspace = true
fennec-syntax.workspace = true

# The playground runs in a browser, where there's no operating system to ask.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom.workspace = true
rustls.workspace = true
rustls-platform-verifier.workspace = true

[lints]
workspace = true

[features]
# Leaves the interpreter out of the runtime native code links, so anything still needing it is a
# compile or link error.
lean = []
# The checks native code running on several threads needs: blocks counted across threads,
# and each thread's queue of blocks to free. Programs with no tasks link a runtime without
# them, so they pay nothing (decisions.md: "Programs with no tasks compile the check away").
threads = ["dep:crossbeam-deque", "dep:fennec-parked", "dep:mio"]
# For AddressSanitizer runs only: a freed block is given back at once rather than kept for
# reuse, so ASan poisons it and holds it in quarantine, and native code that touches it fails.
sanitize = []

[dev-dependencies]
crossbeam-deque.workspace = true
fennec-parked.workspace = true
mio.workspace = true
