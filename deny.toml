[graph]
all-features = true

[advisories]
# No ignored advisories. Each entry added here says why it's safe and when it goes.
ignore = []

[licenses]
# Cranelift is Apache-2.0 with the LLVM exception, which only loosens Apache-2.0's terms.
# Zlib is as permissive as MIT, and so is ISC, which `ring` and `rustls-webpki` use.
allow = ["MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "Unicode-3.0", "Zlib", "ISC"]
confidence-threshold = 0.9
unused-allowed-license = "allow"

[licenses.private]
# Fennec's own crates aren't published, so their license is checked by review, not here.
ignore = true

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
# Cranelift's and corosensei's own dependencies pull in older copies of these. Remove each once
# they catch up.
skip = [
    { crate = "hashbrown@0.16.1", reason = "gimli, through cranelift-codegen" },
    { crate = "mach2@0.4.3", reason = "region, through cranelift-jit" },
    { crate = "windows-sys@0.52.0", reason = "region, through cranelift-jit" },
    { crate = "windows-sys@0.59.0", reason = "corosensei's Windows stacks, through fennec-parked" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
