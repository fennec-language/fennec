name: Suite report

# Probe, not for merging: CI's "Servers under ThreadSanitizer" command, five times, on scheduler-waiting.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Servers and the pool under ThreadSanitizer (probe)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NIGHTLY: nightly-2026-10-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: scheduler-waiting
      - run: rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - name: The servers' and the pool's tests, five times
        run: |
          for i in 1 2 3 4 5; do
            env TSAN_OPTIONS=halt_on_error=1:report_signal_unsafe=0 RUSTFLAGS=-Zsanitizer=thread \
              cargo "+$NIGHTLY" test --locked -Zbuild-std --target x86_64-unknown-linux-gnu \
              -p fennec-interp --features threads --lib -- embed::serve embed::parallel
          done
