[package]
name = "fennec-build"
description = "Fennec's build engine: content hashes of files and definitions, and what changed between runs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The tests are one binary, tests/main.rs, not one per file.
autotests = false

[[test]]
name = "build"
path = "tests/main.rs"

[build-dependencies]
fennec-blake3.workspace = true

[dependencies]
fennec-blake3.workspace = true
fennec-dist.workspace = true
fennec-rt.workspace = true
fennec-syntax.workspace = true

# How much space is free on the cache's disk, so its cap is never more than a tenth of it: rustix's
# safe `statvfs`, already here under the runtime and cap-std. The standard library can't say.
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
fennec-temp.workspace = true

[lints]
workspace = true
