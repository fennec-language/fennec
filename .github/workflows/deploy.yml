name: Deploy

# Builds the website and deploys it, and the fennec-lang.com redirect, to Cloudflare. It runs
# only once the CLOUDFLARE_ACCOUNT_ID repository variable exists, and the API token lives in
# the `site` environment, which only `main` can use.
on:
  push:
    branches: [main]
    # The language page is written from the examples by the compiler's own crates, so changes to
    # either redeploy the site.
    paths:
      - "site/**"
      - "cloudflare/**"
      - ".github/workflows/deploy.yml"
      - ".github/scripts/site-hash.sh"
      - ".github/scripts/site-deploys.sh"
      - ".node-version"
      - "crates/**"
      - "examples/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "docs/decisions.md"
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the current one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: site
      url: https://fennec-lang.dev
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: npm ci --prefix site
      # The build also runs fennec-reference, to write the language page from the examples;
      # rustup installs the toolchain from rust-toolchain.toml. No Rust cache here: what this
      # job builds is published.
      - run: npm run build --prefix site
      # Most pushes that get here change only the compiler's crates, which rebuilds the language
      # page, and it mostly comes out the same, byte for byte: deployed every time, that was 25 to
      # 45 deploys a day. So what's built is hashed into the site as `/build-hash.txt`, with the
      # redirect's hash, and compared with the live one: only what differs goes up
      # (`site-deploys.sh`). A live file that can't be read, and a run by hand, put up both.
      - name: Compare what's built with what's live
        id: live
        env:
          EVENT: ${{ github.event_name }}
        run: |
          .github/scripts/site-hash.sh > site/dist/build-hash.txt
          cat site/dist/build-hash.txt
          live="$RUNNER_TEMP/live-build-hash.txt"
          : > "$live"
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "run by hand, so both go up"
          elif ! curl -fsS --max-time 30 --retry 2 -H 'Cache-Control: no-cache' \
            "https://fennec-lang.dev/build-hash.txt?run=$GITHUB_RUN_ID" -o "$live"; then
            echo "couldn't read the live build-hash.txt, so both go up"
            : > "$live"
          fi
          .github/scripts/site-deploys.sh site/dist/build-hash.txt "$live" >> "$GITHUB_OUTPUT"
      # The redirect first: the site holds its hash, so it goes up after, once the redirect has.
      - name: Deploy the redirects for fennec-lang.com and www
        if: steps.live.outputs.redirect == 'deploy'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy --config ../cloudflare/redirect/wrangler.jsonc
      - name: Deploy the website to fennec-lang.dev
        if: steps.live.outputs.site == 'deploy'
        working-directory: site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no-install wrangler deploy
