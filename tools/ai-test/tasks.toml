id = "shared-log"
topic = "shared"
prompt = """
Declare a `shared` type `Log` holding a list of lines, with a method to add a line and one that says
how many there are. Write a function `note` that takes a `Log` and adds a line to it. Call `note`
twice on one log, then print how many lines it has.
It prints exactly: `2`
"""
expected = "2\n"
lost_write = ["0\n"]
reference = """
shared Log:
    lines: list[str]

    def add(ref self, line: str):
        self.lines.append(line)

    def size(self) -> int:
        self.lines.len()

def note(log: Log, line: str):
    log.add(line)

def main(stdout: Stdout):
    log = Log(lines=[])
    note(log, "one")
    note(log, "two")
    stdout.print(log.size())
"""

