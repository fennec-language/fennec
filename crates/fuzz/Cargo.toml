[package]
name = "fennec-fuzz"
description = "Fuzzing Fennec's front end, standard library parsers and native builds"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
fennec-blake3.workspace = true
fennec-build.workspace = true
fennec-check.workspace = true
fennec-fmt.workspace = true
fennec-rt = { workspace = true, features = ["made-up-inputs"] }
fennec-ir.workspace = true
fennec-kit.workspace = true
fennec-llvm.workspace = true
fennec-oracle.workspace = true
fennec-lint.workspace = true
fennec-parked.workspace = true
fennec-re.workspace = true
fennec-syntax.workspace = true
# Only to reset a test connection rather than close it, which std can't yet.
# `all` for `set_tcp_cork`, which a scripted server sends its last bytes and its close with.
socket2 = { workspace = true, features = ["all"] }

[lints]
workspace = true
