[package]
name = "fennec"
description = "The fennec command: run, test and start Fennec programs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The tests are one binary, tests/main.rs, not one per file.
autotests = false

[[test]]
name = "fennec"
path = "tests/main.rs"

[dependencies]
fennec-build.workspace = true
fennec-check.workspace = true
fennec-fmt.workspace = true
fennec-interp.workspace = true
fennec-jit.workspace = true
fennec-kit.workspace = true
fennec-syntax.workspace = true

[lints]
workspace = true
