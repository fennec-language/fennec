name: Fuzzing

# Every day, each target gets a new seed for a few minutes. Anything found is cut down, kept as
# an artifact and filed as an issue. Once it's fixed, its input goes in crates/fuzz/found/, which
# every test run replays. No pull request waits on this: a seed that finds something isn't the
# fault of whichever change happens to be running.
on:
  schedule:
    - cron: "43 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Every step runs in bash with `pipefail`, so a step that pipes what it runs through `tee` fails
# when what it ran does, and its "Keep what was found" and "File an issue" steps run. Without it
# the step took `tee`'s exit, and every failure found from 10-31 to 11-26 was dropped.
defaults:
  run:
    shell: bash

jobs:
  fuzz:
    name: Fuzz (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Optimized for speed, keeping the checks that catch a mistake in the arithmetic.
          - name: checked
            toolchain: ""
            flags: -C overflow-checks=on -C debug-assertions=on
            target: ""
            only: ""
          # AddressSanitizer needs a nightly compiler, and the standard library built for it.
          - name: AddressSanitizer
            toolchain: nightly
            flags: -Zsanitizer=address -C overflow-checks=on -C debug-assertions=on
            target: x86_64-unknown-linux-gnu
            only: ""
          # The targets built natively, which need `fennec`, its runtime library and LLVM's tools:
          # programs built through LLVM must print the same as a dev build and with `--release`,
          # the standard library's JSON, TOML and UTF-8 readers must never crash, and a program
          # edited a piece at a time must check and build, reusing what the build before kept, as
          # it does from nothing.
          - name: LLVM
            toolchain: ""
            flags: ""
            target: ""
            only: llvm json toml utf8 edits
          # The standard library's readers of outside input, built natively, each held to its
          # format's own rules: JSON, TOML, std.pack, CSV, URLs, the HTTP server and client,
          # Postgres's messages, the Router's paths and the values a page renders.
          - name: Readers
            toolchain: ""
            flags: ""
            target: ""
            only: json-rules toml-rules pack csv url http-server http-sessions http-splits http-audited http-client http-client-scripts http-client-splits postgres router html
          # Random, well-typed programs, each built as a dev build and with --release, which have to
          # print the same as each other and as a reference evaluator.
          - name: Programs
            toolchain: ""
            flags: ""
            target: ""
            only: programs
          # Tasks and a server's rounds that print and make way, wait with timeouts, take jobs
          # from one queue and run `parallel` calls cut short, each recorded on 1 and 4 threads
          # and replayed on 1, 4 and 16, which have to print what the recording printed. And a
          # program putting a new file in place of an old one, killed partway, or failed partway by
          # the runtime's fault hook, which has to leave the old file or the new one, never a torn
          # one.
          - name: Replay
            toolchain: ""
            flags: ""
            target: ""
            only: replay killed-writes fault-writes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the nightly compiler
        if: matrix.toolchain == 'nightly'
        run: |
          rustup toolchain install nightly --profile minimal --component rust-src
          echo "RUSTUP_TOOLCHAIN=nightly" >> "$GITHUB_ENV"
      - name: Install LLVM's tools
        if: matrix.only != ''
        run: rustup component add llvm-tools-preview
      - name: Build the fuzzer
        env:
          RUSTFLAGS: ${{ matrix.flags }}
          BUILD_FOR: ${{ matrix.target }}
          ONLY: ${{ matrix.only }}
        run: |
          if [ -n "$ONLY" ]; then
            cargo build --release --locked -p fennec -p fennec-runtime -p fennec-fuzz
            # The runtime with threads, beside `fennec` as a release has it, which a program
            # running `parallel`, like the HTTP server, is built with.
            cargo build --release --locked -p fennec-runtime --features threads --target-dir target/threads
            cp target/threads/release/libfennec_runtime.a target/release/libfennec_runtime_threads.a
            cp target/release/fennec-fuzz fennec-fuzz
            echo "FENNEC=$PWD/target/release/fennec" >> "$GITHUB_ENV"
            if [[ " $ONLY " == *" postgres "* ]]; then
              # The postgres reader reads std's private `PgReader`, which a program imports only
              # through `fennec-std-tests`, the test build's own command, built here beside `fennec`.
              cargo build --release --locked -p fennec --features std-private --bin fennec-std-tests
            fi
            if [[ " $ONLY " == *" http-audited "* ]]; then
              # The runtimes with the heap's audit in them, beside `fennec`, which `http-audited`'s
              # server is built with, under FENNEC_AUDIT=1, so its heap is audited as it ends.
              for features in audit threads,audit; do
                dir="target/${features//,/-}"
                cargo build --release --locked -p fennec-runtime --features "$features" --target-dir "$dir"
                cp "$dir/release/libfennec_runtime.a" "target/release/libfennec_runtime_${features//,/_}.a"
              done
            fi
            if [[ " $ONLY " == *" fault-writes "* ]]; then
              # A runtime that fails std.fs's work where FENNEC_FAULTS says, in a folder of its own
              # beside a copy of `fennec`, with no bitcode, so a --release build links it too.
              cargo build --release --locked -p fennec-runtime --features faults --target-dir target/faults
              cargo build --release --locked -p fennec-runtime --features threads,faults --target-dir target/threads-faults
              mkdir -p faulted
              cp target/release/fennec faulted/fennec
              cp target/faults/release/libfennec_runtime.a faulted/libfennec_runtime.a
              cp target/threads-faults/release/libfennec_runtime.a faulted/libfennec_runtime_threads.a
              echo "FENNEC_FAULTED=$PWD/faulted/fennec" >> "$GITHUB_ENV"
            fi
          elif [ -n "$BUILD_FOR" ]; then
            # The C in it (SQLite, mimalloc) is built by clang, so it's instrumented the way
            # rustc's LLVM instruments the Rust, for the LLVM sanitizer runtime it links. GCC
            # folds SQLite's two identical `aiOff` tables (FTS3's and FTS5's) into one, yet still
            # registers both with AddressSanitizer at that one address. The runtime took that for
            # an odr-violation and stopped the fuzzer before its first input, every night from
            # 11-08. Clang keeps the two apart.
            target=${BUILD_FOR//-/_}
            export "CC_$target=clang" "CXX_$target=clang++"
            cargo build --release --locked -p fennec-fuzz -Zbuild-std --target "$BUILD_FOR"
            cp "target/$BUILD_FOR/release/fennec-fuzz" fennec-fuzz
          else
            cargo build --release --locked -p fennec-fuzz
            cp target/release/fennec-fuzz fennec-fuzz
          fi
      - name: Fuzz every target
        id: fuzz
        env:
          ONLY: ${{ matrix.only }}
        # With no target named, every target runs. ONLY may name several, a word each.
        run: |
          read -ra names <<< "$ONLY"
          ./fennec-fuzz run --seed "$GITHUB_RUN_ID" --seconds 240 --found found "${names[@]}" | tee fuzz.txt
      - name: Keep what was found
        if: failure() && steps.fuzz.outcome == 'failure'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-found-${{ matrix.name }}
          retention-days: 7
          path: found
      - name: File an issue
        if: failure() && steps.fuzz.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          HOW: ${{ matrix.name }}
        run: |
          {
            echo "The daily fuzzing run ($HOW) found something: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo '```'
            grep -E 'failures|kept in|^  ' fuzz.txt
            echo '```'
            echo
            echo "The cut-down inputs are in the run's artifact, each with what it wrote to standard error beside it as \`<input>.stderr\`. Each one runs with \`fennec-fuzz one <target> <file>\`. Once it's fixed, add it to \`crates/fuzz/found/<target>/\`."
          } > issue.md
          gh issue create --title "Fuzzing found a failure ($HOW)" --body-file issue.md --label "area: tooling" --repo "$GITHUB_REPOSITORY"
