name: Rerun jobs that got no runner

# When a `CI macOS` run on main fails only because GitHub never gave some of its jobs a runner, its
# failed jobs run again, up to twice: GitHub's arm64 Macs run short, and on 2026-11-24 four runs
# went red that way, each after its job waited up to 40 minutes, until someone ran them again by
# hand. A run with any other failure is never run again (see `rerun-no-runner.sh`), and "CI passed"
# still says plainly which jobs never got a runner.
on:
  # Only a push to main's run, which checks out nothing from anyone else's branch.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: ["CI macOS"]
    types: [completed]

permissions:
  contents: read

jobs:
  rerun:
    name: Rerun jobs that never got a runner
    if: >-
      github.event.workflow_run.conclusion == 'failure'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # The run's jobs, their checks' notes, which say when GitHub had no runner for one, and
    # running the failed ones again.
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: Run them again if no runner is all that failed
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
        run: .github/scripts/rerun-no-runner.sh
