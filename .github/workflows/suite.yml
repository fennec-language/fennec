name: Suite report

# Probe, not for merging: the servers' and the pool's tests under ThreadSanitizer, on scheduler-servers.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Servers under ThreadSanitizer (probe)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      NIGHTLY: nightly-2026-10-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: scheduler-servers
      - name: Install the nightly compiler the sanitizers need
        run: rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - name: Run the servers' and the pool's tests
        run: |
          env TSAN_OPTIONS=halt_on_error=1:report_signal_unsafe=0 RUSTFLAGS=-Zsanitizer=thread \
            cargo "+$NIGHTLY" test --locked -Zbuild-std --target x86_64-unknown-linux-gnu \
            -p fennec-interp --features threads -- embed::serve embed::parallel
      - name: The same, five times over, for races that show only sometimes
        run: |
          for i in 1 2 3 4 5; do
            env TSAN_OPTIONS=halt_on_error=1:report_signal_unsafe=0 RUSTFLAGS=-Zsanitizer=thread \
              cargo "+$NIGHTLY" test -q --locked -Zbuild-std --target x86_64-unknown-linux-gnu \
              -p fennec-interp --features threads -- embed::serve embed::parallel 2>&1 | grep -E "test result|ThreadSanitizer|FAILED"
          done
