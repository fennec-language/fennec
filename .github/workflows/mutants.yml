name: Mutation tests

# cargo-mutants changes the code in small ways (flipping a comparison, returning a default,
# deleting a statement) and checks that some test fails each time. A change no test notices
# is a gap in the tests. Pull requests check only the code they change; every week, and on
# demand, the whole compiler is checked across shards.
on:
  pull_request:
    # A draft is skipped, so it runs once the pull request is ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["crates/**", "examples/**", "Cargo.*", ".github/workflows/mutants.yml"]
  schedule:
    - cron: "17 6 * * 3"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels its older run. Anything else, like a push to
# main or a merge group, gets a group of its own: a group keeps only its newest waiting run, so
# sharing one would drop some.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Tests check this to sample their slowest corpora: every mutant runs every test.
  FENNEC_UNDER_MUTANTS: "1"
  # LLVM is the main backend, so a mutant in it has to meet its tests: a missing tool or runtime
  # library fails them instead of skipping them.
  FENNEC_EXPECT_LLVM: "1"

jobs:
  changed-code:
    name: Mutate the changed code
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # At most three at once, so it can't take the runners required checks are waiting for. The rest
    # wait, holding no runner, and none is dropped. Which of the three a pull request waits for goes
    # by the last digit of its number. A newer push still cancels its older run, waiting or not.
    concurrency:
      group: mutants-changed-code-${{ (endsWith(github.event.pull_request.number, '0') || endsWith(github.event.pull_request.number, '3') || endsWith(github.event.pull_request.number, '6') || endsWith(github.event.pull_request.number, '9')) && 'a' || (endsWith(github.event.pull_request.number, '1') || endsWith(github.event.pull_request.number, '4') || endsWith(github.event.pull_request.number, '7')) && 'b' || 'c' }}
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-mutants@27.1.0
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Diff against the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff "$BASE" -- crates > changes.diff
      - name: Mutate
        run: |
          status=0
          # Each mutant runs the whole workspace's tests, which take about two and a half minutes
          # here with FENNEC_UNDER_MUTANTS set and two running at once. A timeout counts as caught,
          # so it has to mean a hang, not a slow run: the limit is well past what a run takes, and
          # the same limit lets the baseline finish. Lower it only with those times in hand.
          cargo mutants --in-diff changes.diff --no-shuffle --timeout 420 --jobs 2 || status=$?
          # 3 means some mutations made the tests hang, which still counts as noticing them.
          # It wins over 2 (missed), so check for misses separately.
          if [ "$status" -eq 3 ] && [ ! -s mutants.out/missed.txt ]; then status=0; fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-changed-code
          path: mutants.out
          retention-days: 14

  everything:
    name: Mutate everything (shard ${{ matrix.shard }} of 8)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # The same cap as on pull requests: a shard that waits is only later.
      max-parallel: 3
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@3a3daafd3b7f23b8f65d9f5ba2db203fb59b79e2 # v2.90.2
        with:
          tool: cargo-mutants@27.1.0
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Mutate
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          status=0
          cargo mutants --shard "$SHARD/8" --baseline=skip --timeout 420 --jobs 2 || status=$?
          # As above: hangs count as noticed, misses don't.
          if [ "$status" -eq 3 ] && [ ! -s mutants.out/missed.txt ]; then status=0; fi
          exit "$status"
      - name: List what the tests missed on the run's summary page
        if: always()
        run: |
          {
            echo "## Mutations no test caught (shard ${{ matrix.shard }})"
            echo '```'
            cat mutants.out/missed.txt 2>/dev/null || echo "none"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-shard-${{ matrix.shard }}
          path: mutants.out
          retention-days: 14
