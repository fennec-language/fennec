[package]
name = "fennec"
description = "The fennec command: run, test and start Fennec programs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# `cargo run -p fennec` runs `fennec`, not `fennec-std-tests`, the test build's own command.
default-run = "fennec"
# The tests are one binary, tests/main.rs, not one per file.
autotests = false

[[test]]
name = "fennec"
path = "tests/main.rs"

# `fennec-std-tests`, the command a program can import std's private names through, to test them,
# is built only with `std-private`, which only this package's own tests turn on, through the
# dev-dependency on itself below. `fennec` can't import them in any build.
[features]
std-private = []

[[bin]]
name = "fennec-std-tests"
path = "src/bin/fennec-std-tests.rs"
required-features = ["std-private"]

[dependencies]
mimalloc.workspace = true
fennec-blake3.workspace = true
fennec-build.workspace = true
fennec-daemon.workspace = true
fennec-check.workspace = true
fennec-deps.workspace = true
fennec-dist.workspace = true
fennec-count.workspace = true
fennec-fmt.workspace = true
fennec-rt.workspace = true
fennec-ir.workspace = true
fennec-llvm.workspace = true
fennec-kit.workspace = true
fennec-lint.workspace = true
fennec-reference.workspace = true
fennec-lsp.workspace = true
fennec-syntax.workspace = true

[target.'cfg(windows)'.dependencies]
# Lets Ctrl-C go by while `fennec run`'s program stops, as the program sees it too.
ctrlc.workspace = true

# The build daemon puts a file in standard output's and error's place while it runs a build, to send
# what the build printed back to the command that asked for it (see the workspace's `rustix`).
[target.'cfg(unix)'.dependencies]
rustix.workspace = true

[dev-dependencies]
fennec = { path = ".", features = ["std-private"] }
fennec-loader.workspace = true
fennec-temp.workspace = true
socket2.workspace = true

[lints]
workspace = true

[build-dependencies]
fennec-blake3.workspace = true
