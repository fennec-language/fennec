[package]
name = "fennec-check"
description = "Fennec's type checker: finds mistakes before a program runs, and works out every function's signature"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The tests are one binary, tests/main.rs, not one per file.
autotests = false

[[test]]
name = "check"
path = "tests/main.rs"

[dependencies]
fennec-re.workspace = true
fennec-syntax.workspace = true

[lints]
workspace = true
