name: Dependency review

# Blocks pull requests that add dependencies with known vulnerabilities or disallowed licenses.
on: pull_request

permissions:
  contents: read

jobs:
  review:
    name: Review new dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          allow-licenses: MIT, Apache-2.0, Apache-2.0 WITH LLVM-exception, Zlib, BSD-2-Clause, BSD-3-Clause, ISC, 0BSD, Unicode-3.0, CC0-1.0, BlueOak-1.0.0, MPL-2.0, Python-2.0, CC-BY-4.0
