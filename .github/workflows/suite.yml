name: Suite report

# Every kernel built by `fennec build --llvm --release` beside its overflow-checked Rust twin:
# counted with Valgrind on x86 and timed on x86 and Arm, best of ten runs that take turns with
# the twin, with the median beside it, after each push to main and on demand.
# One table goes on the run's summary page, and each push's numbers join `history.jsonl` on the
# `bench-history` branch, so trends show. Nothing waits on this, and being slow never fails it:
# only a kernel that prints something other than its twin does.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: suite-report
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: Measure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build cache: the cache action's license isn't one dependency review allows for new
      # uses, and nothing waits on this job.
      - run: rustup component add llvm-tools-preview
      # The runner's virtual CPU hides the counters perf reads, so Valgrind counts by simulating.
      - name: Install Valgrind
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
      - name: Build fennec, its runtime library and the suite
        run: cargo build --release --locked -p fennec -p fennec-runtime -p fennec-bench
      - name: Measure every kernel against its twin
        env:
          OS: ${{ matrix.os }}
        run: ./target/release/fennec-bench llvm-suite --runs 10 --json "suite-$OS.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: suite-${{ matrix.os }}
          path: suite-*.json
          if-no-files-found: ignore

  report:
    name: Report and keep the history
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: suite-*
          path: runs
          merge-multiple: true
      - name: One table for both machines
        run: |
          python3 - runs/*.json <<'TABLE' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          runs = [json.load(open(path)) for path in sys.argv[1:]]
          if not runs:
              print("## Suite report\n\nNo machine finished measuring.")
              sys.exit()
          shown = lambda value: "-" if value is None else f"{value:.0f}"
          header = ["kernel"]
          for run in runs:
              platform = run["platform"]
              header += [f"instructions % ({platform})", f"best time % ({platform})", f"median % ({platform})"]
          print("## Suite report: LLVM against Rust\n")
          print("| " + " | ".join(header + ["notes"]) + " |")
          print("|---" + "|---:" * (len(header) - 1) + "|---|")
          names = sorted({kernel["name"] for run in runs for kernel in run["kernels"]})
          for name in names:
              cells, notes = [name], []
              for run in runs:
                  kernel = next((k for k in run["kernels"] if k["name"] == name), {})
                  cells += [shown(kernel.get(key)) for key in ("instructions", "time", "median")]
                  if kernel.get("problem"):
                      notes.append(f"{run['platform']}: {kernel['problem']}")
                  elif kernel.get("noisy"):
                      notes.append(f"noisy on {run['platform']}")
              print("| " + " | ".join(cells + ["; ".join(notes).replace("|", "\\|")]) + " |")
          print()
          for run in runs:
              print(f"- {run['platform']}: geometric mean {shown(run['instructions'])}% by instructions, "
                    f"{shown(run['time'])}% by best time, {shown(run.get('median'))}% by median time; "
                    f"slowest {run['slowest'] or '-'}")
          print("\nEach is the overflow-checked Rust twin's count or time over LLVM's: 100 matches Rust, higher is faster. "
                "Each side runs ten times, taking turns, and its best and median runs are shown.")
          TABLE
      # Only main's own runs join the history, one line per machine.
      - name: Add the run to the history
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          runs=(runs/*.json)
          [ "${#runs[@]}" -gt 0 ] || exit 0
          git init -q history
          cd history
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin bench-history; then
            git checkout -q -b bench-history FETCH_HEAD
          else
            git checkout -q --orphan bench-history
          fi
          date=$(date -u +%Y-%m-%dT%H:%MZ)
          for run in "${runs[@]}"; do
            jq -c --arg date "$date" --arg commit "$SHA" '. + {date: $date, commit: $commit}' "../$run" >> history.jsonl
          done
          git add history.jsonl
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Suite report for ${SHA:0:10}"
          git push -q origin bench-history
