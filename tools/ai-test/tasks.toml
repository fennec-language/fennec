# The tasks the AI test gives a model. Each one asks for a whole program, says exactly what it
# prints, and has a reference answer that `run.py --check-tasks` proves still passes.
#
# `lost_write` lists outputs that mean a change was made to a copy and never reached what it
# was meant to change. Those count apart from other wrong answers.

[[task]]
id = "table-add-get"
topic = "tables"
prompt = """
Declare `struct Unit` with `name: str` and `hp: int`. Make a `Table` of units, add Ana with hp 50
and Bo with hp 70, keep the `Id` you get for Bo, and use it to print Bo's name and hp.
It prints exactly: `Bo 70`
"""
expected = "Bo 70\n"
reference = """
from std.collections import Table

struct Unit:
    name: str
    hp: int

def main(stdout: Stdout):
    mut units = Table[Unit]()
    units.add(Unit(name="Ana", hp=50))
    bo = units.add(Unit(name="Bo", hp=70))
    stdout.print(units[bo].name, units[bo].hp)
"""

