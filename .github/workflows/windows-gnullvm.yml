name: Windows gnullvm probe
on:
  push:
    branches: ["spike/windows-gnullvm"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: llvm-mingw, as Rust's own CI takes it
        shell: bash
        run: |
          name=llvm-mingw-20251104-ucrt-x86_64
          curl -sSfL -o "$RUNNER_TEMP/m.zip" "https://github.com/mstorsjo/llvm-mingw/releases/download/20251104/$name.zip"
          7z x -y -o"$RUNNER_TEMP" "$RUNNER_TEMP/m.zip" > /dev/null
          root="$RUNNER_TEMP/$name"
          ls "$root"
          cygpath -w "$root/bin" >> "$GITHUB_PATH"
          echo "LLVM_MINGW=$(cygpath -w "$root")" >> "$GITHUB_ENV"
      - run: rustup set default-host x86_64-pc-windows-gnullvm
      - run: rustup component add llvm-tools-preview
      - run: rustc -vV
      - run: cargo build --locked -p fennec -p fennec-runtime
      - name: The runtime with threads
        shell: bash
        run: |
          cargo build --locked -p fennec-runtime --features threads --target-dir target/threads
          cp target/threads/debug/libfennec_runtime.a target/debug/libfennec_runtime_threads.a
      - name: What ships, and what it takes
        shell: bash
        run: |
          set +e +o pipefail
          ls -l target/debug/*.a
          root="$(cygpath -u "$LLVM_MINGW")"
          ship="$RUNNER_TEMP/ship"
          mkdir -p "$ship/lib/self-contained"
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel-x86_64-pc-windows-msvc" --profile minimal --component llvm-tools-preview --no-self-update --force-non-host
          msvc="$(rustup show home)/toolchains/$channel-x86_64-pc-windows-msvc/lib/rustlib/x86_64-pc-windows-msvc/bin"
          mkdir -p "$ship/bin"; cp "$msvc"/{opt,llc,llvm-link,llvm-ar,rust-lld}.exe "$ship/bin/"
          libs="$root/x86_64-w64-mingw32/lib"
          ls "$libs" | wc -l; ls -l "$libs/crt2.o" "$libs/libunwind.a" "$libs/libucrt.a" "$libs/libmingw32.a" "$libs/libmingwex.a" "$libs/libpthread.a" "$libs/libwinpthread.a"
          ls "$root"/lib/clang/*/lib/windows/ | grep -i x86_64 | head
          for name in crt2.o libunwind.a libmingw32.a libmingwex.a libucrt.a libucrtbase.a libpthread.a libwinpthread.a libkernel32.a libntdll.a libuserenv.a libws2_32.a libdbghelp.a libbcrypt.a libadvapi32.a libsynchronization.a libuser32.a libmoldname.a libapi-ms-win-core-synch-l1-2-0.a; do cp "$libs/$name" "$ship/lib/self-contained/" 2>/dev/null || echo "no $name"; done
          cp "$root"/lib/clang/*/lib/windows/libclang_rt.builtins-x86_64.a "$ship/lib/self-contained/"
          du -sh "$ship/lib/self-contained"
          7z a "$RUNNER_TEMP/libs.zip" "$ship/lib" > /dev/null; ls -l "$RUNNER_TEMP/libs.zip"
          7z a "$RUNNER_TEMP/all.zip" "$ship" > /dev/null; ls -l "$RUNNER_TEMP/all.zip"
          cp "$root/LICENSE.TXT" "$RUNNER_TEMP/" 2>/dev/null; ls "$root"; head -c 1500 "$root/LICENSE.TXT"; echo
          echo "FENNEC_LLVM_BIN=$(cygpath -w "$ship/bin")" >> "$GITHUB_ENV"
      - name: Try the examples, with no other compiler in reach
        shell: bash
        run: |
          set +e +o pipefail
          export PATH="$(printf '%s' "$PATH" | tr ':' '\n' | grep -viE 'cargo|rustup|mingw|visual studio' | paste -sd: -)"
          which gcc clang link.exe 2>&1 | head -3
          fennec="$PWD/target/debug/fennec.exe"
          export FENNEC_PROBE_LINK="-Map=$RUNNER_TEMP/map.txt"
          "$fennec" build --llvm examples/hello.fen -o "$RUNNER_TEMP/one.exe" 2>&1 | head -30
          "$RUNNER_TEMP/one.exe"
          echo "--- objects from libraries"; grep -E '\.o:\(\.text' "$RUNNER_TEMP/map.txt" | grep -v rcgu | awk '{print $NF}' | sed 's/:.*//' | sort -u | cut -c1-90 | head -80
          unset FENNEC_PROBE_LINK
          echo "--- dlls"; "$FENNEC_LLVM_BIN/../bin/llvm-ar.exe" --version | head -1
          built=0; right=0; total=0
          for program in examples/*.fen; do
            want="${program%.fen}.out"; [ -f "$want" ] || continue
            total=$((total+1))
            out="$RUNNER_TEMP/$(basename "$program" .fen).exe"
            if "$fennec" build --llvm "$program" -o "$out" > "$RUNNER_TEMP/said" 2>&1; then
              built=$((built+1))
              if "$out" 2>&1 | diff --strip-trailing-cr -q - "$want" > /dev/null; then right=$((right+1)); else echo "wrong: $program"; fi
            else
              grep -q "rust-lld\|linking failed" "$RUNNER_TEMP/said" && { echo "link failure: $program"; head -5 "$RUNNER_TEMP/said" | cut -c1-140; }
            fi
          done
          echo "built $built of $total, printed the right thing $right"
          echo "--- threads"; FENNEC_THREADS_RUNTIME=1 "$fennec" build --llvm examples/parallel_loops.fen -o "$RUNNER_TEMP/threads.exe" 2>&1 | tail -2; "$RUNNER_TEMP/threads.exe" | diff --strip-trailing-cr - examples/parallel_loops.out && echo same
          echo "--- size"; ls -l "$RUNNER_TEMP/one.exe"
          exit 0
      - name: The test suite on this target
        run: cargo test --locked -p fennec --test fennec "llvm::"
        continue-on-error: true
        env:
          FENNEC_EXPECT_LLVM: "1"
