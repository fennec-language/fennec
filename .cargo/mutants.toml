# Configuration for cargo-mutants (https://mutants.rs), run by .github/workflows/mutants.yml.

# The compiler's tests live in the `fennec` crate (tests/examples.rs runs every example), so a
# mutation in `fennec-syntax` or `fennec-interp` has to be checked against the whole
# workspace's tests, not only the tests of the crate it is in.
test_workspace = true

