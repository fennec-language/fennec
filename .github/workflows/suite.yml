name: Suite report

# Every kernel built by `fennec build --llvm --release` beside its overflow-checked Rust twin:
# counted with Valgrind on x86 and timed on x86 and Arm, best of ten runs that take turns with
# the twin, with the median beside it, after each push to main and on demand. Its Go and Java
# twins are timed against it the same way, to show where Fennec stands against them.
# One table goes on the run's summary page, and each push's numbers join `history.jsonl` on the
# `bench-history` branch, so trends show. Nothing waits on this, and being slow never fails it:
# only a kernel that prints something other than its twin does.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Main's runs take turns, since each adds to the history. A group keeps only its newest
# waiting run, so a dispatched run, which adds nothing to the history, gets a group of its own
# and is never dropped for one of main's.
concurrency:
  group: suite-${{ github.event_name == 'workflow_dispatch' && github.run_id || 'report' }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  measure:
    name: Measure (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No build cache: the cache action's license isn't one dependency review allows for new
      # uses, and nothing waits on this job.
      - run: rustup component add llvm-tools-preview
      # Go's and Java's twins are built the way anyone would build them, with each language's own
      # toolchain at a fixed version, so a change in their numbers is a change in Fennec.
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
          cache: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "25"
      # The runner's virtual CPU hides the counters perf reads, so Valgrind counts by simulating.
      - name: Install Valgrind
        if: runner.os == 'Linux'
        run: |
          .github/scripts/apt.sh valgrind
      - name: Build fennec, its runtime library and the suite
        run: cargo build --release --locked -p fennec -p fennec-runtime -p fennec-bench
      # A release build puts what it uses of the runtime in the program's own unit, from this.
      - name: Build the runtime's bitcode
        run: |
          cargo rustc --release --locked -p fennec-runtime --crate-type staticlib -- --emit=llvm-bc,link -C lto=fat -C codegen-units=1
          cp "$(find target/release/deps -name 'fennec_runtime-*.bc' -print -quit)" target/release/libfennec_runtime.bc
      # The runtime with threads, for `parallel`, on its own so the others don't get `threads` too.
      - name: Build the runtime with threads, and its bitcode
        run: |
          cargo rustc --release --locked -p fennec-runtime --features threads --target-dir target/threads --crate-type staticlib -- --emit=llvm-bc,link -C lto=fat -C codegen-units=1
          cp target/threads/release/libfennec_runtime.a target/release/libfennec_runtime_threads.a
          cp "$(find target/threads/release/deps -name 'fennec_runtime-*.bc' -print -quit)" target/release/libfennec_runtime_threads.bc
      - name: Measure every kernel against its twin
        env:
          OS: ${{ matrix.os }}
        run: ./target/release/fennec-bench llvm-suite --runs 10 --json "suite-$OS.json"
      - name: Measure parallel against rayon
        env:
          OS: ${{ matrix.os }}
        run: ./target/release/fennec-bench parallel --runs 10 --markdown "suite-parallel-$OS.md"
      - name: Measure real programs against Rust with crates
        env:
          OS: ${{ matrix.os }}
        run: ./target/release/fennec-bench realworld --runs 10 --markdown "suite-realworld-$OS.md"
      - name: Measure a server under load against Rust and Go
        env:
          OS: ${{ matrix.os }}
        run: ./target/release/fennec-bench server --runs 5 --markdown "suite-server-$OS.md"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: suite-${{ matrix.os }}
          path: |
            suite-*.json
            suite-parallel-*.md
            suite-realworld-*.md
            suite-server-*.md
          if-no-files-found: ignore

  report:
    name: Report and keep the history
    needs: measure
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: suite-*
          path: runs
          merge-multiple: true
      - name: One table for both machines
        run: |
          python3 - runs/*.json <<'TABLE' >> "$GITHUB_STEP_SUMMARY"
          import json, sys
          runs = [json.load(open(path)) for path in sys.argv[1:]]
          if not runs:
              print("## Suite report\n\nNo machine finished measuring.")
              sys.exit()
          shown = lambda value: "-" if value is None else f"{value:.0f}"
          def short(count):
              return f"{count / 1e6:.1f}M" if count >= 1e6 else f"{count / 1e3:.1f}k" if count >= 1e3 else f"{count:.0f}"
          def missed(kernel, kind):
              misses = kernel.get("misses") or {}
              ours, rust = misses.get("fennec"), misses.get("rust")
              return f"{short(ours[kind])} / {short(rust[kind])}" if ours and rust else "-"
          # A machine that can't count instructions, like a hosted Mac, gets no column for them.
          keys = {run["platform"]: [key for key in ("instructions", "time", "kernel", "median")
                                    if key != "instructions" or any(k.get(key) is not None for k in run["kernels"])]
                  for run in runs}
          # Cache misses show only for a machine that simulated them, beside its instructions.
          for run in runs:
              if any(k.get("misses") for k in run["kernels"]):
                  keys[run["platform"]][1:1] = ["d1", "ll"]
          # Go's and Java's columns show only for a machine that measured them.
          for run in runs:
              keys[run["platform"]] += [key for key in ("dev", "release_build_ms", "dev_build_ms", "go_kernel", "go", "java_kernel", "java")
                                        if any(k.get(key) is not None for k in run["kernels"])]
          label = {"instructions": "instructions %", "time": "best time %", "median": "median %",
                   "d1": "D1 misses, ours / Rust's", "ll": "LL misses, ours / Rust's",
                   "dev": "dev best time %", "release_build_ms": "release build ms", "dev_build_ms": "dev build ms",
                   "kernel": "kernel time %", "go_kernel": "Go kernel time %", "go": "Go whole run %",
                   "java_kernel": "Java kernel time %", "java": "Java whole run %"}
          header = ["kernel"]
          for run in runs:
              header += [f"{label[key]} ({run['platform']})" for key in keys[run["platform"]]]
          print("## Suite report: LLVM against Rust, Go and Java\n")
          print("| " + " | ".join(header + ["notes"]) + " |")
          print("|---" + "|---:" * (len(header) - 1) + "|---|")
          names = sorted({kernel["name"] for run in runs for kernel in run["kernels"]})
          for name in names:
              cells, notes = [name], []
              for run in runs:
                  kernel = next((k for k in run["kernels"] if k["name"] == name), {})
                  cells += [missed(kernel, key) if key in ("d1", "ll") else shown(kernel.get(key))
                            for key in keys[run["platform"]]]
                  if kernel.get("problem"):
                      notes.append(f"{run['platform']}: {kernel['problem']}")
                  elif kernel.get("noisy"):
                      notes.append(f"noisy on {run['platform']}")
                  for key, language in (("go", "Go"), ("java", "Java")):
                      if kernel.get(f"{key}_problem"):
                          notes.append(f"{run['platform']} {language}: {kernel[f'{key}_problem']}")
              print("| " + " | ".join(cells + ["; ".join(notes).replace("|", "\\|")]) + " |")
          print()
          for run in runs:
              counted = f"{shown(run['instructions'])}% by instructions, " if run["instructions"] is not None else ""
              others = "".join(f"; against {language} {shown(run.get(key + '_kernel'))}% by kernel time, "
                               f"{shown(run[key])}% by whole run"
                               for key, language in (("go", "Go"), ("java", "Java")) if run.get(key) is not None)
              names = {"fennec": "Fennec", "rust": "Rust", "go": "Go", "java": "Java"}
              startup = ", ".join(f"{names.get(key, key)} {value:.1f} ms"
                                  for key, value in (run.get("startup_ms") or {}).items() if value is not None)
              if startup:
                  others += f"; startup {startup}"
              print(f"- {run['platform']}, {run['cpu']} with {run['cores']:.0f} cores: geometric mean {counted}{shown(run['time'])}% by best time, "
                    f"{shown(run.get('median'))}% by median time, dev build {shown(run.get('dev'))}%{others}; slowest {run['slowest'] or '-'}")
          print("\nEach is the overflow-checked Rust twin's count or time over LLVM's: 100 matches Rust, higher is faster. "
                "Each side runs ten times, taking turns, and its best and median runs are shown. "
                "Noisy means a median run was more than 5% slower than the best. "
                "D1 and LL misses are counts for each side, from cachegrind simulating fixed caches (32 KiB first level, 8 MiB last level, 64-byte lines). "
                "Dev is `fennec build --llvm` without `--release`, cached a function at a time; each build's time is from an empty Fennec home. "
                "The Go and Java columns are each twin's best time over LLVM's, the same way. "
                "Whole run is each program from start to exit; Java's whole runs include the JVM starting and its JIT warming up. "
                "Kernel time is what each program measured itself with a monotonic clock when run with --time, from the start of its work to its last line; "
                "Java's is its second run, after one to warm its JIT up. Startup is each language's hello-world's best run.")
          TABLE
      - name: Parallel against rayon and real programs against Rust with crates, for each machine
        run: |
          shopt -s nullglob
          for section in runs/suite-parallel-*.md runs/suite-realworld-*.md runs/suite-server-*.md; do
            cat "$section" >> "$GITHUB_STEP_SUMMARY"
            echo >> "$GITHUB_STEP_SUMMARY"
          done
      # Only main's own runs join the history, one line per machine.
      - name: Add the run to the history
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          runs=(runs/*.json)
          [ "${#runs[@]}" -gt 0 ] || exit 0
          git init -q history
          cd history
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin bench-history; then
            git checkout -q -b bench-history FETCH_HEAD
          else
            git checkout -q --orphan bench-history
          fi
          date=$(date -u +%Y-%m-%dT%H:%MZ)
          for run in "${runs[@]}"; do
            jq -c --arg date "$date" --arg commit "$SHA" '. + {date: $date, commit: $commit}' "../$run" >> history.jsonl
          done
          git add history.jsonl
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -q -m "Suite report for ${SHA:0:10}"
          git push -q origin bench-history
