[package]
name = "fennec-wasm"
description = "Fennec's interpreter for the browser playground, as a WebAssembly module"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# cdylib is the .wasm module; rlib lets the tests call it natively.
crate-type = ["cdylib", "rlib"]

[dependencies]
fennec-check.workspace = true
fennec-interp.workspace = true
fennec-syntax.workspace = true

# The workspace's lints, except `unsafe_code`, which is "deny" rather than "forbid": exporting a
# function by name takes `#[unsafe(no_mangle)]`, and nothing else here is unsafe. Keep this table
# in step with `[workspace.lints]`.
[lints.rust]
unsafe_code = "deny"
non_ascii_idents = "forbid"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
unreachable_pub = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unwrap_in_result = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
exit = "forbid"
mod_module_files = "forbid"
allow_attributes = "forbid"
allow_attributes_without_reason = "deny"
mem_forget = "forbid"
print_stdout = "deny"
print_stderr = "deny"
