# The tasks the AI test gives a model. Each one asks for a whole program, says exactly what it
# prints, and has a reference answer, `answers/<id>.fen`, that `run.py --check-tasks` proves still
# passes. A test of Fennec's checks each answer against the language as it is now.
#
# `lost_write` lists outputs that mean a change was made to a copy and never reached what it
# was meant to change. Those count apart from other wrong answers.

[[task]]
id = "table-add-get"
topic = "tables"
prompt = """
Declare `struct Unit` with `name: str` and `hp: int`. Make a `Table` of units, add Ana with hp 50
and Bo with hp 70, keep the `Id` you get for Bo, and use it to print Bo's name and hp.
It prints exactly: `Bo 70`
"""
expected = "Bo 70\n"

[[task]]
id = "table-damage"
topic = "tables"
prompt = """
Declare `struct Unit` with `hp: int`. Add three units to a `Table`, with hp 30, 40 and 50, keeping
each one's `Id`. Lower the second unit's hp by 15 through its `Id`, then print the three hps in the
order they were added, on one line.
It prints exactly: `30 25 50`
"""
expected = "30 25 50\n"
lost_write = ["30 40 50\n"]

