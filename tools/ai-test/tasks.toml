[[task]]
id = "optional-best"
topic = "optionals"
prompt = """
Write a function `strongest` that takes a list of ints and gives back the largest, or nothing for an
empty list. Print its answer for `[4, 9, 2]`, and for an empty list print `none`.
It prints exactly: `9 none`
"""
expected = "9 none\n"
reference = """
def strongest(items: list[int]) -> int?:
    mut best: int? = None
    for item in items:
        if best is None or item > best:
            best = item
    best

def main(stdout: Stdout):
    empty: list[int] = []
    shown = strongest(empty)
    stdout.print(strongest([4, 9, 2]) else 0, "none" if shown is None else "some")
"""

[[task]]
id = "error-cases"
topic = "errors"
prompt = """
Declare an error `SellError` with two cases, `NotFound(item: str)` and `OutOfStock(item: str)`. Write
a function `sell` that takes a dict of stock counts and an item, fails with `NotFound` when the item
isn't there and `OutOfStock` when its count is 0, and otherwise gives back the count left after
selling one. For `{"apple": 1, "pear": 0}`, print what happens selling apple, pear and fig, one per
line: the count left, or `missing fig` / `none of pear`.
It prints three lines, exactly:
`0`
`none of pear`
`missing fig`
"""
expected = "0\nnone of pear\nmissing fig\n"
reference = """
error SellError:
    NotFound(item: str)
    OutOfStock(item: str)

def sell(stock: dict[str, int], item: str) -> int fails SellError:
    count = stock.get(item) else fail .NotFound(item)
    if count == 0:
        fail .OutOfStock(item)
    count - 1

def main(stdout: Stdout):
    stock = {"apple": 1, "pear": 0}
    for item in ["apple", "pear", "fig"]:
        match sell(stock, item):
            case Ok(left): stdout.print(left)
            case Err(NotFound(name)): stdout.print("missing", name)
            case Err(OutOfStock(name)): stdout.print("none of", name)
"""

[[task]]
id = "error-pass-up"
topic = "errors"
prompt = """
Declare `error BadAge` with `text: str`. Write a function `parse_age` that turns text into an int,
failing with `BadAge` if the text isn't a whole number. Write a function `next_age` that calls
`parse_age`, passes any failure up, and gives back the age plus one. Print `next_age("41")`, then
for `next_age("old")` print `bad old`.
It prints two lines, exactly:
`42`
`bad old`
"""
expected = "42\nbad old\n"
reference = """
error BadAge:
    text: str

def parse_age(text: str) -> int fails BadAge:
    int(text) else fail BadAge(text=text)

def next_age(text: str) -> int fails BadAge:
    parse_age(text)? + 1

def main(stdout: Stdout):
    for text in ["41", "old"]:
        match next_age(text):
            case Ok(age): stdout.print(age)
            case Err(error): stdout.print("bad", error.text)
"""

[[task]]
id = "error-in-loop"
topic = "errors"
prompt = """
Declare `error TooBig` with `value: int`. Write a function `total` that adds up a list of ints but
fails with `TooBig` on the first item over 100. Print its answer for `[1, 2, 3]`, then for
`[5, 500, 7]` print `too big 500`.
It prints two lines, exactly:
`6`
`too big 500`
"""
expected = "6\ntoo big 500\n"
reference = """
error TooBig:
    value: int

def total(items: list[int]) -> int fails TooBig:
    mut sum = 0
    for item in items:
        if item > 100:
            fail TooBig(value=item)
        sum += item
    sum

def main(stdout: Stdout):
    for items in [[1, 2, 3], [5, 500, 7]]:
        match total(items):
            case Ok(sum): stdout.print(sum)
            case Err(error): stdout.print("too big", error.value)
"""

