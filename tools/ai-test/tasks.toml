[[task]]
id = "shared-transfer"
topic = "shared"
prompt = """
Declare a `shared` type `Account` with a `total`. Write a function `transfer` that moves an amount
from one account to another, holding both at once so nothing else sees a half-done move. Move 30
from an account holding 100 to one holding 0, and print both totals.
It prints exactly: `70 30`
"""
expected = "70 30\n"
lost_write = ["100 0\n"]
reference = """
shared Account:
    total = 0

    def balance(self) -> int:
        self.total

def transfer(source: Account, target: Account, amount: int):
    with source, target as ref giving, ref getting:
        giving.total -= amount
        getting.total += amount

def main(stdout: Stdout):
    savings = Account(total=100)
    checking = Account()
    transfer(savings, checking, 30)
    stdout.print(savings.balance(), checking.balance())
"""

