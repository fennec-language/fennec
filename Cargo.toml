[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fennec-language/fennec"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
unreachable_pub = "deny"

# Safety lints are "forbid": no attribute anywhere can switch them off. Tests get their
# exemptions only through clippy.toml.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unwrap_in_result = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
exit = "forbid"
mod_module_files = "forbid"
allow_attributes = "forbid"
allow_attributes_without_reason = "deny"
mem_forget = "forbid"
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
# The allocator the runtime gives Fennec programs: fast for many small blocks, under MIT.
mimalloc = { version = "=0.1.52", default-features = false }
# Secure random bytes from the operating system, for `Entropy`, on every platform Fennec runs on.
# Reading them on Windows takes FFI, which Fennec's own crates forbid. Under MIT or Apache-2.0.
getrandom = { version = "=0.4.3", default-features = false }
# `std.net`'s HTTP client needs TLS, which isn't something to write by hand. rustls is memory-safe
# and pinned exactly, as every dependency here is. `ring` is its crypto provider, since the other
# needs CMake to build. The platform verifier checks certificates against what the operating
# system trusts, so there's no list of roots to ship and keep up to date.
rustls = { version = "=0.23.46", default-features = false, features = ["ring", "std", "tls12"] }
rustls-platform-verifier = "=0.7.1"
# Checking a release's Ed25519 signatures and hashing what they sign, for `fennec-dist`: the same
# `ring` rustls uses above, so it adds no code to the tree. Only checking, never signing: the keys
# that sign releases are hardware keys, offline. Under Apache-2.0 and ISC.
ring = { version = "=0.17.14", default-features = false }
# Inflating a release's `.tar.gz` when the launcher installs it, after its hash is checked: pure
# Rust with no `unsafe`, the inflater most Rust tools use. Under MIT, Zlib or Apache-2.0.
miniz_oxide = { version = "=0.8.9", default-features = false, features = ["with-alloc"] }
# The deques of the work-stealing pool `parallel` runs on, for programs with tasks: well-tested
# Chase-Lev deques, which would be a lot of subtle code to write again. Under MIT or Apache-2.0.
crossbeam-deque = { version = "=0.8.8", default-features = false, features = ["std"] }
# Switching a parked task's stack, for `parallel(server)`: the stack switch is a few lines of
# assembly per platform, with guard pages on every stack, in a small, well-audited crate whose
# `unsafe` stays its own. Our one use of `unsafe` with it is in fennec-parked. Without its
# `unwind` feature, a panic in a task stops the process in every build, as `panic=abort` does,
# and a task's stack is never unwound from outside it. Under MIT or Apache-2.0.
corosensei = { version = "=0.3.4", default-features = false, features = ["default-stack"] }
# Waiting on many sockets at once, for `parallel(server)`: epoll, kqueue and IOCP behind one
# API, the event loop under Tokio, without its logging. Under MIT.
mio = { version = "=1.2.4", default-features = false, features = ["net", "os-ext", "os-poll"] }
# Every float function, `sin` through `**`, is computed by this one pure-Rust library on every
# platform, so a program prints the same bits on arm64, x86-64, Windows and WebAssembly: each
# platform's own C library rounds some results differently in the last bit, and replays and
# lockstep multiplayer need them the same. It's the library Rust itself uses where there's no C
# library, as on WebAssembly. Without `arch`, nothing in it is chosen by the CPU. Under MIT.
libm = { version = "=0.2.16", default-features = false }
# `std.sqlite`: SQLite itself, compiled from its C source into every build that uses it, so there's
# no system library to find or match. SQLite is the most tested database there is, and writing
# one again isn't the point; rusqlite is the safe API over it, and every `unsafe` stays inside it
# and libsqlite3-sys. Without default features, there's no statement cache to pull in a second
# hashbrown. Not on WebAssembly, where there's no disk. Under MIT, with SQLite in the public domain.
rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled"] }
# Catching the signals that ask a program to stop, for `Signals`: on Unix, a handler that sets a
# flag and wakes a thread, and gives a second signal its default action, so nothing of ours is
# `unsafe`. Its iterator is the thread's. Under MIT or Apache-2.0.
signal-hook = { version = "=0.3.18", default-features = false, features = ["iterator"] }
# The same on Windows, for Ctrl-C and Ctrl-Break, through `SetConsoleCtrlHandler`, its handler run
# on a thread of its own. Under MIT or Apache-2.0.
ctrlc = { version = "=3.4.7", default-features = false }
# On Windows only, to give each connection a send buffer of a fixed size. Windows otherwise grows
# it to take whatever's written, so a client that never reads can make the kernel hold unbounded
# memory for each connection: a denial of service, and a write's `timeout=` that never comes.
# Standard Rust can't set it, and doing so ourselves would be new `unsafe`. It's used for nothing
# else. rust-lang's own crate, under MIT or Apache-2.0.
socket2 = { version = "=0.6.5", default-features = false }
fennec-bench = { path = "crates/bench" }
fennec-blake3 = { path = "crates/blake3" }
fennec-build = { path = "crates/build" }
fennec-check = { path = "crates/check" }
fennec-deps = { path = "crates/deps" }
fennec-dist = { path = "crates/dist" }
fennec-launcher = { path = "crates/launcher" }
fennec-count = { path = "crates/count" }
fennec-fmt = { path = "crates/fmt" }
fennec-fuzz = { path = "crates/fuzz" }
fennec-ir = { path = "crates/ir" }
fennec-parked = { path = "crates/parked" }
fennec-layout = { path = "crates/layout" }
fennec-llvm = { path = "crates/llvm" }
fennec-rt = { path = "crates/rt" }
fennec-runtime = { path = "crates/runtime" }
fennec-kit = { path = "crates/kit" }
fennec-lint = { path = "crates/lint" }
fennec-lsp = { path = "crates/lsp" }
fennec-re = { path = "crates/re" }
fennec-reference = { path = "crates/reference" }
fennec-syntax = { path = "crates/syntax" }

# Day-to-day builds skip debug info: they build and link faster, and errors still name a line.
# Light optimization: most of a test run is the compiler itself, so this runs them about three
# times as fast for a little more compile time. Overflow checks and debug assertions stay on.
[profile.dev]
debug = false
opt-level = 1

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
