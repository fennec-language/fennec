name: CI

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

permissions:
  contents: read

# A newer push to the same pull request cancels its older run. Pushes to main share a group, which
# keeps one running and only the newest waiting: each run covers every commit before it, and the
# one running finishes, as it's what saves the caches pull requests start from. Anything else,
# like a merge group, gets a group of its own, since sharing one would drop some that are needed.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.event_name == 'push' && 'main' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # A pull request or merge group that changes only documentation skips building, testing,
  # benchmarks and sanitizers. It still checks the docs build and the website.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs_only: ${{ steps.changes.outputs.docs-only }}
      parked_changed: ${{ steps.changes.outputs.parked-changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # actionlint and the runner take only `./` for an action in this repository.
      - uses: ./.github/actions/live-merge-group # zizmor: ignore[self-repository]
      - id: changes
        uses: ./.github/actions/docs-only # zizmor: ignore[self-repository]

  lint:
    name: Format, lints and docs
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CODE: ${{ needs.changes.outputs.docs_only != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --check
      - name: Check the Fennec code is formatted
        if: env.CODE == 'true'
        run: cargo run --locked --quiet -p fennec -- fmt --check examples crates/syntax/src/stdlib bench
      # The linter has no off switch, so the examples, which people and AI learn from, pass it.
      - name: Lint the examples
        if: env.CODE == 'true'
        shell: bash
        run: |
          cargo build --locked --quiet -p fennec
          failed=0
          for program in examples/*.fen examples/projects/*/; do
            [ -f "$program" ] || [ -f "$program/kit.toml" ] || continue
            ./target/debug/fennec lint "$program" > /dev/null || failed=1
          done
          exit "$failed"
      # New `unsafe` can't land quietly: every use outside comments, in every Rust file in the
      # repository, is counted by file, and the counts must match the list, which a pull request
      # adding one has to change.
      - name: Count the uses of unsafe
        shell: bash
        run: |
          # One perl reads every file, so the counts aren't split across runs.
          git ls-files -z '*.rs' | perl -e 'my @files = split /\0/, do { local $/; <STDIN> }; my %c;
            for my $file (@files) { open(my $f, "<", $file) or die "$file: $!";
              while (<$f>) { next if m{^\s*//}; $c{$file} += () = /\bunsafe\b/g } }
            printf "%s: %d\n", $_, $c{$_} for grep { $c{$_} } sort keys %c' > unsafe-found.txt
          if ! diff -u <(grep -v '^#' .github/unsafe-allowed.txt) unsafe-found.txt; then
            echo "::error::The uses of unsafe changed: update .github/unsafe-allowed.txt, and say why in the pull request"
            exit 1
          fi
      - run: cargo clippy --all-targets --locked -- -D warnings
        if: env.CODE == 'true'
      - name: Clippy for the playground's WebAssembly module
        if: env.CODE == 'true'
        run: cargo clippy --target wasm32-unknown-unknown -p fennec-wasm --locked -- -D warnings
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    name: Test (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    # A merge group leaves out macOS. GitHub's macOS runners are short, and a job no runner
    # takes is cancelled after about 15 minutes ("not acquired by Runner"), which knocks the
    # pull request out of the queue. The pull request ran on macOS already, up to date with
    # main as the ruleset requires, and the push to main runs it again.
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(github.event_name == 'merge_group' && '["ubuntu-latest", "ubuntu-24.04-arm", "windows-latest"]' || '["ubuntu-latest", "ubuntu-24.04-arm", "macos-latest", "windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    # LLVM is the main backend, so on Linux and Windows its tests have to run: with LLVM's tools
    # from the toolchain's own `llvm-tools`, the LLVM rustc uses, a missing tool or runtime
    # library fails them instead of skipping them.
    env:
      FENNEC_EXPECT_LLVM: ${{ (startsWith(matrix.os, 'ubuntu') || startsWith(matrix.os, 'windows')) && '1' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM's tools
        if: runner.os != 'macOS'
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `fennec run` builds through LLVM where it can, linking the runtime library beside
      # `fennec`, so it's built first and the tests take the path users get.
      - name: Build the runtime library
        shell: bash
        run: |
          cargo build --locked -p fennec-runtime
          # The runtime with threads, on its own so Cargo doesn't give the plain one `threads` too.
          cargo build --locked -p fennec-runtime --features threads --target-dir target/threads
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/threads/debug/fennec_runtime.lib target/debug/fennec_runtime_threads.lib
          else
            cp target/threads/debug/libfennec_runtime.a target/debug/libfennec_runtime_threads.a
          fi
      - run: cargo test --locked
      # Which tests passed. A pull request reads its own results, then the shared ones, and
      # keeps its own apart: GitHub never shows one pull request's cache to another run, so
      # none can plant a false pass. Only a full run on main writes the shared results.
      - name: Restore test results
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fennec-home
          key: fennec-tests-${{ github.event.pull_request.number || 'shared' }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            fennec-tests-${{ github.event.pull_request.number || 'shared' }}-${{ runner.os }}-${{ runner.arch }}-
            fennec-tests-shared-${{ runner.os }}-${{ runner.arch }}-
      - name: Run every example and kit through the fennec command
        shell: bash
        env:
          FENNEC_HOME: ${{ runner.temp }}/fennec-home
        run: |
          # After a merge, every test runs, which catches any bug in what the cache reuses.
          all=()
          if [ "$GITHUB_EVENT_NAME" = push ]; then
            all=(--all)
          fi
          cargo build --locked --quiet -p fennec
          # Each takes a second or so. The limit names a program that hangs, with the job's own as
          # the backstop, and what it prints goes to a file so nothing left running can hold a pipe.
          fennec() { .github/scripts/within.sh 120 ./target/debug/fennec "$@"; }
          printed="$RUNNER_TEMP/printed.txt"

          # The limit has to work to be any use, on each platform, and stop what it started too:
          # `cat` only ends once nothing is left that could write to it.
          printf 'def main():\n    while True:\n        pass\n' > "$RUNNER_TEMP/forever.fen"
          status=0
          .github/scripts/within.sh 5 ./target/debug/fennec run "$RUNNER_TEMP/forever.fen" | cat || status=$?
          [ "$status" = 124 ] || { echo "::error::the time limit gave $status for a program that never ends"; exit 1; }

          for program in examples/*.fen; do
            fennec run "$program" > "$printed"
            diff --strip-trailing-cr "${program%.fen}.out" "$printed"
            fennec test "${all[@]}" "$program" > /dev/null
          done
          for kit in examples/projects/*/; do
            [ -f "$kit/kit.toml" ] || continue
            fennec run "$kit" > "$printed"
            diff --strip-trailing-cr "${kit%/}.out" "$printed"
            fennec test "${all[@]}" "$kit" > /dev/null
          done
      - name: Save test results
        if: github.event_name != 'merge_group'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/fennec-home
          key: fennec-tests-${{ github.event.pull_request.number || 'shared' }}-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

  # Only a report, of tests `test` runs too, so a merge group leaves it out. The pull request
  # and the push to main each have it.
  coverage:
    name: Coverage
    needs: changes
    if: needs.changes.outputs.docs_only != 'true' && github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-llvm-cov@0.9.1
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # `tee` would hide a failing test without `pipefail`, which `shell: bash` turns on. The
      # tests that link programs look for the runtime library beside `fennec`, which isn't where
      # llvm-cov builds it, so they run in the test jobs instead.
      - name: Measure coverage
        shell: bash
        run: |
          cargo llvm-cov --locked --summary-only -- --skip llvm:: --skip executables:: | tee coverage.txt
      - name: Show coverage on the run's summary page
        run: |
          {
            echo '## Coverage'
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deny:
    name: Licenses, advisories and sources
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-deny@0.20.2
      - run: cargo deny --locked check

  site:
    name: Website builds
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The build compiles the interpreter to WebAssembly for the playground.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci --prefix site
      - run: npm run build --prefix site
      - name: Run the examples through the playground's WebAssembly module
        run: node site/scripts/check-playground.mjs

  workflows:
    name: Workflow lints and security audit
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: zizmor@1.31.1
      - name: zizmor
        run: zizmor --offline --min-severity low .github/workflows

  bench:
    name: Benchmarks
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build fennec and the benchmark suite
        run: cargo build --release --locked -p fennec -p fennec-bench
      # The previous commit is the base of a pull request or merge group, or the commit before
      # a push to main. Both versions run on this machine, so their times compare fairly.
      # A merge group leaves it out: slowdowns against it are only warnings, which the pull request
      # and the push to main show. Wrong output and the enforced floors still fail it.
      - name: Build the previous commit's fennec
        if: github.event_name != 'merge_group'
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git worktree add --detach ../previous "$BASE"
            cargo build --release --locked -p fennec --manifest-path ../previous/Cargo.toml --target-dir target/previous
          fi
      # Each kernel's work is counted in instructions and compared with its pinned target. The
      # runner's virtual CPU usually hides the counters perf reads, so Valgrind counts by
      # simulating instead.
      - name: Install tools that count instructions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind linux-tools-common "linux-tools-$(uname -r)" || echo "some aren't available"
          sudo sysctl -w kernel.perf_event_paranoid=1 || true
      - name: Measure each kernel against its target and the previous commit
        run: |
          previous=()
          if [ -x target/previous/release/fennec ]; then
            previous=(--previous target/previous/release/fennec)
          fi
          # Report only: slowdowns against the previous commit show as warnings, not failures,
          # until the instruction count proves stable on no-op pull requests. Wrong output, or a
          # kernel below an enforced floor, still fails the job.
          ./target/release/fennec-bench --report-only "${previous[@]}"

  # Limits on how long editing, checking, testing and formatting take. A budget that's enforced
  # fails this job; one not met yet shows as a warning. See crates/bench/src/budgets.rs.
  budgets:
    name: Instant-feedback budgets
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo build --release --locked -p fennec -p fennec-bench
      # An edit's verdict is held to a count of instructions, which doesn't depend on which
      # machine this lands on. Its time is shown too, and warns.
      - name: Install what counts instructions
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq valgrind
      - run: ./target/release/fennec-bench budgets

  # Programs built through LLVM, with their code and the runtime library instrumented by
  # AddressSanitizer, so touching memory they don't own stops them. Every example LLVM takes runs,
  # both ways it builds, and must print its `.out`. Then a fixed fuzzing run compares random
  # programs against the interpreter. Leaks aren't checked: the runtime leaves freeing at exit
  # to the system.
  asan:
    name: AddressSanitizer on LLVM-built programs
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NIGHTLY: nightly-2026-10-15
      FENNEC_SANITIZE: address
      ASAN_OPTIONS: detect_leaks=0:exitcode=86
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM's tools, and the nightly compiler AddressSanitizer needs
        run: |
          rustup component add llvm-tools-preview
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build fennec, and its runtime library with AddressSanitizer
        run: |
          cargo build --release --locked -p fennec -p fennec-fuzz
          # `sanitize`: the system's allocator and freed blocks given back, so ASan sees each one.
          RUSTFLAGS=-Zsanitizer=address cargo "+$NIGHTLY" build --release --locked -p fennec-runtime \
            --features sanitize -Zbuild-std --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/libfennec_runtime.a target/release/
      - name: Run every example LLVM takes
        run: |
          built=0
          failed=0
          for program in examples/*.fen; do
            for how in --llvm "--llvm --release"; do
              # shellcheck disable=SC2086 # `$how` is two words for a release
              if ! .github/scripts/within.sh 300 ./target/release/fennec build $how "$program" -o checked > /dev/null 2> built.txt; then
                # Anything but a failed tool or link is the backend saying what it doesn't take yet.
                grep -qE "linking failed|failed on|couldn't run|once trimmed|panicked|didn't finish" built.txt || continue
                echo "::error::$program didn't build with $how"; cat built.txt; failed=1; continue
              fi
              if ! nm checked | grep -q __asan_report_load; then
                echo "::error::$program built with $how without AddressSanitizer"; failed=1; continue
              fi
              built=$((built + 1))
              ran=0
              .github/scripts/within.sh 120 ./checked > printed.txt 2> said.txt || ran=$?
              if [ "$ran" = 124 ]; then
                echo "::error::$program built with $how didn't finish"; cat said.txt; failed=1
              elif grep -q AddressSanitizer said.txt; then
                echo "::error::$program built with $how touched memory it doesn't own"; cat said.txt; failed=1
              elif ! cmp -s printed.txt "${program%.fen}.out"; then
                echo "::error::$program built with $how printed something different"; cat said.txt; failed=1
              fi
            done
          done
          echo "$built builds ran under AddressSanitizer"
          [ "$built" -ge 40 ] || { echo "::error::only $built builds ran"; failed=1; }
          exit "$failed"
      - name: Fuzz programs built through LLVM against the interpreter
        run: FENNEC="$PWD/target/release/fennec" ./target/release/fennec-fuzz run llvm --seed 1 --inputs 150 --seconds 300 --found found
      - name: Keep what fuzzing found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: asan-fuzz-found
          path: found
          if-no-files-found: ignore

  # Programs built with no interpreter in their runtime: nothing but what's listed may still need
  # it, which fails at link, and everything else prints what it should, on one thread and on
  # several. When JSON and the network are native, the list is empty and this is the default.
  lean-runtime:
    name: Programs with no interpreter
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FENNEC_LEAN_RUNTIME: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM's tools
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build fennec, and its runtimes with no interpreter
        run: |
          cargo build --release --locked -p fennec
          cargo build --release --locked -p fennec-runtime --features lean --target-dir target/lean
          cp target/lean/release/libfennec_runtime.a target/release/libfennec_runtime_lean.a
          cargo build --release --locked -p fennec-runtime --features lean,threads --target-dir target/lean-threads
          cp target/lean-threads/release/libfennec_runtime.a target/release/libfennec_runtime_lean_threads.a
      - name: Build and run every example and kernel
        run: |
          still_needs=" import_as json_annotations json_collections json_enums json_ids json_names json_rules "
          built=0
          failed=0
          for program in examples/*.fen bench/kernels/*.fen; do
            name=$(basename "$program" .fen)
            if ! ./target/release/fennec build --llvm "$program" -o checked > /dev/null 2> built.txt; then
              # Anything but a failed link is the backend saying what it doesn't take yet.
              grep -qE "linking failed|Undefined symbols|undefined reference" built.txt || continue
              case "$still_needs" in
                *" $name "*) ;;
                *) echo "::error::$name needs the interpreter"; cat built.txt; failed=1 ;;
              esac
              continue
            fi
            case "$still_needs" in
              *" $name "*) echo "::error::$name doesn't need the interpreter any more: take it off the list"; failed=1 ;;
            esac
            if nm checked | grep -q 5Interp; then echo "::error::$name has the interpreter in it"; failed=1; fi
            built=$((built + 1))
            if [ -f "${program%.fen}.out" ]; then
              timeout 120 ./checked < /dev/null > printed.txt 2> said.txt || true
              if ! cmp -s printed.txt "${program%.fen}.out"; then
                echo "::error::$name printed something different"; cat said.txt; failed=1
              fi
            fi
          done
          echo "$built programs built with no interpreter"
          [ "$built" -ge 90 ] || { echo "::error::only $built built"; failed=1; }
          exit "$failed"
      - name: Run what uses parallel on real threads
        env:
          FENNEC_THREADS_RUNTIME: 1
        run: |
          failed=0
          for program in crates/fennec/tests/fixtures/workers/*.fen examples/parallel_loops.fen examples/parallel_put_back.fen; do
            FENNEC_LEAN_RUNTIME='' FENNEC_THREADS_RUNTIME='' ./target/release/fennec run --interp "$program" 2> /dev/null | sort > wanted.txt
            ./target/release/fennec build --llvm "$program" -o checked > /dev/null
            for threads in 1 4 8; do
              if [ "$(FENNEC_THREADS=$threads timeout 120 ./checked 2> said.txt | sort)" != "$(cat wanted.txt)" ]; then
                echo "::error::$program at $threads threads printed something different"; cat said.txt; failed=1
              fi
            done
          done
          exit "$failed"

  # What `parallel` runs on real threads, built with the threads runtime, under AddressSanitizer
  # and ThreadSanitizer, at several thread counts and with every call forced onto the pool. Each
  # has to print what the interpreter prints, sorted, as output from bodies comes in call order.
  worker-sanitizers:
    name: Workers under ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: AddressSanitizer
            sanitize: address
            report: AddressSanitizer
            symbol: __asan_report_load
            options: ASAN_OPTIONS=detect_leaks=0:exitcode=86:detect_stack_use_after_return=0
          - name: ThreadSanitizer
            sanitize: thread
            report: ThreadSanitizer
            symbol: __tsan_read
            options: TSAN_OPTIONS=halt_on_error=0:exitcode=86:report_signal_unsafe=0
    env:
      NIGHTLY: nightly-2026-10-15
      FENNEC_THREADS_RUNTIME: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM's tools, and the nightly compiler the sanitizers need
        run: |
          rustup component add llvm-tools-preview
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build fennec, and its threads runtime with the sanitizer
        env:
          SANITIZE: ${{ matrix.sanitize }}
        run: |
          cargo build --release --locked -p fennec
          RUSTFLAGS="-Zsanitizer=$SANITIZE" cargo "+$NIGHTLY" build --release --locked -p fennec-runtime \
            --features threads,sanitize -Zbuild-std --target x86_64-unknown-linux-gnu --target-dir target/threads
          # A `parallel` loop that stays on one thread links the plain runtime, which this also serves as.
          cp target/threads/x86_64-unknown-linux-gnu/release/libfennec_runtime.a \
            target/release/libfennec_runtime_threads.a
          cp target/threads/x86_64-unknown-linux-gnu/release/libfennec_runtime.a target/release/libfennec_runtime.a
      - name: Run every program that uses parallel
        env:
          FENNEC_SANITIZE: ${{ matrix.sanitize }}
          REPORT: ${{ matrix.report }}
          SYMBOL: ${{ matrix.symbol }}
          OPTIONS: ${{ matrix.options }}
        run: |
          failed=0
          runs=0
          export "${OPTIONS?}"
          programs=$(grep -lE 'parallel\(' examples/*.fen | xargs grep -L Net)
          for program in $programs crates/fennec/tests/fixtures/workers/*.fen; do
            FENNEC_SANITIZE='' ./target/release/fennec run --interp "$program" 2> /dev/null | sort > wanted.txt
            if ! ./target/release/fennec build --llvm "$program" -o checked > /dev/null 2> built.txt; then
              echo "::error::$program didn't build"; cat built.txt; failed=1; continue
            fi
            nm checked | grep -q "$SYMBOL" || { echo "::error::$program built without the sanitizer"; failed=1; }
            for threads in 1 4 8 stress; do
              if [ "$threads" = stress ]; then
                got=$(FENNEC_PARALLEL_STRESS=1 FENNEC_THREADS=4 timeout 120 ./checked 2> said.txt | sort)
              else
                got=$(FENNEC_THREADS=$threads timeout 120 ./checked 2> said.txt | sort)
              fi
              runs=$((runs + 1))
              if grep -q "$REPORT" said.txt; then
                echo "::error::$program at $threads threads: $REPORT reported"; cat said.txt; failed=1
              elif [ "$got" != "$(cat wanted.txt)" ]; then
                echo "::error::$program at $threads threads printed something different"; cat said.txt; failed=1
              fi
            done
          done
          echo "$runs runs under $REPORT"
          [ "$runs" -ge 40 ] || { echo "::error::only $runs runs"; failed=1; }
          exit "$failed"

  # Parked tasks switch stacks, the one place our own code follows a pointer `unsafe`ly, so
  # their stress tests run under AddressSanitizer, told of each switch, with leaks checked,
  # and under ThreadSanitizer.
  # A merge group runs these only if it changes what they test, which is one crate that uses
  # nothing else in the workspace: nothing another pull request does can break them.
  parked-sanitizers:
    name: Parked tasks under ${{ matrix.name }}
    needs: changes
    if: >-
      needs.changes.outputs.docs_only != 'true'
      && (github.event_name != 'merge_group' || needs.changes.outputs.parked_changed == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # Each sanitizer runs with unwinding, as tests build, and with `panic=abort`, as release
        # builds do.
        include:
          # A local can live on a fake stack on the heap when AddressSanitizer looks for use
          # after return, which the check that a task runs on its own stack would rightly
          # stop on, so that one check is turned off here.
          - name: AddressSanitizer
            flags: -Zsanitizer=address
            features: --features sanitizer
            options: ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=0
            std: std
          - name: AddressSanitizer, panic=abort
            flags: -Zsanitizer=address -Cpanic=abort -Zpanic-abort-tests
            features: --features sanitizer
            options: ASAN_OPTIONS=detect_leaks=1:detect_stack_use_after_return=0
            std: std,panic_abort
          - name: ThreadSanitizer
            flags: -Zsanitizer=thread
            features: ""
            options: TSAN_OPTIONS=halt_on_error=1
            std: std
          - name: ThreadSanitizer, panic=abort
            flags: -Zsanitizer=thread -Cpanic=abort -Zpanic-abort-tests
            features: ""
            options: TSAN_OPTIONS=halt_on_error=1
            std: std,panic_abort
    env:
      NIGHTLY: nightly-2026-10-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the nightly compiler the sanitizers need
        run: rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - name: Run the parked tasks' tests
        env:
          FLAGS: ${{ matrix.flags }}
          FEATURES: ${{ matrix.features }}
          OPTIONS: ${{ matrix.options }}
          STD: ${{ matrix.std }}
        run: |
          # shellcheck disable=SC2086 # `$FEATURES` is two words or none
          env "$OPTIONS" RUSTFLAGS="$FLAGS" RUSTDOCFLAGS="$FLAGS" cargo "+$NIGHTLY" test --locked \
            -Zbuild-std="$STD" --target x86_64-unknown-linux-gnu -p fennec-parked $FEATURES

  # One status for branch protection to require, so adding jobs never means changing settings.
  # A job skipped because the change is only documentation counts as passed, and so do the two a
  # merge group can leave out; any other skip, failure or cancellation doesn't.
  ok:
    name: CI passed
    if: always()
    needs: [changes, lint, test, coverage, deny, site, workflows, budgets, bench, worker-sanitizers, lean-runtime, asan, parked-sanitizers]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
          DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          PARKED_CHANGED: ${{ needs.changes.outputs.parked_changed }}
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          failed=0
          while read -r job result; do
            [ "$result" = success ] && continue
            [ "$result" = skipped ] && [ "$DOCS_ONLY" = true ] && continue
            if [ "$result" = skipped ] && [ "$EVENT" = merge_group ]; then
              [ "$job" = coverage ] && continue
              [ "$job" = parked-sanitizers ] && [ "$PARKED_CHANGED" != true ] && continue
            fi
            if [ "$job" = test ] && [ "$result" != skipped ]; then
              # `test` has one result for its whole matrix, so each OS's job is looked at.
              # The one exception, on pull requests only: GitHub's macOS runners are short, and
              # a macOS job no runner ever took (cancelled, with no runner and no steps) is a
              # warning rather than a failure. A macOS job that ran and failed still fails, and
              # so does every other OS and every push to main. The fields are split on `|`,
              # since tabs would run together where the runner is empty.
              while IFS='|' read -r name conclusion runner steps; do
                [ "$conclusion" = success ] && continue
                if [ "$EVENT" = pull_request ] && [ "$name" = "Test (macos-latest)" ] \
                  && [ "$conclusion" = cancelled ] && [ -z "$runner" ] && [ "$steps" = 0 ]; then
                  echo "::warning::$name never got a runner, so it doesn't count; the push to main runs it again"
                  continue
                fi
                echo "$name finished with: $conclusion"
                failed=1
              done < <(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/attempts/$RUN_ATTEMPT/jobs" \
                --jq '.jobs[] | select(.name | startswith("Test (")) | [.name, (.conclusion // "unfinished"), (.runner_name // ""), (.steps | length | tostring)] | join("|")')
              continue
            fi
            echo "$job finished with: $result"
            failed=1
          done < <(jq -r 'to_entries[] | "\(.key) \(.value.result)"' <<< "$NEEDS")
          exit "$failed"
