# Measures the benchmark suite's targets from the kernels' twins, once per architecture. Everyday
# runs only read them. Run this when a kernel's work or a twin changes, then copy each file this
# prints into bench/targets/, the unchecked ones too.
name: Pin benchmark targets

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pin:
    name: Pin (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The kernels are built by `fennec build --llvm`, which uses the toolchain's `opt` and `llc`.
      - run: rustup component add llvm-tools-preview
      - run: cargo build --release --locked -p fennec -p fennec-runtime -p fennec-bench
      # The runtime with threads, for kernels that `launch` a task, on its own so the others don't
      # get `threads` too.
      - name: Build the runtime with threads
        run: |
          cargo build --release --locked -p fennec-runtime --features threads --target-dir target/threads
          cp target/threads/release/libfennec_runtime.a target/release/libfennec_runtime_threads.a
      - name: Install what counts instructions
        run: |
          .github/scripts/apt.sh valgrind
      - run: ./target/release/fennec-bench pin
      - name: Print the targets
        run: |
          for file in bench/targets/*.txt bench/targets/unchecked/*.txt; do
            echo "== $file"
            cat "$file"
            { echo "## $file"; echo '```'; cat "$file"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          done
