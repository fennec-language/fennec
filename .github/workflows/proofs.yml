name: Proofs

# Every night, everything is built checking proofs: each check the compiler leaves out because it
# proved the check can't fail (an index inside its list, an add that can't overflow, a divisor
# that can't be zero, a list with one owner, room for a loop's appends) is written anyway, as an
# assertion that the proof held. A program that stops with "proof broken" has found a false proof:
# the compiler left out a check that could fail, which is the worst kind of bug it can have. No
# pull request waits on this.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FENNEC_CHECK_PROOFS: "1"

jobs:
  proofs:
    name: Every proof checked
    runs-on: ubuntu-latest
    timeout-minutes: 150
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM's tools
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build fennec, its runtime libraries and the fuzzer
        run: |
          cargo build --release --locked -p fennec -p fennec-runtime -p fennec-fuzz
          cargo build --release --locked -p fennec-runtime --features threads --target-dir target/threads
          cp target/threads/release/libfennec_runtime.a target/release/libfennec_runtime_threads.a
      - name: Run every example LLVM takes, both ways it builds
        id: examples
        run: |
          built=0
          broken=0
          for program in examples/*.fen; do
            for how in dev release; do
              release=()
              [ "$how" = release ] && release=(--release)
              .github/scripts/within.sh 300 ./target/release/fennec build "${release[@]}" "$program" -o checked > /dev/null 2> built.txt || continue
              built=$((built + 1))
              .github/scripts/within.sh 120 ./checked > printed.txt 2> said.txt || true
              if grep -q "proof broken" said.txt; then
                echo "::error::$program built in $how broke a proof"; cat said.txt; broken=1
              fi
            done
          done
          echo "$built builds ran checking proofs"
          [ "$built" -ge 40 ] || { echo "::error::only $built builds ran"; broken=1; }
          exit "$broken"
      - name: Run every benchmark kernel, both ways it builds
        id: kernels
        if: always()
        run: |
          broken=0
          for kernel in bench/kernels/*.fen; do
            for how in dev release; do
              release=()
              [ "$how" = release ] && release=(--release)
              if ! .github/scripts/within.sh 300 ./target/release/fennec build "${release[@]}" "$kernel" -o "$PWD/checked" > /dev/null 2> built.txt; then
                echo "::error::$kernel didn't build in $how"; cat built.txt; broken=1; continue
              fi
              ran=0
              (cd bench/kernels && ../../.github/scripts/within.sh 300 ../../checked > /dev/null 2> ../../said.txt) || ran=$?
              if grep -q "proof broken" said.txt; then
                echo "::error::$kernel built in $how broke a proof"; cat said.txt; broken=1
              elif [ "$ran" != 0 ]; then
                echo "::error::$kernel built in $how failed"; cat said.txt; broken=1
              fi
            done
          done
          exit "$broken"
      - name: Fuzz programs built through LLVM
        id: fuzz
        if: always()
        run: FENNEC="$PWD/target/release/fennec" ./target/release/fennec-fuzz run llvm --seed "$GITHUB_RUN_ID" --seconds 1200 --found found | tee fuzz.txt
      - name: Run every test
        id: tests
        if: always()
        run: |
          status=0
          cargo test --workspace --locked --no-fail-fast > tests.txt 2>&1 || status=$?
          tail -40 tests.txt
          if grep -q "proof broken" tests.txt; then
            echo "::error::a test's program broke a proof"
            grep -B4 -A8 "proof broken" tests.txt | head -200
            exit 1
          fi
          exit "$status"
      - name: Keep what was found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proofs-found
          path: |
            found
            tests.txt
          if-no-files-found: ignore
      - name: File an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          EXAMPLES: ${{ steps.examples.outcome }}
          KERNELS: ${{ steps.kernels.outcome }}
          FUZZ: ${{ steps.fuzz.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          {
            echo "The nightly run checking proofs failed: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Examples: $EXAMPLES. Kernels: $KERNELS. Fuzzing: $FUZZ. Tests: $TESTS."
            echo
            echo "A program stopping with \"proof broken\" means the compiler left out a check that could fail. What fuzzing found and the tests' output are in the run's artifact."
          } > issue.md
          gh issue create --title "A proof the compiler made broke" --body-file issue.md --label "bug" --label "priority: now" --repo "$GITHUB_REPOSITORY"
