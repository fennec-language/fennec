name: Proofs

# Every night, everything is built checking proofs: each check the compiler leaves out because it
# proved the check can't fail (an index inside its list, an add that can't overflow, a divisor
# that can't be zero, a list with one owner, room for a loop's appends) is written anyway, as an
# assertion that the proof held. A program that stops with "proof broken" has found a false proof:
# the compiler left out a check that could fail, which is the worst kind of bug it can have. Once
# `fennec` takes `FENNEC_STRIP_FACTS`, everything is built again with the facts handed to LLVM
# stripped, and must print the same. Every example, kit, fixture and 50 random programs also run with
# another hash seed, more threads and load, and recorded and replayed, and must print the same each
# way (`.github/scripts/determinism.sh`). Every program that uses threads runs under ThreadSanitizer too
# (`.github/scripts/tsan-programs.sh`). Every example and kit is built for a heap audit and run under
# it too, with each block's owners counted again as it ends (`.github/scripts/audit.sh`), and the
# fuzzer's random programs and its recorded and replayed tasks are built and run under it. The
# runtime's tests run under Miri, which stops on undefined behavior in the crates under it
# (`.github/scripts/miri.sh`). The game server and the web backend each run for an hour under
# their own load, and what they hold has to level off (`.github/scripts/soak.sh`). A generated
# program of 20,000, 50,000 and 100,000 lines is checked, built and tested, and each step held to its
# time and memory, and to growing no faster than the program (`fennec-bench big-codebase`; 200,000
# lines weekly, in `big-codebase-weekly.yml`). The night's
# report is kept as `nightly-report`, which
# `.github/scripts/nightly-report.sh` copies into the lanes' notes. No pull request waits on this.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FENNEC_CHECK_PROOFS: "1"

jobs:
  proofs:
    name: Every proof checked
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build fennec, its runtime libraries and the fuzzer
        run: |
          cargo build --release --locked -p fennec -p fennec-runtime -p fennec-fuzz
          # With threads, and each way again with the heap audit in it, for the audit's step.
          for features in threads audit threads,audit; do
            dir="target/$(echo "$features" | tr , -)"
            cargo build --release --locked -p fennec-runtime --features "$features" --target-dir "$dir"
            cp "$dir/release/libfennec_runtime.a" "target/release/libfennec_runtime_$(echo "$features" | tr , _).a"
          done
      - name: Build and run every example, kit and kernel, both ways
        id: builds
        run: .github/scripts/nightly-proofs.sh target/release/fennec report.md
      - name: Fuzz programs built through LLVM
        id: fuzz
        if: always()
        run: FENNEC="$PWD/target/release/fennec" ./target/release/fennec-fuzz run llvm --seed "$GITHUB_RUN_ID" --seconds 1200 --found found | tee fuzz.txt
      - name: Fuzz random programs for an hour, against what they should print
        id: programs
        if: always()
        run: FENNEC="$PWD/target/release/fennec" ./target/release/fennec-fuzz run programs --seed "$GITHUB_RUN_ID" --seconds 3600 --stuck 180 --found found | tee programs.txt
      # The builds are held to the oracle only on the random programs it runs, and it refuses the
      # rest without a word: the report says how many of the night's first 200 it ran, and why it
      # refused the others.
      - name: Count the random programs the oracle runs
        id: oracle_share
        if: always()
        run: ./target/release/fennec-fuzz oracle --seed "$GITHUB_RUN_ID" --inputs 200 | tee oracle-share.txt
      # Built for a heap audit, each program's heap is checked as it ends: a block left with no
      # holder, or counted otherwise than its holders, fails the program that made it. No daemon,
      # since one started earlier wouldn't have the switch in its environment.
      - name: Fuzz random programs under the heap audit
        id: audited
        if: always()
        env:
          FENNEC_AUDIT: "1"
          FENNEC_NO_DAEMON: "1"
        run: FENNEC="$PWD/target/release/fennec" ./target/release/fennec-fuzz run programs --seed "$GITHUB_RUN_ID" --seconds 900 --stuck 180 --found found | tee audited.txt
      # The same for tasks and a server's rounds that crash, stop, deadlock, take locks and serve
      # HTTP, each recorded and replayed: the shapes where a task's blocks are handed over, which the
      # random programs above rarely reach. A line of the audit's breaks the target's rule that a
      # run says nothing on standard error but what its crashes say.
      - name: Fuzz recorded and replayed tasks under the heap audit
        id: audited_replay
        if: always()
        env:
          FENNEC_AUDIT: "1"
          FENNEC_NO_DAEMON: "1"
        run: FENNEC="$PWD/target/release/fennec" ./target/release/fennec-fuzz run replay --seed "$GITHUB_RUN_ID" --seconds 900 --found found | tee audited-replay.txt
      - name: Run every program four ways, which must print the same
        id: determinism
        if: always()
        run: .github/scripts/determinism.sh target/release/fennec report.md 50
      # Its findings go in the night's report, each naming the program and the blocks.
      - name: Audit the heap of every example and kit as it ends
        id: audit
        if: always()
        env:
          FENNEC: target/release/fennec
        run: |
          echo "## Heap audit" >> report.md
          .github/scripts/audit.sh report.md
      - name: Check formatting takes time in proportion to the program
        id: timing
        if: always()
        run: cargo test --release --locked -p fennec-fmt --test fmt -- --ignored --exact examples::formats_a_big_program_in_time_in_proportion
      - name: Run every test
        id: tests
        if: always()
        run: |
          status=0
          cargo test --workspace --locked --no-fail-fast > tests.txt 2>&1 || status=$?
          tail -40 tests.txt
          # Each test that failed, by name, with where it panicked and why: on the run's page, and
          # in the night's report, so a failed night reads in one line.
          .github/scripts/failed-tests.sh tests.txt > failed-tests.txt
          while read -r failed; do echo "::error::$failed"; done < failed-tests.txt
          if [ -s failed-tests.txt ]; then
            { echo "## Tests that failed"; echo; sed 's/^/- /' failed-tests.txt; echo; } >> report.md
          fi
          if grep -q "proof broken" tests.txt; then
            echo "::error::a test's program broke a proof"
            grep -B4 -A8 "proof broken" tests.txt | head -200
            exit 1
          fi
          exit "$status"
      - name: Write the night's report
        if: always()
        env:
          BUILDS: ${{ steps.builds.outcome }}
          FUZZ: ${{ steps.fuzz.outcome }}
          PROGRAMS: ${{ steps.programs.outcome }}
          AUDITED: ${{ steps.audited.outcome }}
          AUDITED_REPLAY: ${{ steps.audited_replay.outcome }}
          DETERMINISM: ${{ steps.determinism.outcome }}
          AUDIT: ${{ steps.audit.outcome }}
          TIMING: ${{ steps.timing.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          {
            echo "# Proofs, $(date -u +%Y-%m-%d), $(git rev-parse --short HEAD)"
            echo
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Builds: $BUILDS. Fuzzing LLVM: $FUZZ. Random programs: $PROGRAMS. Random programs under the heap audit: $AUDITED. Replayed tasks under the heap audit: $AUDITED_REPLAY. Determinism: $DETERMINISM. Heap audit: $AUDIT. Formatting in proportion: $TIMING. Tests: $TESTS."
            # The tests that failed by name, on a line of their own that `nightly-report.sh` reads.
            if [ -s failed-tests.txt ]; then
              echo
              echo "Failed tests: $(sed 's/: .*//' failed-tests.txt | paste -sd ' ' - | sed 's/ /, /g')"
            fi
            echo
            [ -f report.md ] && cat report.md
            echo
            echo "## Fuzzing"
            grep -hE "inputs, [0-9]+ failures|broke a rule|crashed|got stuck|the oracle ran" fuzz.txt programs.txt oracle-share.txt audited.txt audited-replay.txt 2>/dev/null | sed 's/^/- /'
          } > nightly.md
          cat nightly.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-report
          retention-days: 7
          path: nightly.md
      - name: Keep what was found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proofs-found
          retention-days: 7
          path: |
            found
            tests.txt
          if-no-files-found: ignore
      - name: File an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat nightly.md
            echo
            echo "A program stopping with \"proof broken\" means the compiler left out a check that could fail. One printing otherwise with facts stripped means a fact handed to LLVM is wrong. One printing otherwise with another seed, thread count or load, or when replayed, isn't deterministic. A line of the heap audit's names a block whose count of owners differs from the holders found for it, or that nothing leads to any more. What fuzzing found and the tests' output are in the run's artifact."
          } > issue.md
          gh issue create --title "A proof the compiler made broke" --body-file issue.md --label "bug" --label "priority: now" --repo "$GITHUB_REPOSITORY"

  # Every program that uses threads, launches tasks, or shares state, and the real programs, under
  # ThreadSanitizer, as CI's job runs them: see `tsan-programs.sh`. A report fails it, and the issue
  # carries what was found.
  tsan:
    name: Programs under ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    env:
      NIGHTLY: nightly-2026-10-15
      FUZZ_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the nightly compiler ThreadSanitizer needs
        run: |
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build fennec and the fuzzer, and the runtime libraries with ThreadSanitizer
        run: .github/scripts/tsan-runtime.sh
      - name: Run the programs that use threads, and random programs for half an hour
        run: .github/scripts/tsan-programs.sh target/release/fennec 1800 | tee tsan.txt
      - name: Keep what was found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsan-found
          retention-days: 7
          path: |
            found
            tsan.txt
          if-no-files-found: ignore
      - name: File an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "ThreadSanitizer reported a data race, or a program under it printed something different, in the nightly run."
            echo
            echo '```'
            grep -A40 "::error::" tsan.txt | head -200
            echo '```'
            echo
            echo "What fuzzing found, and the whole output, are in the run's \`tsan-found\` artifact."
          } > issue.md
          gh issue create --title "ThreadSanitizer reported in the nightly run" --body-file issue.md --label "bug" --label "priority: now" --repo "$GITHUB_REPOSITORY"

  # The two real programs that serve, each run for an hour under its own scripted load, round after
  # round in one process, once with every round in one long task and once on its own thread: what
  # they hold has to level off after a warm-up, and a round has to finish every minute. See
  # `soak.sh`, whose curve for each, its start, end and slope, goes in the night's report.
  soak:
    name: Soak ${{ matrix.program }} for an hour, in ${{ matrix.in }}
    runs-on: ubuntu-latest
    timeout-minutes: 100
    strategy:
      fail-fast: false
      matrix:
        program: [game_server, web_backend]
        in: [task, main]
        # Resident memory may rise 5% or 4 MB after the warm-up, as `soak.sh` says. game_server may
        # rise 10% or 8 MB: in a task its resident memory wanders within a band about 9 MB wide, as
        # its workers' allocator heaps fill and give back, and an hour has caught it rising 6 MB
        # (#2158).
        include:
          - program: game_server
            rss_rise: 10
            rss_least: 8192
          - program: web_backend
            rss_rise: 5
            rss_least: 4096
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build fennec and its runtimes
        run: |
          cargo build --release --locked -p fennec -p fennec-runtime
          cargo build --release --locked -p fennec-runtime --features threads --target-dir target/threads
          cp target/threads/release/libfennec_runtime.a target/release/libfennec_runtime_threads.a
      - name: Run it for an hour, reading what it holds every minute
        env:
          PROGRAM: ${{ matrix.program }}
          SOAK_IN: ${{ matrix.in }}
          SOAK_RSS_RISE: ${{ matrix.rss_rise }}
          SOAK_RSS_LEAST: ${{ matrix.rss_least }}
        run: .github/scripts/soak.sh target/release/fennec "bench/realworld/$PROGRAM.fen" soak.md 60
      - name: Show the curve on the run's summary page
        if: always()
        run: '[ -f soak.md ] && cat soak.md >> "$GITHUB_STEP_SUMMARY" || true'
      # `nightly-report.sh` adds these to the night's report.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: soak-${{ matrix.program }}-${{ matrix.in }}
          retention-days: 7
          path: soak.md
          if-no-files-found: ignore

  # A program of 20,000, 50,000 and 100,000 lines, generated the same each night: checked, built
  # cold in dev and release, built again after a one-line edit, and tested, each step held to its
  # time and memory in `bench/big-codebase.txt`, and to growing in step with the program, not
  # faster (`fennec-bench big-codebase`).
  big-codebase:
    name: Check, build and test a big codebase at three sizes
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # GNU's `time` reads the most memory each step's processes held.
      - name: Install GNU's time
        run: |
          .github/scripts/apt.sh time
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build fennec, its runtimes, their bitcode and the bench
        run: .github/scripts/big-codebase-build.sh
      # Each step runs three times and counts its median, so one slow or fast run can't fail a
      # night or pass one by itself. One run of the three sizes took 12 minutes on this runner on
      # 2026-11-17, so three take about 40.
      # 200,000 is weekly, in `big-codebase-weekly.yml`.
      - name: Measure each step at each size
        run: ./target/release/fennec-bench big-codebase --lines 20000,50000,100000 --runs 3 --markdown big-codebase.md
      - name: Show the numbers on the run's summary page
        if: always()
        run: '[ -f big-codebase.md ] && cat big-codebase.md >> "$GITHUB_STEP_SUMMARY" || true'
      # `nightly-report.sh` adds these to the night's report.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: big-codebase
          retention-days: 7
          path: big-codebase.md
          if-no-files-found: ignore

  # The runtime's tests under Miri, each on its own, split eight ways: see `miri.sh`, which says
  # what Miri can't run and what checks it instead. Undefined behavior or a deadlock fails it, and
  # the issue carries what Miri said and the seed to run it again with. Each night's seed differs,
  # so threads take turns in another order.
  miri:
    name: Runtime tests under Miri (shard ${{ matrix.shard }} of 8)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    env:
      MIRI_TOOLCHAIN: nightly-2026-10-15
      MIRI_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the nightly compiler and Miri
        run: rustup toolchain install "$MIRI_TOOLCHAIN" --profile minimal --component miri,rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: miri-${{ matrix.shard }}
      - name: Run this shard's tests under Miri
        env:
          SHARD: ${{ matrix.shard }}
        run: .github/scripts/miri.sh miri.md "$SHARD/8" | tee miri.txt
      - name: Show what didn't pass on the run's summary page
        if: always()
        run: '[ -f miri.md ] && cat miri.md >> "$GITHUB_STEP_SUMMARY" || true'
      - name: File an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          SHARD: ${{ matrix.shard }}
        run: |
          {
            echo "Miri found undefined behavior or a deadlock in the runtime's tests, in shard $SHARD of the nightly run, with \`-Zmiri-seed=$MIRI_SEED\`."
            echo
            echo '```'
            grep -A80 "::error::" miri.txt | head -200
            echo '```'
            echo
            echo "To run one again: \`MIRI_SEED=$MIRI_SEED MIRI_ONLY='<its name>' .github/scripts/miri.sh report.md\`."
          } > issue.md
          gh issue create --title "Miri found undefined behavior in the nightly run" --body-file issue.md --label "bug" --label "priority: now" --repo "$GITHUB_REPOSITORY"
