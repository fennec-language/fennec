[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
repository = "https://github.com/fennec-language/fennec"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
non_ascii_idents = "forbid"
trivial_numeric_casts = "deny"
unused_qualifications = "deny"
elided_lifetimes_in_paths = "deny"
unreachable_pub = "deny"

# Safety lints are "forbid": no attribute anywhere can switch them off. Tests get their
# exemptions only through clippy.toml.
[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
unwrap_used = "forbid"
expect_used = "forbid"
panic = "forbid"
unwrap_in_result = "forbid"
indexing_slicing = "forbid"
string_slice = "forbid"
todo = "forbid"
unimplemented = "forbid"
dbg_macro = "forbid"
exit = "forbid"
mod_module_files = "forbid"
allow_attributes = "forbid"
allow_attributes_without_reason = "deny"
mem_forget = "forbid"
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
# The allocator the runtime gives Fennec programs: fast for many small blocks, under MIT.
mimalloc = { version = "=0.1.52", default-features = false }
# Secure random bytes from the operating system, for `Entropy`, on every platform Fennec runs on.
# Reading them on Windows takes FFI, which Fennec's own crates forbid. Under MIT or Apache-2.0.
getrandom = { version = "=0.4.3", default-features = false }
# The work-stealing pool `parallel` runs on, for programs with tasks: well-tested Chase-Lev
# deques, which would be a lot of subtle code to write again. Under MIT or Apache-2.0.
rayon-core = { version = "=1.13.0", default-features = false }
# Switching a parked task's stack, for `parallel(server)`: the stack switch is a few lines of
# assembly per platform, with guard pages on every stack, in a small, well-audited crate whose
# `unsafe` stays its own. Our one use of `unsafe` with it is in fennec-parked. Without its
# `unwind` feature, a panic in a task stops the process in every build, as `panic=abort` does,
# and a task's stack is never unwound from outside it. Under MIT or Apache-2.0.
corosensei = { version = "=0.3.4", default-features = false, features = ["default-stack"] }
cranelift-codegen = "=0.137.0"
cranelift-frontend = "=0.137.0"
cranelift-jit = "=0.137.0"
cranelift-module = "=0.137.0"
cranelift-native = "=0.137.0"
cranelift-object = "=0.137.0"
fennec-bench = { path = "crates/bench" }
fennec-blake3 = { path = "crates/blake3" }
fennec-build = { path = "crates/build" }
fennec-check = { path = "crates/check" }
fennec-count = { path = "crates/count" }
fennec-fmt = { path = "crates/fmt" }
fennec-fuzz = { path = "crates/fuzz" }
fennec-ir = { path = "crates/ir" }
fennec-parked = { path = "crates/parked" }
fennec-jit = { path = "crates/jit" }
fennec-layout = { path = "crates/layout" }
fennec-llvm = { path = "crates/llvm" }
fennec-interp = { path = "crates/interp" }
fennec-runtime = { path = "crates/runtime" }
fennec-kit = { path = "crates/kit" }
fennec-lint = { path = "crates/lint" }
fennec-lsp = { path = "crates/lsp" }
fennec-re = { path = "crates/re" }
fennec-reference = { path = "crates/reference" }
fennec-syntax = { path = "crates/syntax" }

# Day-to-day builds skip debug info: they build and link faster, and errors still name a line.
[profile.dev]
debug = false

[profile.release]
lto = true
codegen-units = 1
strip = "symbols"
panic = "abort"
