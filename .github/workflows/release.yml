name: Release

# Pushing a tag like v0.1.0 builds `fennec` for each platform, attests where each archive
# came from, and publishes them with checksums as a GitHub release. A pull request that changes
# what goes in an archive builds them too, and tries each one with no toolchain around, but only
# a tag publishes.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - .github/scripts/windows.sh
      - .cargo/config.toml
      - THIRD-PARTY.md
      - .github/scripts/musl-runtime.sh
      - crates/fennec/src/aot.rs
      - crates/llvm/src/build.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # What a release build on Linux links a program with to make one that runs on its own: the
  # runtime libraries built for musl, and musl's start-up files and C library. Built on the
  # runner's own Ubuntu, since AlmaLinux has no C compiler for musl, and nothing here depends on
  # the machine's glibc.
  musl:
    name: Runtime for musl (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install musl's C compiler
        run: sudo apt-get install -y -q musl-tools
      - run: .github/scripts/musl-runtime.sh musl
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: musl-${{ matrix.target }}
          path: musl

  build:
    name: Build (${{ matrix.platform.target }}${{ matrix.copy == 'rebuild' && ', again' || '' }})
    needs: musl
    strategy:
      fail-fast: false
      matrix:
        # Each platform is built twice, the second time from a checkout somewhere else, on
        # another machine, and `reproducible` holds that both made the same archive. Windows
        # isn't yet: its paths aren't taken out of what it builds.
        copy: [release, rebuild]
        exclude:
          - copy: rebuild
            platform: { os: windows-latest, target: x86_64-pc-windows-gnullvm }
        platform:
          # Linux's are built and tried on AlmaLinux 8, so they run with glibc 2.28 and later: RHEL
          # 8 and later, Debian 10 and later, Ubuntu 20.04 and later. Built on the runner's own
          # Ubuntu, `fennec` needed glibc 2.39, and the runtime 2.38 to link a program.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, container: "almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, container: "almalinux:8@sha256:2d0f2eb2a83cc09dbc2eb92fade4dbe8f709628149e81aa00aec70630406603b" }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # On an Intel Mac, so its archive is tried on the machine it's for.
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          # Programs link with LLD and MinGW-w64's libraries there: see `.github/scripts/windows.sh`.
          - { os: windows-latest, target: x86_64-pc-windows-gnullvm }
    runs-on: ${{ matrix.platform.os }}
    container: ${{ matrix.platform.container }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: ${{ matrix.copy == 'rebuild' && 'second-copy' || '.' }}
    steps:
      # A container has none of the runner's tools: a C compiler for mimalloc, git, and rustup,
      # which takes the toolchain `rust-toolchain.toml` names when it's first used.
      - name: Set up the container
        if: matrix.platform.container
        # Before the checkout, so not in the second copy's folder, which isn't there yet.
        working-directory: .
        run: |
          dnf install -y -q gcc gcc-c++ make git tar gzip findutils diffutils
          curl -sSfL --retry 3 https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: ${{ matrix.copy == 'rebuild' && 'second-copy' || '' }}
      # The same commit builds the same bytes wherever it's checked out and whenever. C's
      # `__DATE__` is the commit's, and no path of this machine's is left in what's built: not in
      # what's compiled from C, through flags for this target that add to `.cargo/config.toml`'s.
      - name: Build the same wherever and whenever
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: |
          # In a container the checkout is someone else's, which git won't read without being told.
          epoch="$(git -c safe.directory="$PWD" log -1 --format=%ct)"
          [ -n "$epoch" ] || { echo "::error::couldn't tell when the commit was made"; exit 1; }
          echo "SOURCE_DATE_EPOCH=$epoch" >> "$GITHUB_ENV"
          if [ "$RUNNER_OS" = Windows ]; then
            echo "RUSTFLAGS=-C target-feature=+crt-static" >> "$GITHUB_ENV"
          else
            cargo_home="${CARGO_HOME:-$HOME/.cargo}"
            flags="--remap-path-prefix=$PWD=/fennec --remap-path-prefix=$cargo_home=/cargo --remap-path-prefix=${RUSTUP_HOME:-$HOME/.rustup}=/rustup"
            # macOS's linker names a program by a hash of it before it's stripped, which notes
            # where each object it linked was and when it was made: the checkout's path is taken
            # out of those, and their times are zero.
            if [ "$RUNNER_OS" = macOS ]; then
              flags="$flags -C link-arg=-Wl,-reproducible -C link-arg=-Wl,-oso_prefix,$PWD/"
              echo "ZERO_AR_DATE=1" >> "$GITHUB_ENV"
            fi
            echo "RUSTFLAGS=$flags" >> "$GITHUB_ENV"
            echo "CFLAGS_${TARGET//-/_}=-ffile-prefix-map=$cargo_home=/cargo -ffile-prefix-map=$PWD=/fennec" >> "$GITHUB_ENV"
          fi
      - name: Install the toolchain `rust-toolchain.toml` names
        if: matrix.platform.container
        run: rustup toolchain install
      - name: Use Rust's gnullvm toolchain and llvm-mingw
        if: runner.os == 'Windows'
        shell: bash
        run: .github/scripts/windows.sh toolchain
      - run: rustup target add ${{ matrix.platform.target }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: runner.os == 'Linux'
        with:
          name: musl-${{ matrix.platform.target }}
          path: ${{ matrix.copy == 'rebuild' && 'second-copy/musl' || 'musl' }}
      # `fennec build` links executables against the runtime library, shipped next to `fennec`.
      - run: cargo build --release --locked -p fennec -p fennec-runtime --target ${{ matrix.platform.target }}
      # The runtime with threads, for programs that use `parallel`, also next to `fennec`. Built
      # on its own, in a folder of its own: built with the others, Cargo would give all of them
      # `threads`.
      - name: Build the runtime library with threads
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: |
          cargo rustc --release --locked -p fennec-runtime --features threads --target "$TARGET" --target-dir target/threads --crate-type staticlib -- --emit=llvm-bc,link -C lto=fat -C codegen-units=1
          cp "target/threads/$TARGET/release/libfennec_runtime.a" "target/$TARGET/release/libfennec_runtime_threads.a"
          cp "$(find "target/threads/$TARGET/release/deps" -name 'fennec_runtime-*.bc' -print -quit)" "target/$TARGET/release/libfennec_runtime_threads.bc"
      # A release build puts what it uses of the runtime in the program's own unit, from this.
      - name: Build the runtime's bitcode
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: |
          cargo rustc --release --locked -p fennec-runtime --target "$TARGET" --crate-type staticlib -- --emit=llvm-bc,link -C lto=fat -C codegen-units=1
          cp "$(find "target/$TARGET/release/deps" -name 'fennec_runtime-*.bc' -print -quit)" "target/$TARGET/release/libfennec_runtime.bc"
      # LLVM's tools for the target's own machine, as `fennec` runs them. An archive lays them out
      # as the toolchain does, which is where `fennec` looks: see `Tools::find`.
      - name: Install LLVM's tools for this platform
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel-$TARGET" --profile minimal --component llvm-tools-preview --force-non-host --no-self-update
          echo "TOOLCHAIN=$(rustup show home)/toolchains/$channel-$TARGET" >> "$GITHUB_ENV"
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.platform.target }}
        run: |
          # A pull request's ref has a slash in it.
          name="fennec-${GITHUB_REF_NAME//\//-}-${TARGET}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE RUNTIME-LIBRARY-EXCEPTION THIRD-PARTY.md "$name/"
          from="target/${TARGET}/release"
          for runtime in libfennec_runtime libfennec_runtime_threads; do
            cp "$from/$runtime.a" "$from/$runtime.bc" "$name/"
          done
          mkdir -p "$name/licenses"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "$from/fennec.exe" "$name/"
            # LLVM's tools from Rust's MSVC toolchain, LLD, and the libraries it links.
            .github/scripts/windows.sh folder "$name/llvm"
            TOOLCHAIN="$(rustup show home)/toolchains/$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)-x86_64-pc-windows-msvc"
            cp licenses/mingw-w64-runtime.txt "$name/licenses/"
          else
            cp "$from/fennec" "$name/"
            tools="$TOOLCHAIN/lib/rustlib/$TARGET"
            mkdir -p "$name/llvm/bin" "$name/llvm/lib"
            cp "$tools"/bin/{opt,llc,llvm-link} "$name/llvm/bin/"
            # The tools share LLVM from a library of their own, which they find in `../lib`.
            cp "$TOOLCHAIN"/lib/libLLVM* "$name/llvm/lib/"
          fi
          # On Linux, what a release build links a program with to make one that runs on its own.
          # Its programs hold musl's notices themselves, and the archive has them too.
          if [ -d musl ]; then
            cp -R musl "$name/musl"
            cp licenses/musl.txt "$name/licenses/"
          fi
          licenses="$TOOLCHAIN/share/doc/rust/licenses"
          cp "$licenses/Apache-2.0.txt" "$licenses/LLVM-exception.txt" "$licenses/NCSA.txt" "$name/licenses/"
          cp "$TOOLCHAIN/share/doc/rust/COPYRIGHT.html" "$name/licenses/rust-COPYRIGHT.html"
          archive="$(.github/scripts/pack.sh "$name")"
          echo "ARCHIVE=$archive" >> "$GITHUB_ENV"
          echo "PACKAGED=$name" >> "$GITHUB_ENV"
          ls -l "$archive"
      # What a user gets: the archive's own tools, with Rust's toolchain, llvm-mingw and Visual
      # Studio out of reach and a Fennec home with nothing in it. On macOS and Linux, `cc` is still
      # the system's, which links; on Windows, the archive's own LLD links.
      - name: Try the archive with no toolchain around
        if: matrix.copy == 'release'
        shell: bash
        run: |
          reach="$(printf '%s' "$PATH" | tr ':' '\n' | grep -viE 'cargo|rustup|mingw|visual studio' | paste -sd: -)"
          fennec="$PWD/$PACKAGED/fennec"
          source="$PWD/examples"
          cd "$RUNNER_TEMP"
          try() {
            echo "--- $*" >&2
            env PATH="$reach" RUSTUP_HOME="$RUNNER_TEMP/no-rustup" CARGO_HOME="$RUNNER_TEMP/no-cargo" \
              FENNEC_HOME="$RUNNER_TEMP/fennec-home" "$@"
          }
          try "$fennec" build "$source/hello.fen" -o hello
          [ "$(try ./hello)" = "$(cat "$source/hello.out")" ]
          try "$fennec" build --release "$source/hello.fen" -o hello_release
          [ "$(try ./hello_release)" = "$(cat "$source/hello.out")" ]
          try "$fennec" build "$source/parallel_loops.fen" -o threads
          [ "$(try ./threads | sort)" = "$(sort "$source/parallel_loops.out")" ]
          try "$fennec" build --release "$source/parallel_loops.fen" -o threads_release
          [ "$(try ./threads_release | sort)" = "$(sort "$source/parallel_loops.out")" ]
          # On Linux, a release build asks for no loader, so it runs with nothing from the machine.
          if [ "$RUNNER_OS" = Linux ]; then
            for program in hello_release threads_release; do
              ! grep -q 'ld-linux' "$program" || { echo "$program asks for the system's loader"; exit 1; }
            done
            [ "$(env -i ./hello_release)" = "$(cat "$source/hello.out")" ]
            try "$fennec" notices hello_release | grep -q 'Rich Felker'
          fi
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v') && matrix.copy == 'release'
        with:
          subject-path: ${{ env.ARCHIVE }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.copy }}-${{ matrix.platform.target }}
          path: ${{ matrix.copy == 'rebuild' && 'second-copy/' || '' }}${{ env.ARCHIVE }}

  # The manifest is what gets signed, offline, by hand: see docs/releases.md. Until it's signed,
  # the launcher won't install the release. A pull request writes one too, so a change to the
  # archives' names fails there rather than at a release.
  manifest:
    name: Write the release's manifest
    if: github.event_name != 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain `rust-toolchain.toml` names
        run: rustup toolchain install
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      # Named as the archives are: by the tag, or for a pull request by its number.
      - run: |
          name="${GITHUB_REF_NAME//\//-}"
          mkdir manifest
          cargo run --release --locked -q -p fennec-dist -- manifest toolchain "${name#v}" dist/fennec-* > "manifest/fennec-$name.manifest"
          cat "manifest/fennec-$name.manifest"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: manifest
          path: manifest

  # Each archive built twice is the same bytes, so anyone can build a release from its tag and
  # check it's the one that was signed. Where one isn't, this says which files differ.
  reproducible:
    name: Built twice, the same
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: first
          pattern: release-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: second
          pattern: rebuild-*
          merge-multiple: true
      - run: |
          differ=0
          for again in second/*; do
            archive="${again#second/}"
            if cmp -s "first/$archive" "$again"; then
              echo "the same: $archive $(sha256sum < "$again" | cut -c1-16)"
              continue
            fi
            differ=1
            echo "::error::$archive isn't the same built twice"
            mkdir -p "unpacked/first" "unpacked/second"
            tar xzf "first/$archive" -C unpacked/first
            tar xzf "$again" -C unpacked/second
            diff -rq unpacked/first unpacked/second || true
            rm -rf unpacked
          done
          exit "$differ"

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, manifest, reproducible]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: release-*
          merge-multiple: true
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: manifest
          path: dist
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --prerelease
