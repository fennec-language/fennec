# The twin of the kernel in `bench/server`. Not part of the workspace: it's what Fennec is measured
# against, with the standard library and a thread for each connection. socket2 only sets how many
# connections may wait to be taken, which std's `bind` fixes at 128 and Fennec and Go leave to the
# system, so a burst of them finds the same queue on every side.
[package]
name = "fennec-server-twins"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
socket2 = { version = "=0.6.5", default-features = false }

[[bin]]
name = "echo"
path = "echo.rs"
