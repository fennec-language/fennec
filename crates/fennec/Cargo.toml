[package]
name = "fennec"
description = "The fennec command: run, test and start Fennec programs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
# The tests are one binary, tests/main.rs, not one per file.
autotests = false

[[test]]
name = "fennec"
path = "tests/main.rs"

[dependencies]
mimalloc.workspace = true
fennec-blake3.workspace = true
fennec-build.workspace = true
fennec-check.workspace = true
fennec-deps.workspace = true
fennec-count.workspace = true
fennec-fmt.workspace = true
fennec-rt.workspace = true
fennec-ir.workspace = true
fennec-llvm.workspace = true
fennec-kit.workspace = true
fennec-lint.workspace = true
fennec-reference.workspace = true
fennec-lsp.workspace = true
fennec-syntax.workspace = true

[target.'cfg(windows)'.dependencies]
# Lets Ctrl-C go by while `fennec run`'s program stops, as the program sees it too.
ctrlc.workspace = true

[dev-dependencies]
fennec-temp.workspace = true

[lints]
workspace = true

[build-dependencies]
fennec-blake3.workspace = true
