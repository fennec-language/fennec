name: Mutation tests

# cargo-mutants changes the code in small ways (flipping a comparison, returning a default,
# deleting a statement) and checks that some test fails each time. A change no test notices
# is a gap in the tests. Pull requests check only the code they change. Every night, and on demand,
# a slice of each of the checker, the IR, the LLVM backend and the runtime is mutated, a different
# slice each night, so each crate is all done in 125 to 290 nights: what no test caught is ranked
# by file on the run's summary page and in the morning's nightly report. Survivors are reported,
# never failed on. A mutant runs its own crate's tests and a small set that runs programs end to end
# (`.github/scripts/mutants-tests.sh`), under nextest, which stops at the first failure.
on:
  pull_request:
    # A draft is skipped, so it runs once the pull request is ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["crates/**", "examples/**", "Cargo.*", ".github/workflows/mutants.yml"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels its older run. Anything else, like a push to
# main or a merge group, gets a group of its own: a group keeps only its newest waiting run, so
# sharing one would drop some.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Tests check this to sample their slowest corpora: every mutant runs every test.
  FENNEC_UNDER_MUTANTS: "1"
  # LLVM is the main backend, so a mutant in it has to meet its tests: a missing tool or runtime
  # library fails them instead of skipping them.
  FENNEC_EXPECT_LLVM: "1"

jobs:
  changed-code:
    name: Mutate the changed code
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # At most three at once, so it can't take the runners required checks are waiting for. The rest
    # wait, holding no runner, and none is dropped. Which of the three a pull request waits for goes
    # by the last digit of its number. A newer push still cancels its older run, waiting or not.
    concurrency:
      group: mutants-changed-code-${{ (endsWith(github.event.pull_request.number, '0') || endsWith(github.event.pull_request.number, '3') || endsWith(github.event.pull_request.number, '6') || endsWith(github.event.pull_request.number, '9')) && 'a' || (endsWith(github.event.pull_request.number, '1') || endsWith(github.event.pull_request.number, '4') || endsWith(github.event.pull_request.number, '7')) && 'b' || 'c' }}
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Diff against the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff "$BASE" -- crates > changes.diff
      - name: Run the tests a mutant runs, unmutated, for its limit
        id: baseline
        run: echo "limit=$(.github/scripts/mutants-baseline.sh --diff changes.diff)" >> "$GITHUB_OUTPUT"
      - name: Mutate
        env:
          LIMIT: ${{ steps.baseline.outputs.limit }}
        run: |
          # The changed packages' own tests and the end-to-end set, each mutant's limited to five
          # times what they took unmutated. The run is held to 12 GB, as the nightly's is, so a
          # mutant's runaway can't take the runner down.
          { read -r packages; read -r filter; } < <(.github/scripts/mutants-tests.sh --diff changes.diff)
          status=0
          .github/scripts/memory-held.sh 12G \
            cargo mutants --in-diff changes.diff --no-shuffle --jobs 2 --baseline=skip --timeout "$LIMIT" \
            --test-package "$packages" --cargo-test-arg=-E --cargo-test-arg="$filter" || status=$?
          # A mutant that changes nothing a test can see, as the list says, isn't missed.
          .github/scripts/mutants-equivalent.sh mutants.out
          # A timeout is neither caught nor missed, and a run where most timed out checked next to
          # nothing, so it fails.
          verdict=0
          .github/scripts/mutants-verdict.sh mutants.out > verdict.txt 2>&1 || verdict=1
          tee -a "$GITHUB_STEP_SUMMARY" < verdict.txt
          [ "$verdict" -eq 0 ] || exit 1
          # 2 means a mutant no test caught, and 3 one that timed out, which cargo-mutants says over
          # 2, so the misses are read from its list. Anything else, as 4 for a baseline that
          # failed, means the run didn't test what it should.
          [ ! -s mutants.out/missed.txt ] || exit 2
          case "$status" in 0 | 2 | 3) ;; *) exit "$status" ;; esac
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-changed-code
          path: mutants.out
          retention-days: 14

  nightly:
    name: Mutate tonight's slice of ${{ matrix.crate }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # The tests unmutated, under three hours of mutating, then the report.
    timeout-minutes: 210
    strategy:
      fail-fast: false
      # One runner a crate, at night, when few pull requests wait for one.
      max-parallel: 4
      # Each crate in slices of about 40 mutants, which a runner tries in about two and a quarter
      # hours. On 2026-11-20 it tried 17 to 19 an hour, for each crate, and the slices it tried
      # put fennec-check at about 7,300 mutants, fennec-ir at 5,000, fennec-llvm at 6,400 and
      # fennec-rt at 11,600.
      matrix:
        include:
          - { crate: fennec-check, slices: 180 }
          - { crate: fennec-ir, slices: 125 }
          - { crate: fennec-llvm, slices: 160 }
          - { crate: fennec-rt, slices: 290 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-mutants@27.1.0,cargo-nextest@0.9.151
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Each crate has thousands of mutants, and each takes minutes to build and test, so a night
      # takes one slice of each: the day's number since 1970, modulo the crate's slices.
      - name: Pick tonight's slice
        id: slice
        env:
          SLICES: ${{ matrix.slices }}
        run: echo "index=$(( $(date -u +%s) / 86400 % SLICES ))" >> "$GITHUB_OUTPUT"
      - name: Run the tests a mutant runs, unmutated, for its limit
        id: baseline
        env:
          CRATE: ${{ matrix.crate }}
        run: echo "limit=$(.github/scripts/mutants-baseline.sh "$CRATE")" >> "$GITHUB_OUTPUT"
      - name: Mutate it, for three hours at most
        env:
          CRATE: ${{ matrix.crate }}
          INDEX: ${{ steps.slice.outputs.index }}
          SLICES: ${{ matrix.slices }}
          LIMIT: ${{ steps.baseline.outputs.limit }}
        run: |
          # A slice still going at 165 minutes is told to stop, as Ctrl-C does, and has 15 more to
          # finish the mutants it's testing: cargo-mutants writes each outcome as it comes, so what
          # it found is kept either way. What the tests missed is reported, not failed on. A mutant
          # runs the crate's own tests and the end-to-end set, limited to five times what they took
          # unmutated. A timeout is neither caught nor missed.
          #
          # A mutant can make a program a test runs allocate without end. Watched on 2026-11-20,
          # one grew to 14 GB, all a runner has, in 9 to 26 seconds, six times in one slice of
          # fennec-ir and once in one of fennec-llvm. On the nights before, nothing stopped it,
          # so the runner went and the job was lost with no logs. The run is held to 12 GB, so the
          # kernel stops the runaway, which fails its test as a mutant should, and the runner lives.
          { read -r packages; read -r filter; } < <(.github/scripts/mutants-tests.sh "$CRATE")
          status=0
          .github/scripts/memory-held.sh 12G timeout --signal=INT --kill-after=900 9900 \
            cargo mutants --package "$CRATE" --shard "$INDEX/$SLICES" --jobs 2 --baseline=skip --timeout "$LIMIT" \
            --test-package "$packages" --cargo-test-arg=-E --cargo-test-arg="$filter" || status=$?
          # 0: every mutant caught. 2: some missed. 3: some timed out. 124: it was told to stop at
          # 165 minutes, and 137: it was stopped 15 minutes after. Anything else means the slice
          # wasn't tested.
          case "$status" in 0 | 2 | 3 | 124 | 137) ;; *) echo "error: cargo-mutants exited $status" >&2; exit "$status" ;; esac
          # A mutant that changes nothing a test can see, as the list says, isn't missed.
          .github/scripts/mutants-equivalent.sh mutants.out
      - name: Rank what no test caught
        if: always()
        env:
          CRATE: ${{ matrix.crate }}
          INDEX: ${{ steps.slice.outputs.index }}
          SLICES: ${{ matrix.slices }}
        run: |
          .github/scripts/mutants-ranked.sh mutants.out "$CRATE" "$INDEX/$SLICES" > ranked.md
          cat ranked.md >> "$GITHUB_STEP_SUMMARY"
      # A slice where most mutants that built timed out checked next to nothing, so the night fails.
      - name: Fail if most timed out
        if: always()
        run: .github/scripts/mutants-verdict.sh mutants.out
      # `nightly-report.sh` reads these into the morning's report.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-nightly-${{ matrix.crate }}
          path: |
            ranked.md
            mutants.out
          retention-days: 14
