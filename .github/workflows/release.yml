name: Release

# Pushing a tag like v0.1.0 builds `fennec` for each platform, attests where each archive
# came from, and publishes them with checksums as a GitHub release. A pull request that changes
# what goes in an archive builds them too, and tries each one with no toolchain around, but only
# a tag publishes.
on:
  push:
    tags: ["v*"]
  pull_request:
    paths:
      - .github/workflows/release.yml
      - THIRD-PARTY.md
      - crates/fennec/src/aot.rs
      - crates/llvm/src/build.rs
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux's are built and tried on Debian 11, so they run with glibc 2.31 and later: Ubuntu
          # 20.04 and later, Debian 11 and later, RHEL 9. Built on the runner's own Ubuntu 24.04,
          # `fennec` needed glibc 2.39, and the runtime 2.38 to link a program.
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, container: "debian:bullseye@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, container: "debian:bullseye@sha256:6f519a81440354a85eb592c5f32109ab80605f6b892455983a6f618bf87fabe9" }
          - { os: macos-latest, target: aarch64-apple-darwin }
          # On an Intel Mac, so its archive is tried on the machine it's for.
          - { os: macos-15-intel, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    timeout-minutes: 60
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # A container has none of the runner's tools: a C compiler for mimalloc, git, and rustup,
      # which takes the toolchain `rust-toolchain.toml` names when it's first used.
      - name: Set up the container
        if: matrix.container
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends build-essential ca-certificates curl git
          curl -sSfL --retry 3 https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal --no-modify-path
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install the toolchain `rust-toolchain.toml` names
        if: matrix.container
        run: rustup toolchain install
      - run: rustup target add ${{ matrix.target }}
      # `fennec build` links executables against the runtime library, shipped next to `fennec`.
      - run: cargo build --release --locked -p fennec -p fennec-runtime --target ${{ matrix.target }}
      # The runtime with threads, for programs that use `parallel`, also next to `fennec`. Built
      # on its own, in a folder of its own: built with the others, Cargo would give all of them
      # `threads`.
      - name: Build the runtime library with threads
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo rustc --release --locked -p fennec-runtime --features threads --target "$TARGET" --target-dir target/threads --crate-type staticlib -- --emit=llvm-bc,link -C lto=fat -C codegen-units=1
          cp "target/threads/$TARGET/release/libfennec_runtime.a" "target/$TARGET/release/libfennec_runtime_threads.a"
          cp "$(find "target/threads/$TARGET/release/deps" -name 'fennec_runtime-*.bc' -print -quit)" "target/$TARGET/release/libfennec_runtime_threads.bc"
      # A release build puts what it uses of the runtime in the program's own unit, from this.
      - name: Build the runtime's bitcode
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          cargo rustc --release --locked -p fennec-runtime --target "$TARGET" --crate-type staticlib -- --emit=llvm-bc,link -C lto=fat -C codegen-units=1
          cp "$(find "target/$TARGET/release/deps" -name 'fennec_runtime-*.bc' -print -quit)" "target/$TARGET/release/libfennec_runtime.bc"
      # The runtimes with no interpreter, which `fennec build` uses for every program that doesn't
      # cross into it, also next to `fennec`, each in a folder of its own.
      - name: Build the runtime libraries with no interpreter
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          for features in lean lean,threads; do
            dir="target/$(echo "$features" | tr , -)"
            name="libfennec_runtime_$(echo "$features" | tr , _)"
            cargo rustc --release --locked -p fennec-runtime --features "$features" --target "$TARGET" --target-dir "$dir" --crate-type staticlib -- --emit=llvm-bc,link -C lto=fat -C codegen-units=1
            cp "$dir/$TARGET/release/libfennec_runtime.a" "target/$TARGET/release/$name.a"
            cp "$(find "$dir/$TARGET/release/deps" -name 'fennec_runtime-*.bc' -print -quit)" "target/$TARGET/release/$name.bc"
          done
      # LLVM's tools for the target's own machine, as `fennec` runs them. An archive lays them out
      # as the toolchain does, which is where `fennec` looks: see `Tools::find`.
      - name: Install LLVM's tools for this platform
        if: runner.os != 'Windows'
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          channel="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$channel-$TARGET" --profile minimal --component llvm-tools-preview --force-non-host --no-self-update
          echo "TOOLCHAIN=$(rustup show home)/toolchains/$channel-$TARGET" >> "$GITHUB_ENV"
      - name: Package
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          # A pull request's ref has a slash in it.
          name="fennec-${GITHUB_REF_NAME//\//-}-${TARGET}"
          mkdir "$name"
          cp README.md LICENSE-MIT LICENSE-APACHE RUNTIME-LIBRARY-EXCEPTION THIRD-PARTY.md "$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp "target/${TARGET}/release/fennec.exe" "$name/"
            7z a "$name.zip" "$name" > /dev/null
            echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV"
          else
            cp "target/${TARGET}/release/fennec" "target/${TARGET}/release/libfennec_runtime.a" "target/${TARGET}/release/libfennec_runtime.bc" \
              "target/${TARGET}/release/libfennec_runtime_threads.a" "target/${TARGET}/release/libfennec_runtime_threads.bc" \
              "target/${TARGET}/release/libfennec_runtime_lean.a" "target/${TARGET}/release/libfennec_runtime_lean.bc" \
              "target/${TARGET}/release/libfennec_runtime_lean_threads.a" "target/${TARGET}/release/libfennec_runtime_lean_threads.bc" "$name/"
            tools="$TOOLCHAIN/lib/rustlib/$TARGET"
            mkdir -p "$name/llvm/bin" "$name/llvm/lib" "$name/licenses"
            cp "$tools"/bin/{opt,llc,llvm-link} "$name/llvm/bin/"
            # The tools share LLVM from a library of their own, which they find in `../lib`.
            cp "$TOOLCHAIN"/lib/libLLVM* "$name/llvm/lib/"
            licenses="$TOOLCHAIN/share/doc/rust/licenses"
            cp "$licenses/Apache-2.0.txt" "$licenses/LLVM-exception.txt" "$licenses/NCSA.txt" "$name/licenses/"
            cp "$TOOLCHAIN/share/doc/rust/COPYRIGHT.html" "$name/licenses/rust-COPYRIGHT.html"
            tar czf "$name.tar.gz" "$name"
            echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV"
          fi
          echo "PACKAGED=$name" >> "$GITHUB_ENV"
          ls -l "$name.zip" "$name.tar.gz" 2> /dev/null || true
      # What a user gets: the archive's own tools, with Rust's toolchain out of reach and a Fennec
      # home with nothing in it. `cc` is still the system's, which links. Windows' archive doesn't
      # build programs yet.
      - name: Try the archive with no toolchain around
        if: runner.os != 'Windows'
        shell: bash
        run: |
          reach="$(printf '%s' "$PATH" | tr ':' '\n' | grep -viE 'cargo|rustup' | paste -sd: -)"
          fennec="$PWD/$PACKAGED/fennec"
          source="$GITHUB_WORKSPACE/examples"
          cd "$RUNNER_TEMP"
          try() {
            echo "--- $*" >&2
            env PATH="$reach" RUSTUP_HOME="$RUNNER_TEMP/no-rustup" CARGO_HOME="$RUNNER_TEMP/no-cargo" \
              FENNEC_HOME="$RUNNER_TEMP/fennec-home" "$@"
          }
          # `--llvm` is what a build said before every build went through LLVM; both take it.
          try "$fennec" build --llvm "$source/hello.fen" -o hello
          [ "$(try ./hello)" = "$(cat "$source/hello.out")" ]
          try "$fennec" build --llvm --release "$source/hello.fen" -o hello_release
          [ "$(try ./hello_release)" = "$(cat "$source/hello.out")" ]
          try "$fennec" build --llvm "$source/parallel_loops.fen" -o threads
          [ "$(try ./threads | sort)" = "$(sort "$source/parallel_loops.out")" ]
          try "$fennec" build --llvm --release "$source/parallel_loops.fen" -o threads_release
          [ "$(try ./threads_release | sort)" = "$(sort "$source/parallel_loops.out")" ]
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          subject-path: ${{ env.ARCHIVE }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum -- * > SHA256SUMS
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes --prerelease
