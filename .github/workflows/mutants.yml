name: Mutation tests

# cargo-mutants changes the code in small ways (flipping a comparison, returning a default,
# deleting a statement) and checks that some test fails each time. A change no test notices
# is a gap in the tests. Pull requests check only the code they change. Every night, and on demand,
# a sixtieth of each of the checker, the IR, the LLVM backend and the runtime is mutated, a
# different sixtieth each night, so all of them are in two months: what no test caught is ranked
# by file on the run's summary page and in the morning's nightly report. Survivors are reported,
# never failed on.
on:
  pull_request:
    # A draft is skipped, so it runs once the pull request is ready for review.
    types: [opened, synchronize, reopened, ready_for_review]
    paths: ["crates/**", "examples/**", "Cargo.*", ".github/workflows/mutants.yml"]
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same pull request cancels its older run. Anything else, like a push to
# main or a merge group, gets a group of its own: a group keeps only its newest waiting run, so
# sharing one would drop some.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Tests check this to sample their slowest corpora: every mutant runs every test.
  FENNEC_UNDER_MUTANTS: "1"
  # LLVM is the main backend, so a mutant in it has to meet its tests: a missing tool or runtime
  # library fails them instead of skipping them.
  FENNEC_EXPECT_LLVM: "1"

jobs:
  changed-code:
    name: Mutate the changed code
    if: github.event_name == 'pull_request' && !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # At most three at once, so it can't take the runners required checks are waiting for. The rest
    # wait, holding no runner, and none is dropped. Which of the three a pull request waits for goes
    # by the last digit of its number. A newer push still cancels its older run, waiting or not.
    concurrency:
      group: mutants-changed-code-${{ (endsWith(github.event.pull_request.number, '0') || endsWith(github.event.pull_request.number, '3') || endsWith(github.event.pull_request.number, '6') || endsWith(github.event.pull_request.number, '9')) && 'a' || (endsWith(github.event.pull_request.number, '1') || endsWith(github.event.pull_request.number, '4') || endsWith(github.event.pull_request.number, '7')) && 'b' || 'c' }}
      queue: max
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-mutants@27.1.0
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Diff against the base branch
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: git diff "$BASE" -- crates > changes.diff
      - name: Mutate
        run: |
          status=0
          # Each mutant runs the whole workspace's tests, which take about two and a half minutes
          # here with FENNEC_UNDER_MUTANTS set and two running at once. A timeout counts as caught,
          # so it has to mean a hang, not a slow run: the limit is well past what a run takes, and
          # the same limit lets the baseline finish. Lower it only with those times in hand.
          cargo mutants --in-diff changes.diff --no-shuffle --timeout 420 --jobs 2 || status=$?
          # 3 means some mutations made the tests hang, which still counts as noticing them.
          # It wins over 2 (missed), so check for misses separately.
          if [ "$status" -eq 3 ] && [ ! -s mutants.out/missed.txt ]; then status=0; fi
          exit "$status"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-changed-code
          path: mutants.out
          retention-days: 14

  nightly:
    name: Mutate tonight's slice of ${{ matrix.crate }}
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    # Three hours of mutating, then the report.
    timeout-minutes: 210
    strategy:
      fail-fast: false
      # One runner a crate, at night, when few pull requests wait for one.
      max-parallel: 4
      matrix:
        crate: [fennec-check, fennec-ir, fennec-llvm, fennec-rt]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@1e29709c0ec63babbe8f266397a465f29a825f91 # v2.87.31
        with:
          tool: cargo-mutants@27.1.0
      - run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      # Each crate has thousands of mutants and each runs every test, about two and a half minutes
      # here, so a night takes a sixtieth of each: the day's number since 1970, modulo 60.
      - name: Pick tonight's slice
        id: slice
        run: echo "index=$(( $(date -u +%s) / 86400 % 60 ))" >> "$GITHUB_OUTPUT"
      - name: Mutate it, for three hours at most
        env:
          CRATE: ${{ matrix.crate }}
          INDEX: ${{ steps.slice.outputs.index }}
        run: |
          # A slice still going at three hours is stopped as Ctrl-C stops it, keeping what it found:
          # cargo-mutants writes each outcome as it comes. What the tests missed is reported, not
          # failed on, and a hang counts as caught.
          timeout --signal=INT --kill-after=120 10800 \
            cargo mutants --package "$CRATE" --shard "$INDEX/60" --baseline=skip --timeout 420 --jobs 2 || true
      - name: Rank what no test caught
        if: always()
        env:
          CRATE: ${{ matrix.crate }}
          INDEX: ${{ steps.slice.outputs.index }}
        run: |
          .github/scripts/mutants-ranked.sh mutants.out "$CRATE" "$INDEX/60" > ranked.md
          cat ranked.md >> "$GITHUB_STEP_SUMMARY"
      # `nightly-report.sh` reads these into the morning's report.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: mutants-nightly-${{ matrix.crate }}
          path: |
            ranked.md
            mutants.out
          retention-days: 14
