name: Proofs

# Every night, everything is built checking proofs: each check the compiler leaves out because it
# proved the check can't fail (an index inside its list, an add that can't overflow, a divisor
# that can't be zero, a list with one owner, room for a loop's appends) is written anyway, as an
# assertion that the proof held. A program that stops with "proof broken" has found a false proof:
# the compiler left out a check that could fail, which is the worst kind of bug it can have. Once
# `fennec` takes `FENNEC_STRIP_FACTS`, everything is built again with the facts handed to LLVM
# stripped, and must print the same. Every example, kit, fixture and 50 random programs also run with
# another hash seed, more threads and load, and recorded and replayed, and must print the same each
# way (`.github/scripts/determinism.sh`). Every program that uses threads runs under ThreadSanitizer too,
# with half an hour of random programs (`.github/scripts/tsan-programs.sh`). The night's report is kept as `nightly-report`, which
# `.github/scripts/nightly-report.sh` copies into the lanes' notes. No pull request waits on this.
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  FENNEC_CHECK_PROOFS: "1"

jobs:
  proofs:
    name: Every proof checked
    runs-on: ubuntu-latest
    timeout-minutes: 300
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM's tools
        run: rustup component add llvm-tools-preview
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build fennec, its runtime libraries and the fuzzer
        run: |
          cargo build --release --locked -p fennec -p fennec-runtime -p fennec-fuzz
          cargo build --release --locked -p fennec-runtime --features threads --target-dir target/threads
          cp target/threads/release/libfennec_runtime.a target/release/libfennec_runtime_threads.a
      - name: Build and run every example, kit and kernel, both ways
        id: builds
        run: .github/scripts/nightly-proofs.sh target/release/fennec report.md
      - name: Fuzz programs built through LLVM
        id: fuzz
        if: always()
        run: FENNEC="$PWD/target/release/fennec" ./target/release/fennec-fuzz run llvm --seed "$GITHUB_RUN_ID" --seconds 1200 --found found | tee fuzz.txt
      - name: Fuzz random programs for an hour, against what they should print
        id: programs
        if: always()
        run: FENNEC="$PWD/target/release/fennec" ./target/release/fennec-fuzz run programs --seed "$GITHUB_RUN_ID" --seconds 3600 --stuck 180 --found found | tee programs.txt
      - name: Run every program four ways, which must print the same
        id: determinism
        if: always()
        run: .github/scripts/determinism.sh target/release/fennec report.md 50
      - name: Check formatting takes time in proportion to the program
        id: timing
        if: always()
        run: cargo test --release --locked -p fennec-fmt --test fmt -- --ignored --exact examples::formats_a_big_program_in_time_in_proportion
      - name: Run every test
        id: tests
        if: always()
        run: |
          status=0
          cargo test --workspace --locked --no-fail-fast > tests.txt 2>&1 || status=$?
          tail -40 tests.txt
          if grep -q "proof broken" tests.txt; then
            echo "::error::a test's program broke a proof"
            grep -B4 -A8 "proof broken" tests.txt | head -200
            exit 1
          fi
          exit "$status"
      - name: Write the night's report
        if: always()
        env:
          BUILDS: ${{ steps.builds.outcome }}
          FUZZ: ${{ steps.fuzz.outcome }}
          PROGRAMS: ${{ steps.programs.outcome }}
          DETERMINISM: ${{ steps.determinism.outcome }}
          TIMING: ${{ steps.timing.outcome }}
          TESTS: ${{ steps.tests.outcome }}
        run: |
          {
            echo "# Proofs, $(date -u +%Y-%m-%d), $(git rev-parse --short HEAD)"
            echo
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            echo "Builds: $BUILDS. Fuzzing LLVM: $FUZZ. Random programs: $PROGRAMS. Determinism: $DETERMINISM. Formatting in proportion: $TIMING. Tests: $TESTS."
            echo
            [ -f report.md ] && cat report.md
            echo
            echo "## Fuzzing"
            grep -hE "inputs, [0-9]+ failures|broke a rule|crashed|got stuck" fuzz.txt programs.txt 2>/dev/null | sed 's/^/- /'
          } > nightly.md
          cat nightly.md >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-report
          path: nightly.md
      - name: Keep what was found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proofs-found
          path: |
            found
            tests.txt
          if-no-files-found: ignore
      - name: File an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            cat nightly.md
            echo
            echo "A program stopping with \"proof broken\" means the compiler left out a check that could fail. One printing otherwise with facts stripped means a fact handed to LLVM is wrong. One printing otherwise with another seed, thread count or load, or when replayed, isn't deterministic. What fuzzing found and the tests' output are in the run's artifact."
          } > issue.md
          gh issue create --title "A proof the compiler made broke" --body-file issue.md --label "bug" --label "priority: now" --repo "$GITHUB_REPOSITORY"

  # Every program that uses threads, launches tasks, or shares state, and the real programs, under
  # ThreadSanitizer, then half an hour of random programs under it: what CI's job runs, with more
  # fuzzing and a new seed each night. See `tsan-programs.sh`. A report fails it, and the issue
  # carries what was found.
  tsan:
    name: Programs under ThreadSanitizer
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: read
      issues: write
    env:
      NIGHTLY: nightly-2026-10-15
      FUZZ_SEED: ${{ github.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install LLVM's tools, and the nightly compiler ThreadSanitizer needs
        run: |
          rustup component add llvm-tools-preview
          rustup toolchain install "$NIGHTLY" --profile minimal --component rust-src
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Build fennec and the fuzzer, and the runtime libraries with ThreadSanitizer
        run: .github/scripts/tsan-runtime.sh
      - name: Run the programs that use threads, and random programs for half an hour
        run: .github/scripts/tsan-programs.sh target/release/fennec 1800 | tee tsan.txt
      - name: Keep what was found
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tsan-found
          path: |
            found
            tsan.txt
          if-no-files-found: ignore
      - name: File an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "ThreadSanitizer reported a data race, or a program under it printed something different, in the nightly run."
            echo
            echo '```'
            grep -A40 "::error::" tsan.txt | head -200
            echo '```'
            echo
            echo "What fuzzing found, and the whole output, are in the run's \`tsan-found\` artifact."
          } > issue.md
          gh issue create --title "ThreadSanitizer reported in the nightly run" --body-file issue.md --label "bug" --label "priority: now" --repo "$GITHUB_REPOSITORY"
