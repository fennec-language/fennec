# mimalloc, the allocator executables and `fennec` use, reserves address space for its arenas 64 MiB
# at a time instead of 1 GiB. Measured on the kernel suite: programs peak 2.5–4% lower and growing a long
# string is 9–15% faster. It's set here, as mimalloc's C is compiled, so every OS and every build gets the
# same. A builder's own `CFLAGS` replaces it, which the runtime's tests catch.
[env]
CFLAGS = "-DMI_DEFAULT_ARENA_RESERVE=65536"
